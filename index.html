<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Folietta Arcade</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout concept: a phone-shaped "game cabinet" stack of chunky, drop-shadowed
   cards and candy buttons (level-select tiles, press-down CTAs, coin-style
   score medallions) over Folietta's cream/burgundy restaurant palette, with a
   warm gold "coin" accent reserved for game feedback (streaks, scores, wins). */
:root{
  --bg:#fdf3e3; --bg-elev:#fffdf9; --bg-sunk:#fbe6c4;
  --ink:#2a1a14; --ink-soft:#7a5c4c; --ink-faint:#ab8f7c;
  --line:#f0d6a8; --accent:#c21f2f; --accent-deep:#8c1521; --accent-ink:#ffffff;
  --gold:#f0a93a; --gold-deep:#c07d12; --gold-ink:#3a2205;
  --success:#2f9e5b; --success-deep:#1f7a44; --success-bg:#e2f6ea;
  --danger:#e2543a; --danger-deep:#b23c26; --danger-bg:#fde6de;
  --warn:#9c6f12; --warn-bg:#fbedcb;
  --shadow:0 3px 0 rgba(0,0,0,.08), 0 8px 18px rgba(80,40,20,0.14);
  --radius:18px;
  --font-display:'Baloo 2',ui-rounded,'Segoe UI',sans-serif;
  --font-body:'Nunito','Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1410; --bg-elev:#2a2019; --bg-sunk:#241a13;
    --ink:#f6ecdf; --ink-soft:#d2b8a2; --ink-faint:#92776590;
    --line:#43301f; --accent:#e8596a; --accent-deep:#a93848; --accent-ink:#241410;
    --gold:#f3bc5c; --gold-deep:#b9842a; --gold-ink:#241404;
    --success:#6cd392; --success-deep:#3fa368; --success-bg:#17301f;
    --danger:#f0815f; --danger-deep:#b2492c; --danger-bg:#3a2016;
    --warn:#e3c35f; --warn-bg:#352a12;
    --shadow:0 3px 0 rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1410; --bg-elev:#2a2019; --bg-sunk:#241a13;
  --ink:#f6ecdf; --ink-soft:#d2b8a2; --ink-faint:#927765;
  --line:#43301f; --accent:#e8596a; --accent-deep:#a93848; --accent-ink:#241410;
  --gold:#f3bc5c; --gold-deep:#b9842a; --gold-ink:#241404;
  --success:#6cd392; --success-deep:#3fa368; --success-bg:#17301f;
  --danger:#f0815f; --danger-deep:#b2492c; --danger-bg:#3a2016;
  --warn:#e3c35f; --warn-bg:#352a12;
  --shadow:0 3px 0 rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,0.45);
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
}
*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body);
  margin:0; min-height:100vh;
}
#app{max-width:780px; margin:0 auto; padding:18px 16px 60px; position:relative;}
@keyframes viewIn{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
.view-enter{animation:viewIn .32s cubic-bezier(.22,.9,.3,1.1);}
@keyframes popIn{0%{opacity:0; transform:scale(.6) rotate(-6deg);} 70%{opacity:1; transform:scale(1.08) rotate(2deg);} 100%{opacity:1; transform:scale(1) rotate(0);}}
@keyframes bounceIn{0%{transform:translateY(0);} 30%{transform:translateY(-6px);} 55%{transform:translateY(0);} 75%{transform:translateY(-3px);} 100%{transform:translateY(0);}}
@keyframes pulseGlow{0%,100%{transform:scale(1);} 50%{transform:scale(1.12);}}
@keyframes shimmer{0%{transform:translateX(-120%);} 100%{transform:translateX(220%);}}
.brand{font-family:'Brush Script MT','Segoe Script',cursive; color:var(--accent); font-size:34px; text-align:center; margin:4px 0 0;
  text-shadow:0 2px 0 rgba(0,0,0,.08);}
.tagline{text-align:center; color:var(--ink-soft); font-weight:700; font-size:12.5px; letter-spacing:.03em; text-transform:uppercase; margin:0 0 18px;}
h1{font-family:var(--font-display); font-size:21px; font-weight:800; margin:0 0 4px; text-wrap:balance;}
h2{font-family:var(--font-display); font-size:15px; font-weight:700; margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent);}
p{line-height:1.55;}
.card{
  background:var(--bg-elev); border:2px solid var(--line); border-radius:var(--radius);
  padding:17px; margin-bottom:14px; box-shadow:var(--shadow);
}
.btn{
  font-family:var(--font-display); font-size:14.5px; font-weight:700; border-radius:14px; border:none;
  background:var(--accent); color:var(--accent-ink); padding:13px 20px; cursor:pointer;
  -webkit-tap-highlight-color:transparent; box-shadow:0 4px 0 var(--accent-deep), 0 7px 14px rgba(0,0,0,.16);
  transform:translateY(-2px); transition:transform .08s ease, box-shadow .08s ease; position:relative;
}
.btn:active{transform:translateY(1px); box-shadow:0 1px 0 var(--accent-deep), 0 2px 6px rgba(0,0,0,.14);}
.btn.secondary{background:var(--bg-elev); color:var(--accent); box-shadow:0 4px 0 var(--line), 0 7px 14px rgba(0,0,0,.08); border:2px solid var(--line);}
.btn.secondary:active{box-shadow:0 1px 0 var(--line), 0 2px 6px rgba(0,0,0,.08);}
.btn.gold{background:var(--gold); color:var(--gold-ink); box-shadow:0 4px 0 var(--gold-deep), 0 7px 14px rgba(0,0,0,.16);}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-deep), 0 2px 6px rgba(0,0,0,.14);}
.btn.ghost{background:transparent; color:var(--ink-soft); border:2px solid var(--line); box-shadow:none; transform:none;}
.btn.ghost:active{transform:scale(.97);}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:translateY(-2px) !important;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
.tile{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  background:var(--bg-elev); border:2px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:12px; cursor:pointer; box-shadow:var(--shadow); font-family:inherit;
  transform:translateY(-2px); transition:transform .1s ease, box-shadow .1s ease;
}
.tile:active{transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,.08), 0 2px 6px rgba(80,40,20,.1);}
.tile .emoji{font-size:32px; flex:none; width:46px; height:46px; display:flex; align-items:center; justify-content:center;
  background:var(--bg-sunk); border-radius:13px;}
.tile .t-name{font-family:var(--font-display); font-size:16.5px; font-weight:700; margin:0 0 2px; color:var(--ink);}
.tile .t-desc{font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.4;}
.pill{display:inline-block; font-family:var(--font-display); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
  padding:3px 9px; border-radius:999px; color:#fff;}
.muted{color:var(--ink-soft); font-size:13px;}
.small{font-size:12px;}
input[type=text], textarea{
  width:100%; font-family:var(--font-body); font-weight:600; font-size:15px; padding:12px 14px; border-radius:13px;
  border:2px solid var(--line); background:var(--bg-sunk); color:var(--ink);
}
input[type=text]:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
textarea{min-height:70px; resize:vertical;}
.pin-field{font-family:var(--font-display); font-size:30px; font-weight:800; letter-spacing:.5em; text-align:center; padding:14px 12px 14px 20px;}
@keyframes shake{10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(3px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);}}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97); border-color:var(--danger-deep) !important;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
.topbar .back{background:var(--bg-elev); border:2px solid var(--line); color:var(--accent); font-family:var(--font-display);
  font-weight:700; font-size:13px; cursor:pointer; padding:7px 12px; border-radius:11px; box-shadow:0 3px 0 var(--line);}
.topbar .back:active{transform:translateY(2px); box-shadow:none;}
.streak-badge{display:inline-flex; align-items:center; gap:4px; font-family:var(--font-display); font-weight:800; font-size:13px;
  color:var(--gold-ink); background:linear-gradient(180deg,var(--gold),var(--gold-deep)); padding:6px 11px 6px 8px; border-radius:999px;
  box-shadow:0 3px 0 var(--gold-deep); white-space:nowrap;}
.streak-badge.pulse{animation:pulseGlow .35s ease;}
.progress{height:14px; background:var(--bg-sunk); border-radius:999px; overflow:hidden; margin-bottom:14px; border:2px solid var(--line); position:relative;}
.progress > div{height:100%; background:linear-gradient(90deg,var(--gold),var(--accent)); transition:width .35s cubic-bezier(.3,.8,.4,1); position:relative; border-radius:999px;}
.progress > div::after{content:'';position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); animation:shimmer 1.8s ease-in-out infinite;}
.item-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:480px){.item-grid{grid-template-columns:1fr;}}
.item-card{
  border:2px solid var(--line); border-radius:15px; padding:11px 12px; cursor:pointer; position:relative;
  background:var(--bg-elev); box-shadow:0 3px 0 rgba(0,0,0,.05); transition:transform .1s ease, box-shadow .1s ease, border-color .1s ease, background .1s ease;
}
.item-card:active{transform:translateY(2px); box-shadow:none;}
.item-card.selected{border-color:var(--success); background:var(--success-bg); box-shadow:0 3px 0 var(--success-deep);}
.item-card.selected::after{content:'✓'; position:absolute; top:-9px; right:-9px; width:24px; height:24px; border-radius:50%;
  background:var(--success); color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 0 var(--success-deep); animation:popIn .25s ease;}
.item-card .iname{font-family:var(--font-display); font-weight:700; font-size:13.5px; margin:4px 0 2px;}
.item-card .idesc{font-size:11px; color:var(--ink-soft); line-height:1.3;}
.item-card .iprice{float:right; font-family:var(--font-display); font-size:11.5px; font-weight:800; color:var(--gold-deep);}
.cat-tabs{display:flex; gap:7px; overflow-x:auto; padding-bottom:8px; margin-bottom:10px;}
.cat-tab{flex:none; font-family:var(--font-display); font-weight:700; font-size:11.5px; padding:7px 13px; border-radius:999px; border:2px solid var(--line);
  background:var(--bg-elev); color:var(--ink-soft); cursor:pointer; white-space:nowrap; box-shadow:0 2px 0 var(--line);}
.cat-tab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent-deep); box-shadow:0 2px 0 var(--accent-deep);}
.tray{position:sticky; bottom:0; background:var(--bg-elev); border-top:3px solid var(--accent); border-radius:18px 18px 0 0;
  margin:14px -16px -60px; padding:12px 16px 16px; box-shadow:0 -6px 18px rgba(0,0,0,.12);}
.tray-row{display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:3px 0;}
.tray-total{font-family:var(--font-display); font-weight:800; font-size:17px; border-top:2px dashed var(--line); margin-top:6px; padding-top:8px; color:var(--gold-deep);
  font-variant-numeric:tabular-nums;}
.checklist{list-style:none; padding:0; margin:0;}
.checklist li{padding:5px 0; font-size:13px; display:flex; gap:8px; align-items:baseline;}
.checklist li.ok{color:var(--success-deep);}
.checklist li.bad{color:var(--danger-deep);}
.badge-row{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0;}
.badge{font-family:var(--font-display); font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:7px; background:var(--bg-sunk); color:var(--ink-soft); border:1px solid var(--line);}
.score-circle{width:120px; height:120px; border-radius:50%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; margin:0 auto 14px; position:relative;
  background:radial-gradient(circle at 32% 28%, var(--gold) 0%, var(--gold-deep) 72%);
  box-shadow:0 6px 0 var(--gold-deep), 0 12px 22px rgba(0,0,0,.18); animation:popIn .45s cubic-bezier(.22,.9,.3,1.1);}
.score-circle .num{font-family:var(--font-display); font-size:30px; font-weight:800; color:var(--gold-ink); line-height:1; font-variant-numeric:tabular-nums;}
.score-circle .lbl{font-family:var(--font-display); font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-ink); opacity:.75; margin-top:2px;}
.q-options{display:flex; flex-direction:column; gap:9px; margin:14px 0;}
.q-opt{text-align:left; padding:13px 15px; border-radius:14px; border:2px solid var(--line);
  background:var(--bg-elev); cursor:pointer; font-family:var(--font-body); font-weight:700; font-size:14.5px; color:var(--ink);
  box-shadow:0 3px 0 var(--line); transition:transform .08s ease, box-shadow .08s ease;}
.q-opt:active{transform:translateY(2px); box-shadow:none;}
.q-opt.correct{border-color:var(--success-deep); background:var(--success-bg); box-shadow:0 3px 0 var(--success-deep); animation:bounceIn .4s ease;}
.q-opt.incorrect{border-color:var(--danger-deep); background:var(--danger-bg); box-shadow:0 3px 0 var(--danger-deep);}
.q-opt:disabled{cursor:default;}
.q-opt:disabled:active{transform:none;}
.q-feedback{font-family:var(--font-display); font-weight:800; font-size:15px; margin:4px 0 0; display:flex; align-items:center; gap:6px; animation:popIn .3s ease;}
.q-feedback.good{color:var(--success-deep);}
.q-feedback.bad{color:var(--danger-deep);}
.flip-scene{perspective:1000px; margin:12px 0;}
.flashcard{position:relative; min-height:150px;}
.flashcard .fc-face{border:2px dashed var(--line); border-radius:16px; padding:22px; text-align:center;
  background:var(--bg-elev); box-shadow:var(--shadow); backface-visibility:hidden;
  transition:transform .5s cubic-bezier(.3,.9,.3,1.1); transform-style:preserve-3d;}
.flashcard .fc-front{transform:rotateY(0deg);}
.flashcard .fc-back{position:absolute; inset:0; transform:rotateY(180deg);}
.flashcard.flipped .fc-front{transform:rotateY(180deg);}
.flashcard.flipped .fc-back{transform:rotateY(360deg);}
.flashcard .fc-name{font-family:var(--font-display); font-size:20px; font-weight:800;}
.flashcard .fc-price{color:var(--gold-deep); font-family:var(--font-display); font-weight:700; font-size:13px; margin-bottom:10px;}
.flashcard .fc-line{font-weight:700; color:var(--ink); font-size:14.5px; margin-top:4px; padding-top:12px;}
table.results-table{width:100%; border-collapse:collapse; font-size:12.5px;}
table.results-table th, table.results-table td{text-align:left; padding:8px 8px; border-bottom:2px solid var(--line); vertical-align:top;}
table.results-table th{font-family:var(--font-display); color:var(--ink-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;}
.disclaimer{background:var(--warn-bg); border:2px solid var(--warn); color:var(--warn); border-radius:13px;
  padding:10px 13px; font-size:12px; font-weight:600; line-height:1.4; margin-bottom:14px;}
.empty{text-align:center; color:var(--ink-faint); padding:30px 10px; font-size:13.5px;}
.fact{background:var(--bg-sunk); border-radius:13px; padding:10px 13px; font-size:12.5px; font-weight:600; margin-top:8px; color:var(--ink-soft);}
#confetti-canvas{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:999;}

/* Run the Floor — a top-down map styled after Folietta's actual dining
   room, not a generic blueprint: dark walnut walls (the real wood
   panelling), warm cream tile floor, the burgundy accent that shows up on
   the tile cap stripe and the "Folietta" script sign, and brass-toned
   counters/bar. Fixed warm paper tones regardless of light/dark theme —
   meant to read like the actual room, not reskin with the app chrome.
   The server is just a dot an X slider (bottom) and a Y slider (right)
   drag around the map; the same zone/table/wall shapes drawn here are
   what the sliders physically can't drag the dot through. */
:root{
  --floor-wall:#3a2a1f; --floor-wall-line:#241a12; --floor-wood:#5b4030;
  --floor-cream:#f6eeda; --floor-tile:#fffaf0; --floor-tile-line:#e3cfa6;
  --floor-burgundy:#8c2331; --floor-burgundy-deep:#5e1620; --floor-gold:#c9a86a; --floor-brass:#b9842a;
}
/* Full-bleed: breaks out of #app's side padding so the map reads as a room
   to walk around in, not a diagram pinned inside a card. */
.floor-stage{display:grid; grid-template-columns:1fr 30px; grid-template-rows:auto auto; gap:6px 6px;
  margin:0 -16px 14px; width:calc(100% + 32px); padding:0 6px;}
/* Matches the camera window's own CAMERA_W/CAMERA_H in app.js (60/72) —
   a "dynamic glass window" onto the real floor plan, not the whole thing
   shrunk to fit; keep the two in sync if either one changes. The double
   border (walnut outer, burgundy inset) echoes the real room's dark wood
   trim over a burgundy accent line, same family as the tile cap stripe. */
.floor-map-wrap{grid-column:1; grid-row:1; position:relative; aspect-ratio:60/72; border-radius:12px; overflow:hidden;
  background:var(--floor-cream); border:4px solid var(--floor-wall);
  box-shadow:inset 0 0 0 2px var(--floor-burgundy), inset 0 0 0 3px var(--floor-cream), inset 0 2px 10px rgba(40,20,10,.18), 0 4px 14px rgba(40,20,10,.22);}
.floor-map-svg{display:block; width:100%; height:100%;}
.bp-building{fill:none; stroke:var(--floor-wood); stroke-width:1.3; stroke-linejoin:round;}
/* The real east wall dividing the dining room from the patio — solid
   walnut, not just an outline, so it visibly reads as a wall rather than
   a zone edge; the three gaps left open in FLOOR_WALLS are its real
   doors (see data.py) and are simply not drawn, i.e. open floor. */
.bp-wall{fill:var(--floor-wall); stroke:var(--floor-wall-line); stroke-width:.3;}
.bp-zone{fill:var(--floor-tile); stroke:var(--floor-tile-line); stroke-width:.35;}
.bp-zone-counter, .bp-zone-podium{fill:#efe0bf;}
.bp-zone-door{fill:#2e3a2a;}
.bp-zone-kitchen{fill:#eef1f2;}
.bp-zone-threshold{fill:var(--floor-tile);}
.bp-zone-label{font-family:var(--font-body); font-size:1.5px; font-weight:800; fill:#8a6a4a; text-transform:uppercase; letter-spacing:.02em; pointer-events:none;}
.bp-table{fill:#fffdfa; stroke:var(--floor-wood); stroke-width:.45;}
.bp-table-target{stroke:var(--success-deep); stroke-width:.8;}
.bp-table-label{font-family:var(--font-display); font-size:2.7px; font-weight:700; fill:var(--floor-wood); text-anchor:middle; pointer-events:none;}
.bp-counter{fill:var(--floor-wall);}
.bp-counter-top{fill:none; stroke:var(--floor-brass); stroke-width:.4;}
.bp-stool{fill:#fffdfa; stroke:var(--floor-wood); stroke-width:.3;}
.bp-pass-edge{fill:var(--floor-brass);}
.bp-podium{fill:var(--floor-wood); stroke:var(--floor-wall-line); stroke-width:.3;}
.bp-door{fill:#2e3a2a; stroke:var(--floor-burgundy); stroke-width:.4; stroke-dasharray:1.3 1;}
.floor-trail{fill:none; stroke:var(--accent); stroke-width:.9; stroke-linecap:round; stroke-linejoin:round; opacity:.5;}
/* The little Folietta server standing in for the old plain dot — see
   svgCharacterIcon in app.js. White strokes on the head/body keep it
   legible against whichever floor tone it's standing on. */
.floor-char-shadow{fill:rgba(20,10,5,.22);}
.floor-char-hair{fill:var(--floor-wall);}
.floor-char-body{fill:var(--floor-burgundy); stroke:#fff; stroke-width:.3;}
.floor-char-button{fill:var(--floor-gold);}
.floor-char-head{fill:#e8c49a; stroke:#fff; stroke-width:.3;}
.floor-char-stache{fill:var(--floor-wall);}
.floor-slider-y-wrap{grid-column:2; grid-row:1; position:relative; display:flex; align-items:center; justify-content:center;}
.floor-slider-x-wrap{grid-column:1; grid-row:2; display:flex; align-items:center; padding:0 2px;}
.floor-slider{-webkit-appearance:none; appearance:none; background:transparent; cursor:pointer; margin:0; touch-action:none;}
.floor-slider-x-wrap .floor-slider{width:100%;}
/* rotate(90deg), not -90deg: dragging the thumb toward the top of the
   screen must move the character up the room (smaller y), matching the
   map's own orientation — the other rotation direction put max-value at
   the top, which moved the character the opposite way from the drag. */
.floor-slider-y-wrap .floor-slider{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(90deg);}
.floor-slider::-webkit-slider-runnable-track{height:8px; border-radius:999px; background:var(--bg-sunk); border:1px solid var(--line);}
.floor-slider::-moz-range-track{height:8px; border-radius:999px; background:var(--bg-sunk); border:1px solid var(--line);}
.floor-slider::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:26px; height:26px; margin-top:-9px; border-radius:50%;
  background:var(--accent); border:3px solid #fff; box-shadow:0 2px 0 var(--accent-deep);}
.floor-slider::-moz-range-thumb{width:26px; height:26px; border:3px solid #fff; border-radius:50%; background:var(--accent); box-shadow:0 2px 0 var(--accent-deep);}
/* Admin-only Layout Editor (see EDITOR_ENABLED in app.js) — the full
   floor plan at once, no camera crop, with every counter/table draggable.
   Reuses the same bp-* shape classes as the live map above. */
.layout-editor-wrap{margin:0 -16px 14px; width:calc(100% + 32px); padding:0 6px;
  background:var(--floor-cream); border-top:4px solid var(--floor-wall); border-bottom:4px solid var(--floor-wall);}
.layout-editor-svg{display:block; width:100%; height:auto;}
.edit-draggable{cursor:grab; touch-action:none;}
.edit-draggable:active{cursor:grabbing;}
.edit-draggable:hover{filter:brightness(1.08);}
.layout-json-box{width:100%; margin-top:10px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11.5px; line-height:1.4; padding:10px; border-radius:10px; border:2px solid var(--line);
  background:var(--bg-sunk); color:var(--ink); resize:vertical;}
.plate-tray{display:flex; flex-direction:column; gap:8px; margin:10px 0;}
.plate-chip{display:flex; align-items:center; gap:10px; text-align:left; width:100%; padding:10px 13px; border-radius:13px;
  border:2px solid var(--line); background:var(--bg-elev); cursor:pointer; font-family:var(--font-body); color:var(--ink);
  box-shadow:0 3px 0 var(--line); transition:transform .08s ease, box-shadow .08s ease;}
.plate-chip:active{transform:translateY(2px); box-shadow:none;}
.plate-chip.armed{border-color:var(--gold-deep); background:var(--bg-sunk); box-shadow:0 3px 0 var(--gold-deep);}
.plate-chip.placed{border-color:var(--success-deep); box-shadow:0 3px 0 var(--success-deep);}
.plate-chip.static{cursor:default; pointer-events:none; box-shadow:none;}
.plate-icon{font-size:20px; flex:none;}
.plate-name{font-weight:700; font-size:13.5px; flex:1;}
.plate-where{font-size:11px; font-weight:700; color:var(--gold-deep); white-space:nowrap;}
.plate-where.muted{color:var(--ink-faint); font-weight:600;}
.table-diagram{margin:16px 0; display:flex; justify-content:center;}
.counter-row{display:flex; gap:6px; overflow-x:auto; padding:4px; max-width:100%;}
.seat-slot{flex:none; width:42px; height:42px; border-radius:11px; border:2px solid var(--line); background:var(--bg-elev);
  display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-family:var(--font-display);
  font-weight:700; font-size:13px; color:var(--ink); box-shadow:0 3px 0 var(--line); position:relative;}
.seat-slot:active{transform:translateY(2px); box-shadow:none;}
.seat-slot.filled{border-color:var(--success-deep); background:var(--success-bg); box-shadow:0 3px 0 var(--success-deep);}
.seat-plate{font-size:13px; margin-top:-2px;}
.table-shape{position:relative; width:220px; height:180px; margin:10px auto; max-width:100%;}
.centre-slot{position:absolute; inset:46px; border:2px dashed var(--line); background:var(--bg-sunk); border-radius:12px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700;
  font-size:11px; color:var(--ink-soft); z-index:1;}
.centre-slot.filled{background:var(--success-bg); color:var(--success-deep); border-color:var(--success-deep); border-style:solid;}
.centre-plates{font-size:12px; margin-top:2px;}
.table-shape .seat-slot{position:absolute; width:46px; height:46px;}
.two-top .seat-pos-0{left:0; top:67px;}
.two-top .seat-pos-1{right:0; top:67px;}
.four-top .seat-pos-0{left:36px; top:0;}
.four-top .seat-pos-1{right:36px; top:0;}
.four-top .seat-pos-2{left:0; top:67px;}
.four-top .seat-pos-3{right:0; top:67px;}
</style>

// ---------------------------------------------------------------------
// Confetti burst (hand-rolled canvas, no external library)
// ---------------------------------------------------------------------
var CONFETTI_COLORS = ['#c21f2f', '#f0a93a', '#2f9e5b', '#e2543a', '#f6ecdf'];
function burstConfetti(opts){
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    opts = opts || {};
    var count = opts.count || 50;
    var duration = opts.duration || 1500;
    var canvas = document.createElement('canvas');
    canvas.id = 'confetti-canvas';
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    var originX = canvas.width / 2, originY = canvas.height * 0.35;
    if (opts.originEl && opts.originEl.getBoundingClientRect){
      var r = opts.originEl.getBoundingClientRect();
      originX = r.left + r.width / 2; originY = r.top + r.height / 2;
    }
    var parts = [];
    for (var i = 0; i < count; i++){
      var angle = Math.random() * Math.PI * 2;
      var speed = 2 + Math.random() * 5;
      parts.push({
        x: originX, y: originY,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 3,
        size: 4 + Math.random() * 5, rot: Math.random() * Math.PI, vrot: (Math.random() - 0.5) * 0.4,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)]
      });
    }
    var start = Date.now();
    function frame(){
      var t = Date.now() - start;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      parts.forEach(function(p){
        p.vy += 0.14; p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, 1 - t / duration);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });
      if (t < duration){ requestAnimationFrame(frame); } else { canvas.remove(); }
    }
    requestAnimationFrame(frame);
  } catch (e){ /* confetti is decorative; never let it break the game */ }
}

// ---------------------------------------------------------------------
// Scoring: Build the Guest's Dinner
// ---------------------------------------------------------------------
function scoreDinner(scenario, selectedIds){
  var items = selectedIds.map(function(id){ return ITEM[id]; }).filter(Boolean);
  var total = items.reduce(function(s, it){ return s + parsePriceLow(it.price); }, 0);
  var catsCovered = {};
  items.forEach(function(it){ catsCovered[it.cat] = true; });
  var coveredCount = Object.keys(catsCovered).length;

  var violations = [];
  if (scenario.restriction === 'vegetarian'){
    items.forEach(function(it){
      if (it.dietary.indexOf('vegetarian') === -1) violations.push(it);
    });
  } else if (scenario.restriction === 'shellfish'){
    items.forEach(function(it){
      if (it.allergens.indexOf('shellfish') !== -1) violations.push(it);
    });
  }

  var safetyPts = violations.length === 0 ? 30 : 0;
  var completenessPts = Math.round(40 * Math.min(1, coveredCount / scenario.minCourses));
  var inBudget = total >= scenario.minBudget && total <= scenario.maxBudget;
  var nearBudget = !inBudget && total >= scenario.minBudget * 0.75 && total <= scenario.maxBudget * 1.25;
  var budgetPts = inBudget ? 20 : (nearBudget ? 10 : 0);
  var specialPts;
  var specialOk = true;
  if (scenario.mustInclude){
    specialOk = selectedIds.indexOf(scenario.mustInclude) !== -1;
    specialPts = specialOk ? 10 : 0;
  } else {
    specialPts = 10;
  }
  var score = safetyPts + completenessPts + budgetPts + specialPts;

  return {
    total: total, coveredCount: coveredCount, violations: violations,
    safetyPts: safetyPts, completenessPts: completenessPts, budgetPts: budgetPts, specialPts: specialPts,
    inBudget: inBudget, specialOk: specialOk, score: score
  };
}

// ---------------------------------------------------------------------
// Scoring: Course & Pairing layer (3-6 courses, one beverage per course)
// Deliberately NOT trying to grade whether a specific wine "correctly"
// matches a specific dish — that's real sommelier judgment this game
// doesn't have a dataset for, and a fake correctness check would just
// teach staff the wrong thing with false confidence. Instead this scores
// the parts that ARE objectively checkable: did every dish land in a
// course, is every course actually used (no empty courses), did most
// courses get a pairing attached, and did staff vary the pairings rather
// than pouring the same glass for the whole table.
// ---------------------------------------------------------------------
function scoreCourses(courseCount, selectedIds, courseAssign, beveragePairings){
  courseAssign = courseAssign || {};
  beveragePairings = beveragePairings || {};
  var n = courseCount || 0;

  var assignedCount = selectedIds.filter(function(id){
    var c = courseAssign[id];
    return typeof c === 'number' && c >= 1 && c <= n;
  }).length;
  var assignPts = selectedIds.length ? Math.round(25 * assignedCount / selectedIds.length) : 0;

  var usedCourses = {};
  selectedIds.forEach(function(id){
    var c = courseAssign[id];
    if (typeof c === 'number' && c >= 1 && c <= n) usedCourses[c] = true;
  });
  var usedCount = Object.keys(usedCourses).length;
  var usedPts = n ? Math.round(25 * usedCount / n) : 0;

  var pairedCourseNums = [];
  for (var i = 1; i <= n; i++){ if (beveragePairings[i]) pairedCourseNums.push(i); }
  var pairedCount = pairedCourseNums.length;
  var pairingPts = n ? Math.round(35 * pairedCount / n) : 0;

  var distinctBevs = {};
  pairedCourseNums.forEach(function(c){ distinctBevs[beveragePairings[c]] = true; });
  var distinctCount = Object.keys(distinctBevs).length;
  var varietyPts = pairedCount <= 1 ? 15 : (distinctCount >= 2 ? 15 : 0);

  var score = assignPts + usedPts + pairingPts + varietyPts;

  return {
    courseCount: n, assignedCount: assignedCount, totalDishes: selectedIds.length, assignPts: assignPts,
    usedCount: usedCount, usedPts: usedPts,
    pairedCount: pairedCount, pairingPts: pairingPts,
    distinctCount: distinctCount, varietyPts: varietyPts,
    score: score
  };
}

function genNameTheDish(item){

function genYesNo(item){
  var has = item.allergens;
  var allergen;
  if (has.length && Math.random() < 0.5){
    allergen = has[Math.floor(Math.random() * has.length)];
  } else {
    var not = ALLERGENS.filter(function(a){ return has.indexOf(a) === -1; });
    allergen = not.length ? not[Math.floor(Math.random() * not.length)] : (has[0] || ALLERGENS[0]);
  }
  var correct = has.indexOf(allergen) !== -1;
  return {
    kind: 'mc', qtype: 'yes-no',
    prompt: 'True or False — ' + item.name + ' contains ' + ALLERGEN_LABEL[allergen] + '.',
    options: ['True', 'False'], correctAnswer: correct ? 'True' : 'False', itemId: item.id
  };
}
function genTypeAllergens(item){
  var correctSet = {}; item.allergens.forEach(function(a){ correctSet[a] = true; });
  return {
    kind: 'type', qtype: 'type-allergens',
    prompt: 'Type the allergens in ' + item.name + ' (comma-separated — type "none" if none of the 7 major allergens apply).',
    correctSet: correctSet, itemId: item.id
  };
}
function genFlashcard(item){
  return { kind: 'flashcard', qtype: 'drop-line', itemId: item.id };
}

function genMenuAlgoQuestions(count){
  var pool = ITEMS.slice();
  var withDropLine = ITEMS.filter(function(i){ return i.drop && i.drop.trim(); });
  var nName = Math.max(1, Math.round(count * 0.42));
  var nYes = Math.max(1, Math.round(count * 0.25));
  var nType = Math.max(1, Math.round(count * 0.17));
  var nFlash = Math.max(1, count - nName - nYes - nType);

  var qs = [];
  sample(pool, Math.min(nName, pool.length)).forEach(function(it){ qs.push(genNameTheDish(it)); });
  sample(pool, Math.min(nYes, pool.length)).forEach(function(it){ qs.push(genYesNo(it)); });
  sample(pool, Math.min(nType, pool.length)).forEach(function(it){ qs.push(genTypeAllergens(it)); });
  sample(withDropLine, Math.min(nFlash, withDropLine.length)).forEach(function(it){ qs.push(genFlashcard(it)); });
  return qs;
}
function bankQuestions(cat){
  return QUESTION_BANK.filter(function(q){ return q.category === cat; }).map(function(q){
    return { kind: 'mc', qtype: 'trivia-' + cat, category: cat, prompt: q.prompt, options: shuffle(q.options.slice()), correctAnswer: q.correctAnswer };
  });
}

// cats: array of QUIZ_CATEGORIES keys to draw from. Defaults to all of them.
// 'menu' mixes the algorithmic per-dish generators above with the static
// menu trivia in QUESTION_BANK; 'service'/'host'/'bar' are static-bank-only.
function buildQuiz(n, cats){
  cats = (cats && cats.length) ? cats : QUIZ_CATEGORIES.map(function(c){ return c.key; });
  var base = Math.floor(n / cats.length);
  var rem = n - base * cats.length;
  var targets = {};
  cats.forEach(function(c, i){ targets[c] = base + (i < rem ? 1 : 0); });

  var pools = {};
  cats.forEach(function(c){
    pools[c] = (c === 'menu')
      ? shuffle(genMenuAlgoQuestions(n).concat(bankQuestions('menu')))
      : shuffle(bankQuestions(c));
  });

  var qs = [];
  var deficit = 0;
  cats.forEach(function(c){
    var take = Math.min(targets[c], pools[c].length);
    deficit += targets[c] - take;
    qs = qs.concat(pools[c].splice(0, take));
  });
  if (deficit > 0){
    cats.forEach(function(c){
      if (deficit <= 0) return;
      var extra = Math.min(deficit, pools[c].length);
      if (extra > 0){ qs = qs.concat(pools[c].splice(0, extra)); deficit -= extra; }
    });
  }

  return shuffle(qs).slice(0, n);
}

// ---------------------------------------------------------------------
// "Run the Floor" — table/seat numbers + kitchen-to-table routing
// ---------------------------------------------------------------------
function dishPickup(item){
  if (item.cat === 'antipasti') return ANTIPASTI_PICKUP[item.id] || 'hot';
  return CATEGORY_PICKUP[item.cat] || 'hot';
}
// ---------------------------------------------------------------------
// Free-roam floor movement — the server drags an X slider and a Y slider
// to walk the actual floor plan themselves. There's no taught route and no
// "wrong turn" tap anymore: they choose how to get there and back, and the
// round is scored on how good those choices were (did they reach the right
// spot, how direct a line they walked, how quickly, and whether they kept
// moving forward through the room instead of backtracking over their own
// steps). Walls and furniture are real obstacles — the slider won't drag
// the character through a table, the bar, the host stand, the washrooms,
// or the kitchen pass.
// ---------------------------------------------------------------------
function floorPickupPoint(){
  var z = ZONE['pickup-hot'];
  return [z.x, z.y];
}
// Where a given forward/return target "counts" as reached. Tables use a
// capture radius around their point; counters and the kitchen pass use the
// open aisle in front of them (reached the moment you're anywhere along it).
function floorTargetPoint(target){
  if (target.id === 'pickup-hot') return floorPickupPoint();
  if (target.isCounter){
    var z = ZONE[target.zone];
    return [z.x, z.y - z.h / 2 + z.h * 0.74];
  }
  return [target.x, target.y];
}
function floorIsAtTarget(x, y, target){
  if (target.id === 'pickup-hot'){
    var zp = ZONE['pickup-hot'];
    var x0p = zp.x - zp.w / 2, y0p = zp.y - zp.h / 2;
    return x >= x0p && x <= x0p + zp.w && y >= y0p && y <= y0p + zp.h;
  }
  if (target.isCounter){
    var zc = ZONE[target.zone];
    var x0c = zc.x - zc.w / 2, y0c = zc.y - zc.h / 2;
    return x >= x0c && x <= x0c + zc.w && y >= y0c + zc.h * 0.52 && y <= y0c + zc.h;
  }
  var dx = x - target.x, dy = y - target.y;
  return Math.sqrt(dx * dx + dy * dy) <= 4.4;
}
// Furniture/wall obstacles the character can't be dragged through, built
// once from the same real zone/table geometry the map is drawn from.
var FLOOR_OBSTACLES = (function(){
  var obs = [];
  FLOOR_ZONES.forEach(function(z){
    var x0 = z.x - z.w / 2, y0 = z.y - z.h / 2;
    if (z.kind === 'counter'){
      // Every counter zone (bar-top, bar, chef's-bar, server-counter) now
      // sits well short of the building's full width — the real plan's
      // actual proportions, not a square-cropped stylization — so each
      // one already has real open floor at both ends; no artificial gap
      // needs to be carved out of any of them.
      // Only the solid counter SLAB is impassable — staff can't walk on
      // top of the bar, but the open floor along its guest-facing side
      // (where the stools are) stays walkable so a server can still reach
      // each seat. Most counters are wider than they are deep (bar-top,
      // chef's-bar, server-counter) and run the slab along their full
      // width; the 'bar' zone is the one counter that's taller than it is
      // wide (it's the vertical leg of the L, see data.py), so its slab
      // has to run along its full HEIGHT instead — same rule as
      // svgCounterShape in the renderer below, kept in sync by hand. A
      // zone's "flip" puts that slab on the far side of its stools instead
      // of the near side (see data.py's 'bar' entry for why).
      if (z.h > z.w){
        var barX0 = z.flip ? x0 + z.w * 0.5 : x0 + z.w * 0.08;
        var barX1 = barX0 + z.w * 0.42;
        obs.push({ x0: barX0, y0: y0, x1: barX1, y1: y0 + z.h });
      } else {
        var barY0 = z.flip ? y0 + z.h * 0.5 : y0 + z.h * 0.08;
        var barY1 = barY0 + z.h * 0.42;
        obs.push({ x0: x0, y0: barY0, x1: x0 + z.w, y1: barY1 });
      }
    } else if (z.kind === 'podium'){
      obs.push({ x0: z.x - 3.8, y0: z.y - 2.9, x1: z.x + 3.8, y1: z.y + 2.9 });
    } else if (z.kind === 'door'){
      obs.push({ x0: x0, y0: y0, x1: x0 + z.w, y1: y0 + z.h });
    }
    // 'kitchen' (Hot/Cold Pickup) is open floor the server stands in — the
    // pass-edge drawn below is just flavour, not a wall, so no obstacle.
  });
  FLOOR_TABLES.forEach(function(t){
    var fourTop = t.seats.length >= 4;
    obs.push(fourTop
      ? { x0: t.x - 2.7, y0: t.y - 2.7, x1: t.x + 2.7, y1: t.y + 2.7 }
      : { x0: t.x - 2.7, y0: t.y - 1.8, x1: t.x + 2.7, y1: t.y + 1.8 });
  });
  // Real walls (see FLOOR_WALLS in data.py) — the building's true,
  // non-rectangular outline and the dining-room/patio divider with its
  // three actual door gaps. Unlike furniture, these aren't optional
  // flavour: crossing one isn't just "bumping a table", it's walking
  // through a load-bearing wall, so they go in the same obstacle list.
  FLOOR_WALLS.forEach(function(w){ obs.push({ x0: w.x0, y0: w.y0, x1: w.x1, y1: w.y1 }); });
  return obs;
})();
function floorPointBlocked(x, y){
  for (var i = 0; i < FLOOR_OBSTACLES.length; i++){
    var o = FLOOR_OBSTACLES[i];
    if (x >= o.x0 && x <= o.x1 && y >= o.y0 && y <= o.y1) return true;
  }
  return false;
}
// Drags one axis toward a desired value in small steps, stopping right at
// the edge of whatever wall/table is in the way — a soft collision so the
// slider thumb itself settles at the blocked spot instead of sailing on.
function floorStepAxis(oldX, oldY, desired, axis){
  var cur = axis === 'x' ? oldX : oldY;
  var lo = 2, hi = (axis === 'x' ? WORLD_W : WORLD_H) - 2;
  desired = Math.max(lo, Math.min(hi, desired));
  if (Math.abs(desired - cur) < 0.05) return floorPointBlocked(axis === 'x' ? desired : oldX, axis === 'x' ? oldY : desired) ? cur : desired;
  var dir = desired > cur ? 1 : -1, step = 0.4, v = cur;
  while (true){
    var next = v + dir * step;
    if ((dir > 0 && next > desired) || (dir < 0 && next < desired)) next = desired;
    var tx = axis === 'x' ? next : oldX, ty = axis === 'y' ? next : oldY;
    if (floorPointBlocked(tx, ty)) break;
    v = next;
    if (v === desired) break;
  }
  return v;
}
function buildFloorRound(){
  var table = FLOOR_TARGETS[Math.floor(Math.random() * FLOOR_TARGETS.length)];
  var n = 2 + Math.floor(Math.random() * 3); // 2-4 dishes
  var dishPool = sample(ITEMS, Math.min(n, ITEMS.length));
  var dishes = dishPool.map(function(it){
    var assign;
    if (table.shared && Math.random() < 0.4){
      assign = { type: 'shared' };
    } else {
      var seat = table.seats[Math.floor(Math.random() * table.seats.length)];
      assign = { type: 'seat', seat: seat };
    }
    return { id: it.id, name: it.name, cat: it.cat, pickup: dishPickup(it), assign: assign };
  });
  var pickupsNeeded = [];
  dishes.forEach(function(d){ if (pickupsNeeded.indexOf(d.pickup) === -1) pickupsNeeded.push(d.pickup); });
  var destZone = table.zone;
  var start = floorPickupPoint();

  return {
    table: table, dishes: dishes, pickupsNeeded: pickupsNeeded, destZone: destZone,
    // forward leg — starts already standing at Hot Pickup, walked freely from there
    fStart: start, fx: start[0], fy: start[1], fPath: [start.slice()],
    fArrived: false, fStartTime: null, fWrongSeen: {}, fWrongCount: 0, fMetrics: null,
    // plating
    placed: {}, armedDish: null,
    // return leg — seeded once plating is done (go-floor-return)
    rStart: null, rx: null, ry: null, rPath: null,
    rArrived: false, rStartTime: null, rWrongCount: 0, rMetrics: null
  };
}
// Turns a walked path + how long it took into a 0-100 score: did they reach
// the right spot without wandering into a wrong table/pass (accuracy),
// how close to a straight line was the path they actually walked
// (efficiency), how quick they were against a fair pace (speed), and
// whether they kept moving forward through the room rather than doubling
// back on themselves (smoothness — the "circular motion, not backtracking"
// ask). The four are weighted and combined into one leg score.
function floorLegMetrics(path, startPt, targetPt, elapsedMs, wrongCount){
  var pathLen = 0;
  for (var i = 1; i < path.length; i++){
    var dx = path[i][0] - path[i - 1][0], dy = path[i][1] - path[i - 1][1];
    pathLen += Math.sqrt(dx * dx + dy * dy);
  }
  var straight = Math.sqrt(Math.pow(targetPt[0] - startPt[0], 2) + Math.pow(targetPt[1] - startPt[1], 2));
  var efficiency = pathLen > 0.5 ? Math.max(0, Math.min(1, straight / pathLen)) : 1;
  var reversals = 0, segs = 0;
  for (var j = 1; j < path.length - 1; j++){
    var v1x = path[j][0] - path[j - 1][0], v1y = path[j][1] - path[j - 1][1];
    var v2x = path[j + 1][0] - path[j][0], v2y = path[j + 1][1] - path[j][1];
    var mag1 = Math.sqrt(v1x * v1x + v1y * v1y), mag2 = Math.sqrt(v2x * v2x + v2y * v2y);
    if (mag1 < 0.3 || mag2 < 0.3) continue;
    segs++;
    if ((v1x * v2x + v1y * v2y) < 0) reversals++;
  }
  var smoothness = segs > 0 ? Math.max(0, 1 - (reversals / segs) * 1.4) : 1;
  var elapsedSec = Math.max(0.1, elapsedMs / 1000);
  var par = Math.max(4, straight / 9 + 1.5);
  var speed = Math.max(0, Math.min(1, par / elapsedSec));
  var accuracy = Math.max(0, 1 - wrongCount * 0.18);
  var legScore = Math.round(100 * (0.30 * accuracy + 0.25 * efficiency + 0.20 * speed + 0.25 * smoothness));
  return {
    pathLen: pathLen, straight: straight, efficiency: efficiency, reversals: reversals,
    smoothness: smoothness, elapsedSec: elapsedSec, speed: speed, accuracy: accuracy,
    wrongCount: wrongCount, legScore: Math.max(10, Math.min(100, legScore))
  };
}
function floorRouteScore(r){
  return r.fMetrics ? r.fMetrics.legScore : 0;
}
function floorReturnScore(r){
  return r.rMetrics ? r.rMetrics.legScore : 0;
}
function floorPlacementScore(r){
  var correct = 0;
  r.dishes.forEach(function(d){
    var want = d.assign.type === 'shared' ? 'shared' : ('seat-' + d.assign.seat);
    if (r.placed[d.id] === want) correct++;
  });
  return { correct: correct, total: r.dishes.length, pct: Math.round(100 * correct / r.dishes.length) };
}

function mailtoLink(subject, body){
  return 'mailto:' + encodeURIComponent(MANAGER.email) + '?subject=' + encodeURIComponent(subject) +
    '&body=' + encodeURIComponent(body);
}
function smsLink(body){
  var sep = isIOS() ? '&' : '?';
  return 'sms:' + encodeURIComponent(MANAGER.phone) + sep + 'body=' + encodeURIComponent(body);
}
function copyText(text, btn){
  var done = function(ok){
    var orig = btn.textContent;
    btn.textContent = ok ? 'Copied!' : 'Copy failed';
    setTimeout(function(){ btn.textContent = orig; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ done(false); });
  } else {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(ok);
    } catch (e){ done(false); }
  }
}

function dinnerSummaryText(sc, selected, r, justification, playerName, forEmail, cr, courseAssign, beveragePairings){
  var lines = [];
  lines.push('FOLIETTA — Build the Guest\'s Dinner');
  lines.push('Player: ' + playerName);
  lines.push('Scenario: ' + sc.title + ' (' + sc.party + ')');
  lines.push('Score: ' + r.score + '/100');
  lines.push('  Safety ' + r.safetyPts + '/30, Coverage ' + r.completenessPts + '/40, Budget ' + r.budgetPts + '/20, Required ' + r.specialPts + '/10');
  if (r.violations.length) lines.push('Conflicts: ' + r.violations.map(function(v){ return v.name; }).join(', '));
  if (cr && cr.courseCount){
    lines.push('Course & pairing score: ' + cr.score + '/100');
    for (var c = 1; c <= cr.courseCount; c++){
      var names = selected.filter(function(id){ return courseAssign && courseAssign[id] === c; })
        .map(function(id){ return ITEM[id] ? ITEM[id].name : null; }).filter(Boolean);
      var bevId = beveragePairings && beveragePairings[c];
      var bev = bevId ? BEVERAGE[bevId] : null;
      lines.push('  Course ' + c + ': ' + (names.length ? names.join(', ') : '(no dishes assigned)') +
        (bev ? ' — paired with ' + bev.name : ''));
    }
  } else {
    lines.push('Dinner: ' + selected.map(function(id){ return ITEM[id].name; }).join(', '));
  }
  if (justification) lines.push('Pitch: ' + justification);
  lines.push('Completed: ' + new Date().toLocaleString());
  return lines.join('\n');
}
function quizSummaryText(answers, playerName){
  var graded = answers.filter(function(a){ return a.kind !== 'flashcard'; });
  var correctCount = graded.filter(function(a){ return a.correct; }).length;
  var flash = answers.filter(function(a){ return a.kind === 'flashcard'; });
  var fcGot = flash.filter(function(a){ return a.gotIt; }).length;
  var lines = [];
  lines.push('FOLIETTA — Menu Quiz');
  lines.push('Player: ' + playerName);
  lines.push('Score: ' + correctCount + '/' + graded.length + ' graded' + (flash.length ? ', ' + fcGot + '/' + flash.length + ' drop lines self-marked' : ''));
  lines.push('');
  answers.forEach(function(a, i){
    if (a.kind === 'flashcard'){
      lines.push((i + 1) + '. [drop line] ' + ITEM[a.itemId].name + ' — ' + (a.gotIt ? 'got it' : 'missed'));
    } else {
      lines.push((i + 1) + '. ' + (a.correct ? '[correct] ' : '[missed] ') + a.prompt + ' — answered: ' + a.yourAnswer +
        (a.correct ? '' : ' (correct: ' + a.correctAnswerText + ')'));
    }
  });
  lines.push('');
  lines.push('Completed: ' + new Date().toLocaleString());
  return lines.join('\n');
}

// ---------------------------------------------------------------------
// View: Course & pairing builder — splits the picked dishes into 3-6
// courses and lets a beverage be paired with each one from the real wine
// list / cocktail menu / aperitivi / vermouth / digestivi / beer /
// non-alcoholic program. Sits between picking dishes and the result
// screen; state.courseAssign and state.beveragePairings are carried
// forward from here into viewDinnerResult for scoring + the send summary.
// ---------------------------------------------------------------------
function viewDinnerCourses(){
  var sc = SCENARIOS.filter(function(s){ return s.id === state.scenarioId; })[0];
  var selected = state.selected || [];
  var n = state.courseCount || 3;
  var assign = state.courseAssign || {};
  var pairings = state.beveragePairings || {};

  var html = topbar('Build the Courses', null);
  html += '<div class="card">' +
    '<h2>' + esc(sc.title) + '</h2>' +
    '<p class="small">Split the ' + selected.length + ' item' + (selected.length === 1 ? '' : 's') +
    ' you picked into courses, then pair a drink with each one.</p>' +
    '<div class="btn-row"><button class="btn secondary" data-action="back-to-dinner-build">&larr; Edit dishes</button></div>' +
    '</div>';

  html += '<div class="card"><h2>How many courses?</h2><div class="cat-tabs">';
  [3, 4, 5, 6].forEach(function(c){
    html += '<button class="cat-tab' + (n === c ? ' active' : '') + '" data-action="set-course-count" data-n="' + c + '">' + c + ' courses</button>';
  });
  html += '</div></div>';

  html += '<div class="card"><h2>Assign each dish to a course</h2>';
  if (!selected.length){
    html += '<p class="muted small">No dishes picked yet — go back and pick some first.</p>';
  }
  selected.forEach(function(id){
    var it = ITEM[id];
    if (!it) return;
    var cur = assign[id];
    html += '<div style="margin-bottom:12px;">' +
      '<p class="small" style="margin:0 0 5px;">' + catPill(it.cat) + ' <strong>' + esc(it.name) + '</strong></p>' +
      '<div class="cat-tabs" style="margin:0 0 4px;padding:0;">';
    for (var c = 1; c <= n; c++){
      html += '<button class="cat-tab' + (cur === c ? ' active' : '') + '" data-action="assign-course" data-id="' + id + '" data-n="' + c + '">Course ' + c + '</button>';
    }
    html += '</div></div>';
  });
  html += '</div>';

  html += '<div class="card"><h2>Pair a beverage with each course</h2>' +
    '<p class="muted small">Optional per course, but a dinner that never once offers a pairing leaves both money and a chance to show off the bar program on the table.</p></div>';
  for (var course = 1; course <= n; course++){
    var dishNames = selected.filter(function(id){ return assign[id] === course; })
      .map(function(id){ return ITEM[id] ? ITEM[id].name : null; }).filter(Boolean);
    var pairedId = pairings[course];
    var paired = pairedId ? BEVERAGE[pairedId] : null;
    html += '<div class="card">' +
      '<p class="small" style="margin:0 0 4px;"><strong>Course ' + course + '</strong>' +
      (dishNames.length ? ' — ' + esc(dishNames.join(', ')) : ' — <span class="muted">no dishes assigned yet</span>') + '</p>';
    if (paired){
      html += '<p class="small" style="margin:8px 0;">' + bevCatPill(paired.cat) + ' <strong>' + esc(paired.name) + '</strong> — ' + esc(paired.price) +
        '<br><span class="muted">' + esc(paired.desc) + '</span></p>' +
        '<div class="btn-row">' +
        '<button class="btn secondary" data-action="toggle-bev-picker" data-n="' + course + '">' + (state.activeBevCourse === course ? 'Close' : 'Change') + '</button>' +
        '<button class="btn ghost" data-action="clear-beverage" data-n="' + course + '">Remove</button>' +
        '</div>';
    } else {
      html += '<div class="btn-row"><button class="btn secondary" data-action="toggle-bev-picker" data-n="' + course + '">' +
        (state.activeBevCourse === course ? 'Close' : '+ Add a pairing') + '</button></div>';
    }
    if (state.activeBevCourse === course) html += renderBeveragePicker();
    html += '</div>';
  }

  html += '<div class="tray"><div class="btn-row"><button class="btn" data-action="continue-to-review" ' +
    (selected.length === 0 ? 'disabled' : '') + '>Continue to review &rarr;</button></div></div>';

  return html;
}
function renderBeveragePicker(){
  // No default category — the full program is 84 items, so dropping
  // straight into "All" would hand staff a huge single-column scroll on a
  // phone before they've even picked a style. Starting with nothing shown
  // forces a deliberate tap first ("All" is still right there if someone
  // really does want to browse the whole list).
  var activeCat = state.bevActiveCat || '';
  var html = '<div style="margin-top:10px;border-top:2px dashed var(--line);padding-top:10px;">';
  html += '<div class="cat-tabs">';
  html += '<button class="cat-tab' + (activeCat === 'all' ? ' active' : '') + '" data-action="bev-filter-cat" data-cat="all">All</button>';
  BEVERAGE_CATEGORIES.forEach(function(c){
    html += '<button class="cat-tab' + (activeCat === c.key ? ' active' : '') + '" data-action="bev-filter-cat" data-cat="' + c.key + '">' + esc(c.name) + '</button>';
  });
  html += '</div>';
  if (!activeCat){
    html += '<p class="muted small" style="margin:8px 0 2px;">Pick a category above to see options.</p></div>';
    return html;
  }
  var shown = activeCat === 'all' ? BEVERAGES : BEVERAGES.filter(function(b){ return b.cat === activeCat; });
  html += '<div class="item-grid">';
  shown.forEach(function(b){
    html += '<div class="item-card" data-action="pick-beverage" data-id="' + b.id + '">' +
      '<span class="iprice">' + esc(b.price) + '</span>' +
      bevCatPill(b.cat) +
      '<div class="iname">' + esc(b.name) + '</div>' +
      '<div class="idesc">' + esc(b.desc) + '</div>' +
      '</div>';
  });
  html += '</div></div>';
  return html;
}

function viewDinnerResult(){
  var sc = SCENARIOS.filter(function(s){ return s.id === state.scenarioId; })[0];

  var r = scoreDinner(sc, selected);

  if (r.score >= 70) burstConfetti({ count: r.score >= 90 ? 90 : 55, duration: 1700 });
  var dinnerTitle = r.score >= 90 ? '🎉 Nailed It!' : (r.score >= 70 ? '⭐ Great Plate!' : 'Dinner Built');
  var html = topbar(dinnerTitle, null);

    '<div class="score-circle"><span class="num">' + r.score + '</span><span class="lbl">out of 100</span></div>' +

    ' Safety (' + r.safetyPts + '/30)' + (r.violations.length ? ' — conflicts with the stated restriction: ' +
    r.violations.map(function(v){ return esc(v.name); }).join(', ') : ' — no conflicts with the stated restriction') + '</li>';
  html += '<li class="' + (r.completenessPts >= 30 ? 'ok' : 'bad') + '">' +
    (r.completenessPts >= 30 ? '&#10003;' : '&#10007;') + ' Course coverage (' + r.completenessPts + '/40) — ' +
    r.coveredCount + ' menu section' + (r.coveredCount === 1 ? '' : 's') + ' represented (aim for ' + sc.minCourses + '+)</li>';
  html += '<li class="' + (r.budgetPts >= 15 ? 'ok' : 'bad') + '">' + (r.budgetPts >= 15 ? '&#10003;' : '&#10007;') +
    ' Budget fit (' + r.budgetPts + '/20) — est. $' + r.total + ', target $' + sc.minBudget + '&ndash;$' + sc.maxBudget + '</li>';
  if (sc.mustInclude){
    html += '<li class="' + (r.specialOk ? 'ok' : 'bad') + '">' + (r.specialOk ? '&#10003;' : '&#10007;') +
      ' Required dish (' + r.specialPts + '/10) — must include ' + esc(ITEM[sc.mustInclude].name) + '</li>';
  }
  html += '</ul></div>';

  if (cr.courseCount){
    html += '<div class="card" style="text-align:center;">' +
      '<div class="score-circle" style="background:radial-gradient(circle at 32% 28%, var(--accent) 0%, var(--accent-deep) 72%);box-shadow:0 6px 0 var(--accent-deep), 0 12px 22px rgba(0,0,0,.18);">' +
      '<span class="num" style="color:var(--accent-ink);">' + cr.score + '</span><span class="lbl" style="color:var(--accent-ink);">course &amp; pairing</span></div>' +
      '<p class="muted">' + cr.courseCount + '-course build</p></div>';

    html += '<div class="card"><h2>Course &amp; pairing breakdown</h2><ul class="checklist">';
    html += '<li class="' + (cr.assignedCount === cr.totalDishes ? 'ok' : 'bad') + '">' +
      (cr.assignedCount === cr.totalDishes ? '&#10003;' : '&#10007;') + ' Dishes assigned (' + cr.assignPts + '/25) — ' +
      cr.assignedCount + ' of ' + cr.totalDishes + ' dishes placed in a course</li>';
    html += '<li class="' + (cr.usedCount === cr.courseCount ? 'ok' : 'bad') + '">' +
      (cr.usedCount === cr.courseCount ? '&#10003;' : '&#10007;') + ' Courses used (' + cr.usedPts + '/25) — ' +
      cr.usedCount + ' of ' + cr.courseCount + ' courses have at least one dish</li>';
    html += '<li class="' + (cr.pairedCount === cr.courseCount ? 'ok' : 'bad') + '">' + (cr.pairedCount === cr.courseCount ? '&#10003;' : '&#10007;') +
      ' Pairings offered (' + cr.pairingPts + '/35) — ' + cr.pairedCount + ' of ' + cr.courseCount + ' courses paired with a drink</li>';
    html += '<li class="' + (cr.varietyPts === 15 ? 'ok' : 'bad') + '">' + (cr.varietyPts === 15 ? '&#10003;' : '&#10007;') +
      ' Variety (' + cr.varietyPts + '/15) — ' + (cr.pairedCount <= 1 ?
        'not enough pairings yet to judge variety' : cr.distinctCount + ' distinct beverage' + (cr.distinctCount === 1 ? '' : 's') + ' used across paired courses') + '</li>';
    html += '</ul></div>';

    html += '<div class="card"><h2>The courses</h2>';
    for (var c = 1; c <= cr.courseCount; c++){
      var courseItems = selected.filter(function(id){ return courseAssign[id] === c; }).map(function(id){ return ITEM[id]; }).filter(Boolean);
      var pairedId = beveragePairings[c];
      var paired = pairedId ? BEVERAGE[pairedId] : null;
      html += '<p class="small" style="margin:10px 0 2px;"><strong>Course ' + c + '</strong></p>';
      if (courseItems.length){
        courseItems.forEach(function(it){
          html += '<p class="small" style="margin:2px 0;">' + catPill(it.cat) + ' ' + esc(it.name) + ' — ' + esc(it.price) + '</p>';
        });
      } else {
        html += '<p class="small muted" style="margin:2px 0;">No dishes assigned</p>';
      }
      if (paired){
        html += '<p class="small" style="margin:2px 0;">' + bevCatPill(paired.cat) + ' <strong>' + esc(paired.name) + '</strong> — ' + esc(paired.price) + '</p>';
      }
    }
    html += '<p class="muted small">Prices estimated at the lower listed price per item; actual portions/pricing may vary.</p></div>';
  } else {
    html += '<div class="card"><h2>The dinner</h2>';
    selected.forEach(function(id){
      var it = ITEM[id];
      html += '<p class="small">' + catPill(it.cat) + ' <strong>' + esc(it.name) + '</strong> — ' + esc(it.price) + '</p>';
    });
    html += '<p class="muted small">Prices estimated at the lower listed price per item; actual portions/pricing may vary.</p></div>';
  }

  html += '<div class="card"><h2>Pitch it</h2>' +
    '<p class="small">In a sentence or two, how would you explain this dinner to the guest?</p>' +
    '<textarea id="justification" placeholder="e.g. We started light with...">' + esc(state.justification || '') + '</textarea>' +
    '<div class="btn-row"><button class="btn" data-action="finish-dinner">Done &mdash; show send options</button></div></div>';

  if (state.finished){
    var just = (document.getElementById('justification') || {}).value || state.justification || '';
    var summary = dinnerSummaryText(sc, selected, r, just, identity.name, false, cr, courseAssign, beveragePairings);
    html += sendRow(summary, 'Folietta dinner build — ' + identity.name, 'folietta-dinner-' + sc.id);
    html += '<div class="btn-row"><button class="btn secondary" data-action="go" data-view="home">Back to home</button></div>';
  }

  return html;
}
