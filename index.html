  // staff never chose a removal (or chose the wrong ingredient), or — when
  // the restriction is seat-specific — a correctly-modified dish that
  // never got routed to the seat that actually needs it.
  // modChecks records every modifiable dish encountered, right or wrong,
  // so the breakdown can show what was asked and what was answered.
  var violations = [];
  var modChecks = [];
  if (scenario.restriction){
    items.forEach(function(it){
      if (!violatesRestriction(it, scenario.restriction)) return;
      var mod = dishMod(it, scenario.restriction);
      if (mod){
        var chosen = dishMods[it.id];
        var ingredientOk = !!chosen && mod.remove.indexOf(chosen) !== -1;
        var placedSeat = seating[it.id];
        var seatOk = !seatSpecific || (typeof placedSeat === 'number' && allergySeats.indexOf(placedSeat) !== -1);
        var correct = ingredientOk && seatOk;
        modChecks.push({
          item: it, remove: mod.remove, chosen: chosen, ingredientOk: ingredientOk,
          seatSpecific: seatSpecific, seatOk: seatOk, placedSeat: placedSeat, correct: correct
        });
        if (!correct) violations.push(it);
      } else {
        violations.push(it);
      }
    });
  }

  var safetyPts = violations.length === 0 ? 30 : 0;

  // Group-menu scenarios (Private Event Brochure's fixed $85/$95/$110
  // Family-Style menus) score differently from a la carte ones: there's no
  // per-item budget to hit and no fixed "course coverage" target — instead
  // what matters is (a) did the staff pick only dishes that are actually
  // valid for the stated tier, with at least one per course, and (b) did
  // they order the right quantity of each (the stated house rule is 1
  // dish per 4 guests, rounded up so the table isn't short a plate).
  // Safety (above) and the "required dish" slot (below, always a flat 10
  // since group menus never set mustInclude) are shared with the a la
  // carte scoring path unchanged.
  if (scenario.groupMenuPrice){
    var menu = groupMenuFor(scenario.groupMenuPrice) || {};
    var validIds = groupMenuValidIds(menu);
    var invalidPicks = selectedIds.filter(function(id){ return validIds.indexOf(id) !== -1 ? false : true; })
      .filter(function(id){ return ITEM[id]; });
    var courseCoverage = {};
    GROUP_COURSE_KEYS.forEach(function(k){
      courseCoverage[k] = selectedIds.some(function(id){ return (menu[k] || []).indexOf(id) !== -1; });
    });
    var coveredCourseCount = GROUP_COURSE_KEYS.filter(function(k){ return courseCoverage[k]; }).length;
    // Full 40 only once all 4 courses have a valid pick; each dish that
    // isn't on this tier's menu at all pulls 10 further off, floored at 0
    // — picking something off the wrong tier is a real mistake, not just
    // an incomplete one.
    var selectionPts = Math.max(0, Math.round(40 * coveredCourseCount / GROUP_COURSE_KEYS.length) - invalidPicks.length * 10);
    var requiredQty = Math.ceil(scenario.seats / 4);
    var validSelected = selectedIds.filter(function(id){ return validIds.indexOf(id) !== -1; });
    groupQty = groupQty || {};
    var qtyCorrectCount = validSelected.filter(function(id){ return groupQty[id] === requiredQty; }).length;
    var quantityPts = validSelected.length ? Math.round(20 * qtyCorrectCount / validSelected.length) : 0;
    var gSpecialPts = 10, gSpecialOk = true; // group menus never set mustInclude
    var gScore = safetyPts + selectionPts + quantityPts + gSpecialPts;
    return {
      total: total, violations: violations, modChecks: modChecks, safetyPts: safetyPts,
      isGroupMenu: true, groupMenuPrice: scenario.groupMenuPrice, requiredQty: requiredQty,
      invalidPicks: invalidPicks, courseCoverage: courseCoverage, coveredCourseCount: coveredCourseCount,
      selectionPts: selectionPts, validSelected: validSelected, qtyCorrectCount: qtyCorrectCount,
      quantityPts: quantityPts, specialPts: gSpecialPts, specialOk: gSpecialOk, score: gScore
    };
  }

  var completenessPts = Math.round(40 * Math.min(1, coveredCount / scenario.minCourses));
  var inBudget = total >= scenario.minBudget && total <= scenario.maxBudget;
  var nearBudget = !inBudget && total >= scenario.minBudget * 0.75 && total <= scenario.maxBudget * 1.25;
  var budgetPts = inBudget ? 20 : (nearBudget ? 10 : 0);
  var specialPts;
  var specialOk = true;
  if (scenario.mustInclude){
    specialOk = selectedIds.indexOf(scenario.mustInclude) !== -1;
    specialPts = specialOk ? 10 : 0;
  } else {
    specialPts = 10;
  }
  var score = safetyPts + completenessPts + budgetPts + specialPts;

  return {
    total: total, coveredCount: coveredCount, violations: violations, modChecks: modChecks,
    safetyPts: safetyPts, completenessPts: completenessPts, budgetPts: budgetPts, specialPts: specialPts,
    inBudget: inBudget, specialOk: specialOk, score: score
  };
}

// ---------------------------------------------------------------------
// Scoring: Course & Pairing layer (3-6 courses, one beverage per course)
// Deliberately NOT trying to grade whether a specific wine "correctly"
// matches a specific dish — that's real sommelier judgment this game
// doesn't have a dataset for, and a fake correctness check would just
// teach staff the wrong thing with false confidence. Instead this scores
// the parts that ARE objectively checkable: did every dish land in a
// course, is every course actually used (no empty courses), did most
// courses get a pairing attached, and did staff vary the pairings rather
// than pouring the same glass for the whole table.
// ---------------------------------------------------------------------
// seats: the scenario's seat count — only used to sanity-check a glass
// count (can't need more pours than there are guests at the table). Safe
// to omit for callers that don't have it handy; placement just skips that
// upper-bound check.
function scoreCourses(courseCount, selectedIds, courseAssign, beveragePairings, seats){
  courseAssign = courseAssign || {};
  beveragePairings = beveragePairings || {};
  var n = courseCount || 0;

  var assignedCount = selectedIds.filter(function(id){
    var c = courseAssign[id];
    return typeof c === 'number' && c >= 1 && c <= n;
  }).length;
  var assignPts = selectedIds.length ? Math.round(20 * assignedCount / selectedIds.length) : 0;

  var usedCourses = {};
  selectedIds.forEach(function(id){
    var c = courseAssign[id];
    if (typeof c === 'number' && c >= 1 && c <= n) usedCourses[c] = true;
  });
  var usedCount = Object.keys(usedCourses).length;
  var usedPts = n ? Math.round(20 * usedCount / n) : 0;

  var pairedCourseNums = [];
  for (var i = 1; i <= n; i++){ if (beveragePairings[i] && beveragePairings[i].id) pairedCourseNums.push(i); }
  var pairedCount = pairedCourseNums.length;
  var pairingPts = n ? Math.round(25 * pairedCount / n) : 0;

  var distinctBevs = {};
  pairedCourseNums.forEach(function(c){ distinctBevs[beveragePairings[c].id] = true; });
  var distinctCount = Object.keys(distinctBevs).length;
  var varietyPts = pairedCount <= 1 ? 15 : (distinctCount >= 2 ? 15 : 0);

  // Placement: a glass pour gets assigned to the specific seat that ordered
  // it (or "shared" if more than one person wants the same pour); a bottle
  // is always "shared for the table" — nobody orders a 750ml bottle for
  // just one seat — and either way, once something is shared, staff need
  // to say how many glasses to actually bring out. This doesn't grade
  // which wine was picked (that's real sommelier judgment, see the note
  // above) — only whether the mechanics of serving it were worked out.
  var placementChecks = pairedCourseNums.map(function(c){
    var pairing = beveragePairings[c];
    var bev = BEVERAGE[pairing.id];
    var isBottle = !!(bev && bev.size === 'bottle');
    var glassesNum = typeof pairing.glasses === 'number' && !isNaN(pairing.glasses) ? pairing.glasses : null;
    var glassesOk = function(){ return glassesNum !== null && glassesNum >= 1 && (!seats || glassesNum <= seats); };
    var seatOk, glassOk;
    if (isBottle){
      seatOk = pairing.seat === 'shared';
      glassOk = glassesOk();
    } else if (pairing.seat === 'shared'){
      seatOk = true;
      glassOk = glassesOk();
    } else {
      seatOk = typeof pairing.seat === 'number';
      glassOk = true; // a single-seat pour is implicitly one glass
    }
    return { course: c, bev: bev, isBottle: isBottle, seat: pairing.seat, glasses: pairing.glasses, correct: seatOk && glassOk };
  });
  var placementCorrect = placementChecks.filter(function(p){ return p.correct; }).length;
  var placementPts = pairedCount ? Math.round(20 * placementCorrect / pairedCount) : 0;

  var score = assignPts + usedPts + pairingPts + placementPts + varietyPts;

  return {
    courseCount: n, assignedCount: assignedCount, totalDishes: selectedIds.length, assignPts: assignPts,
    usedCount: usedCount, usedPts: usedPts,
    pairedCount: pairedCount, pairingPts: pairingPts,
    placementChecks: placementChecks, placementCorrect: placementCorrect, placementPts: placementPts,
    distinctCount: distinctCount, varietyPts: varietyPts,
    score: score
  };
}

// ---------------------------------------------------------------------
// Scoring: per-seat beverage order — separate from the course/pairing
// layer above on purpose. Course pairings are a sommelier-style "what
// goes with this course" suggestion for the table; this is the actual
// drink order for each individual guest (a cocktail to start, wine with
// dinner, an espresso after — however many, whatever mix), which has no
// single "correct" answer the way a safety violation does. So which
// beverage a guest picks is never graded here — EXCEPT for the one thing
// that genuinely does have a correct/incorrect answer: pouring something
// that conflicts with a seat's stated dietary restriction or allergy
// (e.g. a barley-brewed beer for a gluten-free seat). That reuses the
// same violatesRestriction() check the dish-safety scoring uses, since
// beverages now carry the same .dietary/.allergens shape as dishes.
// completeness (every seat asked) is worth 60, safety (no restricted-seat
// violations) is worth 40 — mirrors dish scoring's weight toward safety.
function scoreSeatBeverages(scenario, seatBeverages, seatNoBeverage, allergySeats){
  seatBeverages = seatBeverages || {};
  seatNoBeverage = seatNoBeverage || {};
  allergySeats = allergySeats || [];
  var seats = (scenario && scenario.seats) || 0;
  var restriction = scenario && scenario.restriction;
  var handledCount = 0, unhandledSeats = [], violations = [];
  for (var s = 1; s <= seats; s++){
    var orders = seatBeverages[s] || [];
    var hasOrder = orders.length > 0 || !!seatNoBeverage[s];
    if (hasOrder) handledCount++; else unhandledSeats.push(s);
    if (restriction && allergySeats.indexOf(s) !== -1){
      for (var i = 0; i < orders.length; i++){
        var b = BEVERAGE[orders[i]];
        if (b && violatesRestriction(b, restriction)) violations.push({ seat: s, bev: b });
      }
    }
  }
  var completenessPts = seats ? Math.round(60 * handledCount / seats) : 0;
  var safetyPts = violations.length === 0 ? 40 : 0;
  var score = completenessPts + safetyPts;
  return { seats: seats, handledCount: handledCount, unhandledSeats: unhandledSeats,
    violations: violations, completenessPts: completenessPts, safetyPts: safetyPts, score: score };
}
// Short phrase explaining WHY a beverage conflicts with a restriction, for
// the warning text next to a flagged seat order.
function beverageViolationReason(restriction){
  if (restriction === 'vegetarian') return 'not vegetarian';
  if (restriction === 'pork') return 'contains pork';
  if (restriction === 'gluten') return 'contains gluten';
  if (restriction === 'dairy') return 'contains dairy';
  if (restriction === 'shellfish') return 'contains shellfish';
  if (restriction === 'treenut') return 'contains tree nuts';
  if (restriction === 'peanut') return 'contains peanuts';
  if (restriction === 'egg') return 'contains egg';
  return 'conflicts with the restriction';
}

// ---------------------------------------------------------------------
// Quiz question generation
// ---------------------------------------------------------------------
var SYN = {
  gluten: ['gluten','wheat','flour','bread','breadcrumb','breadcrumbs','pasta','semolina','dough'],
  dairy: ['dairy','milk','cheese','cream','butter','parmesan','parmigiano','pecorino','ricotta','mozzarella',
          'mascarpone','burrata','yogurt','whey','taleggio','provolone','grana'],
  egg: ['egg','eggs','yolk','yolks'],
  fish: ['fish','anchovy','anchovies'],
  shellfish: ['shellfish','crustacean','crustaceans','mollusc','mollusk','molluscs','mollusks','shrimp',
              'prawn','prawns','squid','octopus','seafood'],
  treenut: ['nut','nuts','treenut','almond','almonds','walnut','walnuts','hazelnut','hazelnuts',
            'pinenut','pinenuts','pine'],
  mustard: ['mustard','dijon']
};
function parseAllergenInput(text){
  var t = (text || '').toLowerCase();
  var found = {};
  if (/\bnone\b|\bno allergens?\b|\bnothing\b|^n\/a$/.test(t)) return found;
  Object.keys(SYN).forEach(function(tag){
    var words = SYN[tag];
    for (var i = 0; i < words.length; i++){
      if (t.indexOf(words[i]) !== -1){ found[tag] = true; break; }
    }
  });
  return found;
}
function setsEqual(a, b){
  var ak = Object.keys(a), bk = Object.keys(b);
  if (ak.length !== bk.length) return false;
  for (var i = 0; i < ak.length; i++) if (!b[ak[i]]) return false;
  return true;
}

function genNameTheDish(item){
  var pool = ITEMS.filter(function(i){ return i.id !== item.id; });
  var distractors = sample(pool, 3).map(function(i){ return i.name; });
  var options = shuffle(distractors.concat([item.name]));
  return {
    kind: 'mc', qtype: 'name-the-dish',
    prompt: 'Which dish is described as: "' + item.desc + '"?',
    options: options, correctAnswer: item.name, itemId: item.id
  };
}
function genYesNo(item){
  var has = item.allergens;
  var allergen;
  if (has.length && Math.random() < 0.5){
    allergen = has[Math.floor(Math.random() * has.length)];
  } else {
    var not = ALLERGENS.filter(function(a){ return has.indexOf(a) === -1; });
    allergen = not.length ? not[Math.floor(Math.random() * not.length)] : (has[0] || ALLERGENS[0]);
  }
  var correct = has.indexOf(allergen) !== -1;
  return {
    kind: 'mc', qtype: 'yes-no',
    prompt: 'True or False — ' + item.name + ' contains ' + ALLERGEN_LABEL[allergen] + '.',
    options: ['True', 'False'], correctAnswer: correct ? 'True' : 'False', itemId: item.id
  };
}
function genTypeAllergens(item){
  var correctSet = {}; item.allergens.forEach(function(a){ correctSet[a] = true; });
  return {
    kind: 'type', qtype: 'type-allergens',
    prompt: 'Type the allergens in ' + item.name + ' (comma-separated — type "none" if none of the 7 major allergens apply).',
    correctSet: correctSet, itemId: item.id
  };
}
function genFlashcard(item){
  return { kind: 'flashcard', qtype: 'drop-line', itemId: item.id };
}

function genMenuAlgoQuestions(count){
  var pool = ITEMS.slice();
  var withDropLine = ITEMS.filter(function(i){ return i.drop && i.drop.trim(); });
  var nName = Math.max(1, Math.round(count * 0.42));
  var nYes = Math.max(1, Math.round(count * 0.25));
  var nType = Math.max(1, Math.round(count * 0.17));
  var nFlash = Math.max(1, count - nName - nYes - nType);

  var qs = [];
  sample(pool, Math.min(nName, pool.length)).forEach(function(it){ qs.push(genNameTheDish(it)); });
  sample(pool, Math.min(nYes, pool.length)).forEach(function(it){ qs.push(genYesNo(it)); });
  sample(pool, Math.min(nType, pool.length)).forEach(function(it){ qs.push(genTypeAllergens(it)); });
  sample(withDropLine, Math.min(nFlash, withDropLine.length)).forEach(function(it){ qs.push(genFlashcard(it)); });
  return qs;
}
function bankQuestions(cat){
  return QUESTION_BANK.filter(function(q){ return q.category === cat; }).map(function(q){
    return { kind: 'mc', qtype: 'trivia-' + cat, category: cat, prompt: q.prompt, options: shuffle(q.options.slice()), correctAnswer: q.correctAnswer };
  });
}

// cats: array of QUIZ_CATEGORIES keys to draw from. Defaults to all of them.
// 'menu' mixes the algorithmic per-dish generators above with the static
// menu trivia in QUESTION_BANK; 'service'/'host'/'bar' are static-bank-only.
function buildQuiz(n, cats){
  cats = (cats && cats.length) ? cats : QUIZ_CATEGORIES.map(function(c){ return c.key; });
  var base = Math.floor(n / cats.length);
  var rem = n - base * cats.length;
  var targets = {};
  cats.forEach(function(c, i){ targets[c] = base + (i < rem ? 1 : 0); });

  var pools = {};
  cats.forEach(function(c){
    pools[c] = (c === 'menu')
      ? shuffle(genMenuAlgoQuestions(n).concat(bankQuestions('menu')))
      : shuffle(bankQuestions(c));
  });

  var qs = [];
  var deficit = 0;
  cats.forEach(function(c){
    var take = Math.min(targets[c], pools[c].length);
    deficit += targets[c] - take;
    qs = qs.concat(pools[c].splice(0, take));
  });
  if (deficit > 0){
    cats.forEach(function(c){
      if (deficit <= 0) return;
      var extra = Math.min(deficit, pools[c].length);
      if (extra > 0){ qs = qs.concat(pools[c].splice(0, extra)); deficit -= extra; }
    });
  }

  return shuffle(qs).slice(0, n);
}

// ---------------------------------------------------------------------
// "Run the Floor" — table/seat numbers + kitchen-to-table routing
// ---------------------------------------------------------------------
function dishPickup(item){
  if (item.cat === 'antipasti') return ANTIPASTI_PICKUP[item.id] || 'hot';
  return CATEGORY_PICKUP[item.cat] || 'hot';
}
// ---------------------------------------------------------------------
// Free-roam floor movement — the server drags an X slider and a Y slider
// to walk the actual floor plan themselves. There's no taught route and no
// "wrong turn" tap anymore: they choose how to get there and back, and the
// round is scored on how good those choices were (did they reach the right
// spot, how direct a line they walked, how quickly, and whether they kept
// moving forward through the room instead of backtracking over their own
// steps). Walls and furniture are real obstacles — the slider won't drag
// the character through a table, the bar, the host stand, the washrooms,
// or the kitchen pass.
// ---------------------------------------------------------------------
function floorPickupPoint(){
  var z = ZONE['pickup-hot'];
  return [z.x, z.y];
}
// Where a given forward/return target "counts" as reached. Tables use a
// capture radius around their point; counters and the kitchen pass use the
// open aisle in front of them (reached the moment you're anywhere along it).
function floorTargetPoint(target){
  if (target.id === 'pickup-hot') return floorPickupPoint();
  if (target.isCounter){
    var z = ZONE[target.zone];
    return [z.x, z.y - z.h / 2 + z.h * 0.74];
  }
  return [target.x, target.y];
}
function floorIsAtTarget(x, y, target){
  if (target.id === 'pickup-hot'){
    var zp = ZONE['pickup-hot'];
    var x0p = zp.x - zp.w / 2, y0p = zp.y - zp.h / 2;
    return x >= x0p && x <= x0p + zp.w && y >= y0p && y <= y0p + zp.h;
  }
  if (target.isCounter){
    var zc = ZONE[target.zone];
    var x0c = zc.x - zc.w / 2, y0c = zc.y - zc.h / 2;
    return x >= x0c && x <= x0c + zc.w && y >= y0c + zc.h * 0.52 && y <= y0c + zc.h;
  }
  var dx = x - target.x, dy = y - target.y;
  return Math.sqrt(dx * dx + dy * dy) <= 4.4;
}
// Furniture/wall obstacles the character can't be dragged through, built
// once from the same real zone/table geometry the map is drawn from.
var FLOOR_OBSTACLES = (function(){
  var obs = [];
  FLOOR_ZONES.forEach(function(z){
    var x0 = z.x - z.w / 2, y0 = z.y - z.h / 2;
    if (z.kind === 'counter'){
      // Every counter zone (bar-top, bar, chef's-bar, server-counter) now
      // sits well short of the building's full width — the real plan's
      // actual proportions, not a square-cropped stylization — so each
      // one already has real open floor at both ends; no artificial gap
      // needs to be carved out of any of them.
      // Only the solid counter SLAB is impassable — staff can't walk on
      // top of the bar, but the open floor along its guest-facing side
      // (where the stools are) stays walkable so a server can still reach
      // each seat. Most counters are wider than they are deep (bar-top,
      // chef's-bar, server-counter) and run the slab along their full
      // width; the 'bar' zone is the one counter that's taller than it is
      // wide (it's the vertical leg of the L, see data.py), so its slab
      // has to run along its full HEIGHT instead — same rule as
      // svgCounterShape in the renderer below, kept in sync by hand. A
      // zone's "flip" puts that slab on the far side of its stools instead
      // of the near side (see data.py's 'bar' entry for why).
      if (z.h > z.w){
        var barX0 = z.flip ? x0 + z.w * 0.5 : x0 + z.w * 0.08;
        var barX1 = barX0 + z.w * 0.42;
        obs.push({ x0: barX0, y0: y0, x1: barX1, y1: y0 + z.h });
      } else {
        var barY0 = z.flip ? y0 + z.h * 0.5 : y0 + z.h * 0.08;
        var barY1 = barY0 + z.h * 0.42;
        obs.push({ x0: x0, y0: barY0, x1: x0 + z.w, y1: barY1 });
      }
    } else if (z.kind === 'podium'){
      obs.push({ x0: z.x - 3.8, y0: z.y - 2.9, x1: z.x + 3.8, y1: z.y + 2.9 });
    } else if (z.kind === 'door'){
      obs.push({ x0: x0, y0: y0, x1: x0 + z.w, y1: y0 + z.h });
    }
    // 'kitchen' (Hot/Cold Pickup) is open floor the server stands in — the
    // pass-edge drawn below is just flavour, not a wall, so no obstacle.
  });
  FLOOR_TABLES.forEach(function(t){
    var fourTop = t.seats.length >= 4;
    obs.push(fourTop
      ? { x0: t.x - 2.7, y0: t.y - 2.7, x1: t.x + 2.7, y1: t.y + 2.7 }
      : { x0: t.x - 2.7, y0: t.y - 1.8, x1: t.x + 2.7, y1: t.y + 1.8 });
  });
  // Real walls (see FLOOR_WALLS in data.py) — the building's true,
  // non-rectangular outline and the dining-room/patio divider with its
  // three actual door gaps. Unlike furniture, these aren't optional
  // flavour: crossing one isn't just "bumping a table", it's walking
  // through a load-bearing wall, so they go in the same obstacle list.
  FLOOR_WALLS.forEach(function(w){ obs.push({ x0: w.x0, y0: w.y0, x1: w.x1, y1: w.y1 }); });
  return obs;
})();
function floorPointBlocked(x, y){
  for (var i = 0; i < FLOOR_OBSTACLES.length; i++){
    var o = FLOOR_OBSTACLES[i];
    if (x >= o.x0 && x <= o.x1 && y >= o.y0 && y <= o.y1) return true;
  }
  return false;
}
// Drags one axis toward a desired value in small steps, stopping right at
// the edge of whatever wall/table is in the way — a soft collision so the
// slider thumb itself settles at the blocked spot instead of sailing on.
function floorStepAxis(oldX, oldY, desired, axis){
  var cur = axis === 'x' ? oldX : oldY;
  var lo = 2, hi = (axis === 'x' ? WORLD_W : WORLD_H) - 2;
  desired = Math.max(lo, Math.min(hi, desired));
  if (Math.abs(desired - cur) < 0.05) return floorPointBlocked(axis === 'x' ? desired : oldX, axis === 'x' ? oldY : desired) ? cur : desired;
  var dir = desired > cur ? 1 : -1, step = 0.4, v = cur;
  while (true){
    var next = v + dir * step;
    if ((dir > 0 && next > desired) || (dir < 0 && next < desired)) next = desired;
    var tx = axis === 'x' ? next : oldX, ty = axis === 'y' ? next : oldY;
    if (floorPointBlocked(tx, ty)) break;
    v = next;
    if (v === desired) break;
  }
  return v;
}
function buildFloorRound(){
  var table = FLOOR_TARGETS[Math.floor(Math.random() * FLOOR_TARGETS.length)];
  var n = 2 + Math.floor(Math.random() * 3); // 2-4 dishes
  var dishPool = sample(ITEMS, Math.min(n, ITEMS.length));
  var dishes = dishPool.map(function(it){
    var assign;
    if (table.shared && Math.random() < 0.4){
      assign = { type: 'shared' };
    } else {
      var seat = table.seats[Math.floor(Math.random() * table.seats.length)];
      assign = { type: 'seat', seat: seat };
    }
    return { id: it.id, name: it.name, cat: it.cat, pickup: dishPickup(it), assign: assign };
  });
  var pickupsNeeded = [];
  dishes.forEach(function(d){ if (pickupsNeeded.indexOf(d.pickup) === -1) pickupsNeeded.push(d.pickup); });
  var destZone = table.zone;
  var start = floorPickupPoint();

  return {
    table: table, dishes: dishes, pickupsNeeded: pickupsNeeded, destZone: destZone,
    // forward leg — starts already standing at Hot Pickup, walked freely from there
    fStart: start, fx: start[0], fy: start[1], fPath: [start.slice()],
    fArrived: false, fStartTime: null, fWrongSeen: {}, fWrongCount: 0, fMetrics: null,
    // plating
    placed: {}, armedDish: null,
    // return leg — seeded once plating is done (go-floor-return)
    rStart: null, rx: null, ry: null, rPath: null,
    rArrived: false, rStartTime: null, rWrongCount: 0, rMetrics: null
  };
}
// Turns a walked path + how long it took into a 0-100 score: did they reach
// the right spot without wandering into a wrong table/pass (accuracy),
// how close to a straight line was the path they actually walked
// (efficiency), how quick they were against a fair pace (speed), and
// whether they kept moving forward through the room rather than doubling
// back on themselves (smoothness — the "circular motion, not backtracking"
// ask). The four are weighted and combined into one leg score.
function floorLegMetrics(path, startPt, targetPt, elapsedMs, wrongCount){
  var pathLen = 0;
  for (var i = 1; i < path.length; i++){
    var dx = path[i][0] - path[i - 1][0], dy = path[i][1] - path[i - 1][1];
    pathLen += Math.sqrt(dx * dx + dy * dy);
  }
  var straight = Math.sqrt(Math.pow(targetPt[0] - startPt[0], 2) + Math.pow(targetPt[1] - startPt[1], 2));
  var efficiency = pathLen > 0.5 ? Math.max(0, Math.min(1, straight / pathLen)) : 1;
  var reversals = 0, segs = 0;
  for (var j = 1; j < path.length - 1; j++){
    var v1x = path[j][0] - path[j - 1][0], v1y = path[j][1] - path[j - 1][1];
    var v2x = path[j + 1][0] - path[j][0], v2y = path[j + 1][1] - path[j][1];
    var mag1 = Math.sqrt(v1x * v1x + v1y * v1y), mag2 = Math.sqrt(v2x * v2x + v2y * v2y);
    if (mag1 < 0.3 || mag2 < 0.3) continue;
    segs++;
    if ((v1x * v2x + v1y * v2y) < 0) reversals++;
  }
  var smoothness = segs > 0 ? Math.max(0, 1 - (reversals / segs) * 1.4) : 1;
  var elapsedSec = Math.max(0.1, elapsedMs / 1000);
  var par = Math.max(4, straight / 9 + 1.5);
  var speed = Math.max(0, Math.min(1, par / elapsedSec));
  var accuracy = Math.max(0, 1 - wrongCount * 0.18);
  var legScore = Math.round(100 * (0.30 * accuracy + 0.25 * efficiency + 0.20 * speed + 0.25 * smoothness));
  return {
    pathLen: pathLen, straight: straight, efficiency: efficiency, reversals: reversals,
    smoothness: smoothness, elapsedSec: elapsedSec, speed: speed, accuracy: accuracy,
    wrongCount: wrongCount, legScore: Math.max(10, Math.min(100, legScore))
  };
}
function floorRouteScore(r){
  return r.fMetrics ? r.fMetrics.legScore : 0;
}
function floorReturnScore(r){
  return r.rMetrics ? r.rMetrics.legScore : 0;
}
function floorPlacementScore(r){
  var correct = 0;
  r.dishes.forEach(function(d){
    var want = d.assign.type === 'shared' ? 'shared' : ('seat-' + d.assign.seat);
    if (r.placed[d.id] === want) correct++;
  });
  return { correct: correct, total: r.dishes.length, pct: Math.round(100 * correct / r.dishes.length) };
}

function copyText(text, btn){
  var done = function(ok){
    var orig = btn.textContent;
    btn.textContent = ok ? 'Copied!' : 'Copy failed';
    setTimeout(function(){ btn.textContent = orig; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ done(false); });
  } else {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(ok);
    } catch (e){ done(false); }
  }
}

function dinnerSummaryText(sc, selected, r, justification, playerName, forEmail, cr, courseAssign, beveragePairings, sr, seatBeverages, seatNoBeverage){

  lines.push('FOLIETTA — Build the Guest\'s Dinner');

    lines.push('  Safety ' + r.safetyPts + '/30, Menu selection ' + r.selectionPts + '/40, Order quantities ' + r.quantityPts + '/20, Required ' + r.specialPts + '/10');
    lines.push('  $' + r.groupMenuPrice + ' Family-Style Group Menu, ' + r.requiredQty + ' of each dish for this party');
  } else {
    lines.push('  Safety ' + r.safetyPts + '/30, Coverage ' + r.completenessPts + '/40, Budget ' + r.budgetPts + '/20, Required ' + r.specialPts + '/10');
  }
  if (r.violations.length){
    lines.push('Conflicts: ' + r.violations.map(function(v){
      var mc = r.modChecks.filter(function(m){ return m.item.id === v.id; })[0];
      if (mc){
        var bits = [];
        if (!mc.ingredientOk) bits.push('needed to remove: ' + mc.remove.join(', ') + '; staff removed: ' + (mc.chosen || 'nothing'));
        if (mc.ingredientOk && !mc.seatOk) bits.push('removed the right ingredient but served to ' + (mc.placedSeat ? (mc.placedSeat === 'shared' ? 'the shared table' : 'Seat ' + mc.placedSeat) : 'no assigned seat') + ' instead of the correct seat');
        return v.name + ' (' + bits.join('; ') + ')';
      }
      return v.name;
    }).join(', '));
  }
  var handledMods = r.modChecks.filter(function(m){ return m.correct; });
  if (handledMods.length){
    lines.push('Modified correctly: ' + handledMods.map(function(m){
      return m.item.name + ' (removed ' + m.chosen + (m.seatSpecific ? ', served to Seat ' + m.placedSeat : '') + ')';
    }).join(', '));
  }
  if (cr && cr.courseCount){
    lines.push('Course & pairing score: ' + cr.score + '/100');
    for (var c = 1; c <= cr.courseCount; c++){
      var names = selected.filter(function(id){ return courseAssign && courseAssign[id] === c; })
        .map(function(id){ return ITEM[id] ? ITEM[id].name : null; }).filter(Boolean);
      var pairingT = beveragePairings && beveragePairings[c];
      var bev = pairingT ? BEVERAGE[pairingT.id] : null;
      var bevDetail = '';
      if (bev){
        var seatBit = pairingT.seat === 'shared' ? 'shared' : (typeof pairingT.seat === 'number' ? 'Seat ' + pairingT.seat : 'seat not set');
        var glassBit2 = pairingT.glasses != null ? ', ' + pairingT.glasses + ' glasses' : '';
        bevDetail = ' — paired with ' + bev.name + ' (' + (bev.size === 'bottle' ? 'bottle' : 'glass') + ', ' + seatBit + glassBit2 + ')';
      }
      lines.push('  Course ' + c + ': ' + (names.length ? names.join(', ') : '(no dishes assigned)') + bevDetail);
    }
  } else {
    lines.push('Dinner: ' + selected.map(function(id){ return ITEM[id].name; }).join(', '));
  }
  if (sr && sr.seats){
    lines.push('Beverage order score: ' + sr.score + '/100 (' + sr.handledCount + ' of ' + sr.seats + ' seats asked' +
      (sr.violations && sr.violations.length ? ', ' + sr.violations.length + ' unsafe pour' + (sr.violations.length === 1 ? '' : 's') : '') + ')');
    if (sr.violations && sr.violations.length){
      lines.push('  Unsafe for the ' + restrictionLabel(sc.restriction) + ' restriction: ' +
        sr.violations.map(function(v){ return 'Seat ' + v.seat + ' (' + v.bev.name + ')'; }).join(', '));
    }
    for (var sSeat = 1; sSeat <= sr.seats; sSeat++){
      var sOrders = (seatBeverages && seatBeverages[sSeat]) || [];
      var sDeclined = !!(seatNoBeverage && seatNoBeverage[sSeat]);
      var sText = sDeclined ? 'no drink' : (sOrders.length ? sOrders.map(function(bid){ var b = BEVERAGE[bid]; return b ? b.name : null; }).filter(Boolean).join(', ') : 'not asked');
      lines.push('  Seat ' + sSeat + ': ' + sText);
    }
  }
  if (justification) lines.push('Pitch: ' + justification);
  lines.push('Completed: ' + new Date().toLocaleString());
  return lines.join('\n');
}
function quizSummaryText(answers, playerName){
  var graded = answers.filter(function(a){ return a.kind !== 'flashcard'; });
  var correctCount = graded.filter(function(a){ return a.correct; }).length;
  var flash = answers.filter(function(a){ return a.kind === 'flashcard'; });
  var fcGot = flash.filter(function(a){ return a.gotIt; }).length;
  var lines = [];
  lines.push('FOLIETTA — Menu Quiz');
  lines.push('Player: ' + playerName);
  lines.push('Score: ' + correctCount + '/' + graded.length + ' graded' + (flash.length ? ', ' + fcGot + '/' + flash.length + ' drop lines self-marked' : ''));
  lines.push('');
  answers.forEach(function(a, i){
    if (a.kind === 'flashcard'){
      lines.push((i + 1) + '. [drop line] ' + ITEM[a.itemId].name + ' — ' + (a.gotIt ? 'got it' : 'missed'));
    } else {
      lines.push((i + 1) + '. ' + (a.correct ? '[correct] ' : '[missed] ') + a.prompt + ' — answered: ' + a.yourAnswer +
        (a.correct ? '' : ' (correct: ' + a.correctAnswerText + ')'));
    }
  });
  lines.push('');
  lines.push('Completed: ' + new Date().toLocaleString());
  return lines.join('\n');
}

    '<div class="btn-row"><button class="btn" data-action="submit-group-dinner" ' + (selected.length === 0 ? 'disabled' : '') + '>Build this dinner &rarr;</button></div>' +
    '</div>';

  return html;
}

// A small reusable notice: when this scenario's restriction applies to a
// specific subset of seats (not the whole table), say exactly which seat(s)
// — the way a server would actually be told by the host — so staff can aim
// a modified plate at the right person. When every seat shares it (e.g. All
// Vegetarian), there's no single seat to call out, so this renders nothing.
function allergySeatNotice(sc){
  var seats = state.allergySeats || [];
  if (!sc.restriction || !seats.length || seats.length >= sc.seats) return '';
  var seatWord = seats.length === 1 ? 'Seat' : 'Seats';
  var seatList = seats.join(', ');
  return '<p class="small" style="margin-top:8px;"><strong>&#9888; ' + seatWord + ' ' + esc(String(seatList)) +
    '</strong> — that’s who told you about the ' + esc(restrictionLabel(sc.restriction)) + ' restriction. Any modified plate needs to land there specifically, not folded into a shared course.</p>';
}

// ---------------------------------------------------------------------
// View: Seating & Modifications — sits between picking dishes and
// building courses. Steps through the selected dishes one at a time so
// the "who's this for" call and any allergy/dietary modification get
// full attention instead of competing with the whole item grid at once.
// state.seating ({itemId: 'shared'|seatNumber}) and state.dishMods carry
// forward into viewDinnerCourses and viewDinnerResult for scoring.
// ---------------------------------------------------------------------
function viewDinnerSeating(){
  var sc = SCENARIOS.filter(function(s){ return s.id === state.scenarioId; })[0];
  var selected = state.selected || [];
  var seating = state.seating || {};
  var dishMods = state.dishMods || {};
  var modOptionOrder = state.modOptionOrder || {};

  var html = topbar('Seating & Modifications', null);

  if (!selected.length){
    html += '<div class="card"><p class="muted small">No dishes picked yet — go back and pick some first.</p>' +
      '<div class="btn-row"><button class="btn secondary" data-action="back-to-dinner-build">&larr; Edit dishes</button></div></div>';
    return html;
  }

  var unresolvedCount = 0;
  selected.forEach(function(sid){
    var sit = ITEM[sid];
    if (sc.seats > 1 && !seating[sid]) unresolvedCount++;
    if (sc.restriction && sit && violatesRestriction(sit, sc.restriction)){
      var sMod = dishMod(sit, sc.restriction);
      if (sMod && !dishMods[sid]) unresolvedCount++;
    }
  });

  html += '<div class="card">' +
    '<h2>' + esc(sc.title) + '</h2>' +
    '<p class="small">For every dish: say who it&rsquo;s for, and resolve any dietary conflicts. Scroll down to see them all.</p>' +
    allergySeatNotice(sc) +
    (unresolvedCount ? '<p class="small" style="margin-top:8px;color:#9a3b12;"><strong>&#9888; ' + unresolvedCount +
      ' thing' + (unresolvedCount === 1 ? '' : 's') + ' still need' + (unresolvedCount === 1 ? 's' : '') + ' attention below.</strong></p>' : '') +
    '<div class="btn-row"><button class="btn secondary" data-action="back-to-dinner-build">&larr; Edit dishes</button></div>' +
    '</div>';

  selected.forEach(function(id){
    var it = ITEM[id];
    if (!it) return;

    html += '<div class="card">' +
      '<p class="small muted" style="margin:0 0 4px;">' + catPill(it.cat) + '</p>' +
      '<h2>' + esc(it.name) + '</h2>' +
      '<p class="small">' + esc(it.desc) + '</p>';

    if (sc.seats > 1){
      html += '<p class="small" style="margin:12px 0 4px;"><strong>Who is this for?</strong></p><div class="cat-tabs">';
      html += '<button class="cat-tab' + (seating[id] === 'shared' ? ' active' : '') +
        '" data-action="set-seat" data-id="' + esc(id) + '" data-seat="shared">Shared for the table</button>';
      for (var s = 1; s <= sc.seats; s++){
        html += '<button class="cat-tab' + (seating[id] === s ? ' active' : '') +
          '" data-action="set-seat" data-id="' + esc(id) + '" data-seat="' + s + '">Seat ' + s + '</button>';
      }
      html += '</div>';
      if (!seating[id]) html += '<p class="small muted" style="margin:4px 0 0;">Not yet chosen.</p>';
    }

    if (sc.restriction && violatesRestriction(it, sc.restriction)){
      var mod = dishMod(it, sc.restriction);
      if (mod){
        var chosen = dishMods[id];
        var opts = modOptionOrder[id] || mod.options;
        html += '<p class="small" style="margin:14px 0 4px;"><strong>&#9888; Needs a modification</strong> — which ingredient has to come out?</p><div class="cat-tabs">' +
          opts.map(function(opt){
            return '<button class="cat-tab' + (chosen === opt ? ' active' : '') + '" data-action="choose-mod" data-id="' +
              esc(id) + '" data-opt="' + esc(opt) + '">' + esc(opt) + '</button>';
          }).join('') + '</div>';
        if (!chosen){
          html += '<p class="small muted" style="margin:4px 0 0;">Not yet chosen — this counts against safety until resolved.</p>';
        } else if (sc.seats > 1){
          html += '<p class="small muted" style="margin:4px 0 0;">Remember: this plate needs to reach the right seat, not just the right ingredient removed.</p>';
        }
      } else {
        html += '<p class="small" style="margin:14px 0 0;"><strong>&#9888; Conflicts, no safe modification</strong> — this dish can’t be fixed for this guest’s restriction. It shouldn’t go to this table.</p>';
      }
    }

    html += '</div>';
  });

  html += '<div class="tray"><div class="btn-row"><button class="btn" data-action="continue-to-courses">Continue to courses &rarr;</button></div></div>';

  return html;
}

// ---------------------------------------------------------------------
// View: Course & pairing builder — splits the picked dishes into 3-6
// courses and lets a beverage be paired with each one from the real wine
// list / cocktail menu / aperitivi / vermouth / digestivi / beer /
// non-alcoholic program. Sits between picking dishes and the result
// screen; state.courseAssign and state.beveragePairings are carried
// forward from here into viewDinnerResult for scoring + the send summary.
// ---------------------------------------------------------------------
function viewDinnerCourses(){
  var sc = SCENARIOS.filter(function(s){ return s.id === state.scenarioId; })[0];
  var selected = state.selected || [];
  var n = state.courseCount || 3;
  var assign = state.courseAssign || {};
  var pairings = state.beveragePairings || {};

  var html = topbar('Build the Courses', null);
  html += '<div class="card">' +
    '<h2>' + esc(sc.title) + '</h2>' +
    '<p class="small">Split the ' + selected.length + ' item' + (selected.length === 1 ? '' : 's') +
    ' you picked into courses — you&rsquo;ll pair a beverage with each one next.</p>' +
    '<div class="btn-row"><button class="btn secondary" data-action="back-to-dinner-seating">&larr; Edit seating &amp; mods</button></div>' +
    '</div>';

  html += '<div class="card"><h2>How many courses?</h2><div class="cat-tabs">';
  [3, 4, 5, 6].forEach(function(c){
    html += '<button class="cat-tab' + (n === c ? ' active' : '') + '" data-action="set-course-count" data-n="' + c + '">' + c + ' courses</button>';
  });
  html += '</div></div>';

  var seatingForCourses = state.seating || {};
  html += '<div class="card"><h2>Assign each dish to a course</h2>';
  if (!selected.length){
    html += '<p class="muted small">No dishes picked yet — go back and pick some first.</p>';
  }
  selected.forEach(function(id){
    var it = ITEM[id];
    if (!it) return;
    var cur = assign[id];
    var seatTag = seatingForCourses[id];
    var seatLabel = seatTag ? (seatTag === 'shared' ? 'Shared' : 'Seat ' + seatTag) : '';
    html += '<div style="margin-bottom:12px;">' +
      '<p class="small" style="margin:0 0 5px;">' + catPill(it.cat) + ' <strong>' + esc(it.name) + '</strong>' +
      (seatLabel ? ' <span class="muted">(' + esc(seatLabel) + ')</span>' : '') + '</p>' +
      '<div class="cat-tabs" style="margin:0 0 4px;padding:0;">';
    for (var c = 1; c <= n; c++){
      html += '<button class="cat-tab' + (cur === c ? ' active' : '') + '" data-action="assign-course" data-id="' + id + '" data-n="' + c + '">Course ' + c + '</button>';
    }
    html += '</div></div>';
  });
  html += '</div>';

  html += '<div class="tray"><div class="btn-row"><button class="btn" data-action="continue-to-beverage-pairings" ' +
    (selected.length === 0 ? 'disabled' : '') + '>Continue to beverage pairings &rarr;</button></div></div>';

  return html;
}

// ---------------------------------------------------------------------
// View: Pair a beverage with each course — the sommelier-style "what goes
// with this course" suggestion for the table, now its own step after the
// courses are built. Separate on purpose from the per-seat beverage
// ORDER (see viewDinnerSeatBeverages, which now runs much earlier in the
// flow, right after picking the scenario) — this is a food pairing for
// the table, that's each individual guest's actual drink order.
// ---------------------------------------------------------------------
function viewDinnerCoursePairings(){
  var sc = SCENARIOS.filter(function(s){ return s.id === state.scenarioId; })[0];
  var selected = state.selected || [];
  var n = state.courseCount || 3;
  var assign = state.courseAssign || {};
  var pairings = state.beveragePairings || {};

  var html = topbar('Pair Beverages with Courses', null);
  html += '<div class="card">' +
    '<h2>' + esc(sc.title) + '</h2>' +
    '<p class="small">Optional per course, but a dinner that never once offers a pairing leaves both money and a chance to show off the bar program on the table.</p>' +
    '<div class="btn-row"><button class="btn secondary" data-action="back-to-dinner-courses">&larr; Edit courses</button></div>' +
    '</div>';

  for (var course = 1; course <= n; course++){
    var dishNames = selected.filter(function(id){ return assign[id] === course; })
      .map(function(id){ return ITEM[id] ? ITEM[id].name : null; }).filter(Boolean);
    var pairing = pairings[course];
    var paired = pairing ? BEVERAGE[pairing.id] : null;
    html += '<div class="card">' +
      '<p class="small" style="margin:0 0 4px;"><strong>Course ' + course + '</strong>' +
      (dishNames.length ? ' — ' + esc(dishNames.join(', ')) : ' — <span class="muted">no dishes assigned yet</span>') + '</p>';
    if (paired){
      var isBottle = paired.size === 'bottle';
      html += '<p class="small" style="margin:8px 0;">' + bevCatPill(paired.cat) + bevSizeTag(paired) + ' <strong>' + esc(paired.name) + '</strong> — ' + esc(paired.price) +
        '<br><span class="muted">' + esc(paired.desc) + '</span></p>';
      if (sc.seats > 1 && !isBottle){
        html += '<p class="small" style="margin:10px 0 4px;"><strong>Who is this for?</strong></p><div class="cat-tabs">' +
          '<button class="cat-tab' + (pairing.seat === 'shared' ? ' active' : '') + '" data-action="set-bev-seat" data-n="' + course + '" data-seat="shared">Shared for the table</button>';
        for (var bs = 1; bs <= sc.seats; bs++){
          html += '<button class="cat-tab' + (pairing.seat === bs ? ' active' : '') + '" data-action="set-bev-seat" data-n="' + course + '" data-seat="' + bs + '">Seat ' + bs + '</button>';
        }
        html += '</div>';
        if (!pairing.seat) html += '<p class="small muted" style="margin:4px 0 0;">Not yet chosen.</p>';
      }
      if (isBottle){
        html += '<p class="small muted" style="margin:8px 0 0;">Bottles are shared for the table, not poured to one seat.</p>';
      }
      if (isBottle || pairing.seat === 'shared' || sc.seats <= 1){
        html += '<p class="small" style="margin:10px 0 2px;"><strong>Glasses needed:</strong></p>' +
          '<input type="number" min="1" id="glasses-course-' + course + '" value="' + (pairing.glasses != null ? pairing.glasses : '') +
          '" placeholder="e.g. ' + sc.seats + '" style="width:80px;">';
      }
      html += '<div class="btn-row" style="margin-top:10px;">' +
        '<button class="btn secondary" data-action="toggle-bev-picker" data-n="' + course + '">' + (state.activeBevCourse === course ? 'Close' : 'Change') + '</button>' +
        '<button class="btn ghost" data-action="clear-beverage" data-n="' + course + '">Remove</button>' +
        '</div>';
    } else {
      html += '<div class="btn-row"><button class="btn secondary" data-action="toggle-bev-picker" data-n="' + course + '">' +
        (state.activeBevCourse === course ? 'Close' : '+ Add a pairing') + '</button></div>';
    }
    if (state.activeBevCourse === course) html += renderBeveragePicker();
    html += '</div>';
  }

  html += '<div class="tray"><div class="btn-row"><button class="btn" data-action="continue-to-review" ' +
    (selected.length === 0 ? 'disabled' : '') + '>Continue to review &rarr;</button></div></div>';

  return html;
}

// ---------------------------------------------------------------------
// View: Beverage order for each seat — what each individual guest is
// actually drinking (could be several drinks over the course of the
// meal, or none). Runs first, right after picking the scenario, before
// any food is chosen — it only needs the scenario's seat count, not the
// dish-to-seat assignments from Seating & Modifications. Separate on
// purpose from the by-course pairing (see viewDinnerCoursePairings): that
// is a food-pairing suggestion for the table, this is each guest's own
// order. See scoreSeatBeverages for why this is scored on completeness
// (every seat asked) plus safety (nothing unsafe poured for a restricted
// seat) — never on which beverage was picked otherwise.
// ---------------------------------------------------------------------
function viewDinnerSeatBeverages(){
  var sc = SCENARIOS.filter(function(s){ return s.id === state.scenarioId; })[0];

  var html = topbar('', 'dinnerScenario');
  html += '<div class="card">' +
    '<h2>' + esc(sc.title) + '</h2>' +
    '<p class="small"><strong>Party:</strong> ' + esc(sc.party) + ' &middot; <strong>Occasion:</strong> ' + esc(sc.occasion) + '</p>' +
    '<p class="small">' + esc(sc.notes) + '</p>' +
    allergySeatNotice(sc) +
    '</div>';

  var seatBevs = state.seatBeverages || {};
  var seatNoBev = state.seatNoBeverage || {};
  var bevAllergySeats = state.allergySeats || [];
  html += '<div class="card"><h2>Beverage order for each seat</h2>' +
    '<p class="muted small">Start here — what is each guest drinking tonight? More than one drink over the meal is fine; ' +
    'mark &ldquo;No drink&rdquo; if a seat doesn&rsquo;t want anything. You&rsquo;ll pick the food next.</p></div>';
  for (var seat = 1; seat <= sc.seats; seat++){
    var orders = seatBevs[seat] || [];
    var declined = !!seatNoBev[seat];
    var seatRestricted = !!sc.restriction && bevAllergySeats.indexOf(seat) !== -1;
    html += '<div class="card"><p class="small" style="margin:0 0 4px;"><strong>Seat ' + seat + '</strong></p>';
    if (seatRestricted){
      html += '<p class="small" style="margin:0 0 6px;color:#9a3b12;">&#9888; This seat has a ' + esc(restrictionLabel(sc.restriction)) +
        ' restriction — make sure anything poured here is safe.</p>';
    }
    if (declined){
      html += '<p class="small muted">Marked as no drink.</p>';
    } else if (orders.length){
      orders.forEach(function(bevId, oi){
        var b = BEVERAGE[bevId];
        if (!b) return;
        var flagged = seatRestricted && violatesRestriction(b, sc.restriction);
        html += '<p class="small" style="margin:2px 0;' + (flagged ? 'color:#9a3b12;' : '') + '">' + bevCatPill(b.cat) + bevSizeTag(b) + ' ' + esc(b.name) + ' — ' + esc(b.price) +
          (flagged ? ' &#9888; ' + esc(beverageViolationReason(sc.restriction)) : '') +
          ' <button class="btn ghost" data-action="remove-seat-bev" data-seat="' + seat + '" data-idx="' + oi + '" style="padding:1px 8px;">Remove</button></p>';
      });
    } else {
      html += '<p class="small muted">Nothing ordered yet.</p>';
    }
    html += '<div class="btn-row">' +
      '<button class="btn secondary" data-action="toggle-seat-bev-picker" data-seat="' + seat + '">' +
      (state.activeSeatBevPicker === seat ? 'Close' : '+ Add a drink') + '</button>';
    if (!orders.length){
      html += '<button class="btn ghost" data-action="toggle-seat-no-bev" data-seat="' + seat + '">' +
        (declined ? 'Undo &mdash; they do want something' : 'No drink for this seat') + '</button>';
    }
    html += '</div>';
    if (state.activeSeatBevPicker === seat) html += renderSeatBeveragePicker(seat);
    html += '</div>';
  }

  html += '<div class="tray"><div class="btn-row"><button class="btn" data-action="continue-to-food-select">Continue to food selection &rarr;</button></div></div>';

  return html;
}
function renderSeatBeveragePicker(seat){
  var activeCat = state.seatBevActiveCat || '';
  var html = '<div style="margin-top:10px;border-top:2px dashed var(--line);padding-top:10px;">';
  html += '<div class="cat-tabs">';
  html += '<button class="cat-tab' + (activeCat === 'all' ? ' active' : '') + '" data-action="seat-bev-filter-cat" data-cat="all">All</button>';
  BEVERAGE_CATEGORIES.forEach(function(c){
    html += '<button class="cat-tab' + (activeCat === c.key ? ' active' : '') + '" data-action="seat-bev-filter-cat" data-cat="' + c.key + '">' + esc(c.name) + '</button>';
  });
  html += '</div>';
  if (!activeCat){
    html += '<p class="muted small" style="margin:8px 0 2px;">Pick a category above to see options.</p></div>';
    return html;
  }
  var shown = activeCat === 'all' ? BEVERAGES : BEVERAGES.filter(function(b){ return b.cat === activeCat; });
  html += '<div class="item-grid">';
  shown.forEach(function(b){
    html += '<div class="item-card" data-action="pick-seat-beverage" data-seat="' + seat + '" data-id="' + b.id + '">' +
      '<span class="iprice">' + esc(b.price) + '</span>' +
      bevCatPill(b.cat) + bevSizeTag(b) +
      '<div class="iname">' + esc(b.name) + '</div>' +
      '<div class="idesc">' + esc(b.desc) + '</div>' +
      '</div>';
  });
  html += '</div></div>';
  return html;
}
function renderBeveragePicker(){
  // No default category — the full program is 84 items, so dropping
  // straight into "All" would hand staff a huge single-column scroll on a
  // phone before they've even picked a style. Starting with nothing shown
  // forces a deliberate tap first ("All" is still right there if someone
  // really does want to browse the whole list).
  var activeCat = state.bevActiveCat || '';
  var html = '<div style="margin-top:10px;border-top:2px dashed var(--line);padding-top:10px;">';
  html += '<div class="cat-tabs">';
  html += '<button class="cat-tab' + (activeCat === 'all' ? ' active' : '') + '" data-action="bev-filter-cat" data-cat="all">All</button>';
  BEVERAGE_CATEGORIES.forEach(function(c){
    html += '<button class="cat-tab' + (activeCat === c.key ? ' active' : '') + '" data-action="bev-filter-cat" data-cat="' + c.key + '">' + esc(c.name) + '</button>';
  });
  html += '</div>';
  if (!activeCat){
    html += '<p class="muted small" style="margin:8px 0 2px;">Pick a category above to see options.</p></div>';
    return html;
  }
  var shown = activeCat === 'all' ? BEVERAGES : BEVERAGES.filter(function(b){ return b.cat === activeCat; });
  html += '<div class="item-grid">';
  shown.forEach(function(b){
    html += '<div class="item-card" data-action="pick-beverage" data-id="' + b.id + '">' +
      '<span class="iprice">' + esc(b.price) + '</span>' +
      bevCatPill(b.cat) + bevSizeTag(b) +
      '<div class="iname">' + esc(b.name) + '</div>' +
      '<div class="idesc">' + esc(b.desc) + '</div>' +
      '</div>';
  });
  html += '</div></div>';
  return html;
}

// ---------------------------------------------------------------------
// View: Dinner result
// ---------------------------------------------------------------------
function viewDinnerResult(){
  var sc = SCENARIOS.filter(function(s){ return s.id === state.scenarioId; })[0];
  var selected = state.selected || [];
  var r = scoreDinner(sc, selected, state.dishMods || {}, state.seating || {}, state.allergySeats || [], state.groupQty || {});
  var courseAssign = state.courseAssign || {};
  var beveragePairings = state.beveragePairings || {};
  var cr = scoreCourses(state.courseCount, selected, courseAssign, beveragePairings, sc.seats);
  var seatBeverages = state.seatBeverages || {};
  var seatNoBeverage = state.seatNoBeverage || {};
  var sr = scoreSeatBeverages(sc, seatBeverages, seatNoBeverage, state.allergySeats || []);
  var identity = getIdentity();

  if (r.score >= 70) burstConfetti({ count: r.score >= 90 ? 90 : 55, duration: 1700 });
  var dinnerTitle = r.score >= 90 ? '🎉 Nailed It!' : (r.score >= 70 ? '⭐ Great Plate!' : 'Dinner Built');
  var html = topbar(dinnerTitle, null);
  html += '<div class="card" style="text-align:center;">' +
    '<div class="score-circle"><span class="num">' + r.score + '</span><span class="lbl">out of 100</span></div>' +
    '<p class="muted">for <strong>' + esc(sc.title) + '</strong></p></div>';

  html += '<div class="card"><h2>Breakdown</h2><ul class="checklist">';
  var safetyDetail;
  if (r.violations.length){
    safetyDetail = ' — conflicts with the stated restriction: ' + r.violations.map(function(v){
      var mc = r.modChecks.filter(function(m){ return m.item.id === v.id; })[0];
      if (mc){
        var bits = [];
        if (!mc.ingredientOk) bits.push('needed to remove ' + esc(mc.remove.join(', ')) + '; ' + (mc.chosen ? 'removed ' + esc(mc.chosen) + ' instead' : 'no modification chosen'));
        if (mc.ingredientOk && !mc.seatOk) bits.push('removed the right ingredient, but ' + (mc.placedSeat ? 'served it to ' + (mc.placedSeat === 'shared' ? 'the shared table' : 'Seat ' + mc.placedSeat) : 'never assigned it to a seat') + ' instead of the seat that needed it');
        return esc(v.name) + ' (' + bits.join('; ') + ')';
      }
      return esc(v.name);
    }).join('; ');
  } else if (r.modChecks.length){
    safetyDetail = ' — modified correctly: ' + r.modChecks.map(function(m){
      return esc(m.item.name) + ' (removed ' + esc(m.chosen) + (m.seatSpecific ? ', served to Seat ' + m.placedSeat : '') + ')';
    }).join(', ');
  } else {
    safetyDetail = ' — no conflicts with the stated restriction';
  }
  html += '<li class="' + (r.safetyPts > 0 ? 'ok' : 'bad') + '">' + (r.safetyPts > 0 ? '&#10003;' : '&#10007;') +
    ' Safety (' + r.safetyPts + '/30)' + safetyDetail + '</li>';
  if (r.isGroupMenu){
    var coverageText = GROUP_COURSE_KEYS.map(function(k){
      return (r.courseCoverage[k] ? '&#10003; ' : '&#10007; ') + esc(GROUP_COURSE_LABEL[k]);
    }).join(', ');
    html += '<li class="' + (r.selectionPts >= 30 ? 'ok' : 'bad') + '">' + (r.selectionPts >= 30 ? '&#10003;' : '&#10007;') +
      ' Menu selection (' + r.selectionPts + '/40) — ' + r.coveredCourseCount + ' of 4 courses covered (' + coverageText + ')' +
      (r.invalidPicks.length ? '; not on the $' + sc.groupMenuPrice + ' menu: ' +
        r.invalidPicks.map(function(id){ return esc(ITEM[id] ? ITEM[id].name : id); }).join(', ') : '') + '</li>';
    html += '<li class="' + (r.quantityPts >= 15 ? 'ok' : 'bad') + '">' + (r.quantityPts >= 15 ? '&#10003;' : '&#10007;') +
      ' Order quantities (' + r.quantityPts + '/20) — ' + r.qtyCorrectCount + ' of ' + r.validSelected.length +
      ' dishes have the right order count (1 per 4 guests &rarr; ' + r.requiredQty + ' for this party of ' + sc.seats + ')</li>';
  } else {
    html += '<li class="' + (r.completenessPts >= 30 ? 'ok' : 'bad') + '">' +
      (r.completenessPts >= 30 ? '&#10003;' : '&#10007;') + ' Course coverage (' + r.completenessPts + '/40) — ' +
      r.coveredCount + ' menu section' + (r.coveredCount === 1 ? '' : 's') + ' represented (aim for ' + sc.minCourses + '+)</li>';
    html += '<li class="' + (r.budgetPts >= 15 ? 'ok' : 'bad') + '">' + (r.budgetPts >= 15 ? '&#10003;' : '&#10007;') +
      ' Budget fit (' + r.budgetPts + '/20) — est. $' + r.total + ', target $' + sc.minBudget + '&ndash;$' + sc.maxBudget + '</li>';
  }
  if (sc.mustInclude){
    html += '<li class="' + (r.specialOk ? 'ok' : 'bad') + '">' + (r.specialOk ? '&#10003;' : '&#10007;') +
      ' Required dish (' + r.specialPts + '/10) — must include ' + esc(ITEM[sc.mustInclude].name) + '</li>';
  }
  html += '</ul></div>';

  if (cr.courseCount){
    html += '<div class="card" style="text-align:center;">' +
      '<div class="score-circle" style="background:radial-gradient(circle at 32% 28%, var(--accent) 0%, var(--accent-deep) 72%);box-shadow:0 6px 0 var(--accent-deep), 0 12px 22px rgba(0,0,0,.18);">' +
      '<span class="num" style="color:var(--accent-ink);">' + cr.score + '</span><span class="lbl" style="color:var(--accent-ink);">course &amp; pairing</span></div>' +
      '<p class="muted">' + cr.courseCount + '-course build</p></div>';

    html += '<div class="card"><h2>Course &amp; pairing breakdown</h2><ul class="checklist">';
    html += '<li class="' + (cr.assignedCount === cr.totalDishes ? 'ok' : 'bad') + '">' +
      (cr.assignedCount === cr.totalDishes ? '&#10003;' : '&#10007;') + ' Dishes assigned (' + cr.assignPts + '/20) — ' +
      cr.assignedCount + ' of ' + cr.totalDishes + ' dishes placed in a course</li>';
    html += '<li class="' + (cr.usedCount === cr.courseCount ? 'ok' : 'bad') + '">' +
      (cr.usedCount === cr.courseCount ? '&#10003;' : '&#10007;') + ' Courses used (' + cr.usedPts + '/20) — ' +
      cr.usedCount + ' of ' + cr.courseCount + ' courses have at least one dish</li>';
    html += '<li class="' + (cr.pairedCount === cr.courseCount ? 'ok' : 'bad') + '">' + (cr.pairedCount === cr.courseCount ? '&#10003;' : '&#10007;') +
      ' Pairings offered (' + cr.pairingPts + '/25) — ' + cr.pairedCount + ' of ' + cr.courseCount + ' courses paired with a drink</li>';
    html += '<li class="' + (cr.pairedCount && cr.placementCorrect === cr.pairedCount ? 'ok' : 'bad') + '">' +
      (cr.pairedCount && cr.placementCorrect === cr.pairedCount ? '&#10003;' : '&#10007;') + ' Placement (' + cr.placementPts + '/20) — ' +
      (cr.pairedCount ? cr.placementCorrect + ' of ' + cr.pairedCount + ' pairings correctly seated (bottles shared, glasses poured with a count)' : 'no pairings yet') + '</li>';
    html += '<li class="' + (cr.varietyPts === 15 ? 'ok' : 'bad') + '">' + (cr.varietyPts === 15 ? '&#10003;' : '&#10007;') +
      ' Variety (' + cr.varietyPts + '/15) — ' + (cr.pairedCount <= 1 ?
        'not enough pairings yet to judge variety' : cr.distinctCount + ' distinct beverage' + (cr.distinctCount === 1 ? '' : 's') + ' used across paired courses') + '</li>';
    html += '</ul></div>';

    html += '<div class="card"><h2>The courses</h2>';
    for (var c = 1; c <= cr.courseCount; c++){
      var courseItems = selected.filter(function(id){ return courseAssign[id] === c; }).map(function(id){ return ITEM[id]; }).filter(Boolean);
      var pairingR = beveragePairings[c];
      var paired = pairingR ? BEVERAGE[pairingR.id] : null;
      html += '<p class="small" style="margin:10px 0 2px;"><strong>Course ' + c + '</strong></p>';
      if (courseItems.length){
        courseItems.forEach(function(it){
          var seatTag2 = (state.seating || {})[it.id];
          var seatLabel2 = seatTag2 ? (seatTag2 === 'shared' ? 'Shared' : 'Seat ' + seatTag2) : '';
          var qtyTag = r.isGroupMenu && state.groupQty && state.groupQty[it.id] != null ? ' &times;' + state.groupQty[it.id] : '';
          html += '<p class="small" style="margin:2px 0;">' + catPill(it.cat) + ' ' + esc(it.name) + qtyTag + ' — ' + esc(it.price) +
            (seatLabel2 ? ' <span class="muted">(' + esc(seatLabel2) + ')</span>' : '') + '</p>';
        });
      } else {
        html += '<p class="small muted" style="margin:2px 0;">No dishes assigned</p>';
      }
      if (paired){
        var bevSeatLabel = pairingR.seat === 'shared' ? 'Shared' : (typeof pairingR.seat === 'number' ? 'Seat ' + pairingR.seat : '');
        var glassBit = (paired.size === 'bottle' || pairingR.seat === 'shared') && pairingR.glasses != null ? ', ' + pairingR.glasses + ' glass' + (pairingR.glasses === 1 ? '' : 'es') : '';
        html += '<p class="small" style="margin:2px 0;">' + bevCatPill(paired.cat) + bevSizeTag(paired) + ' <strong>' + esc(paired.name) + '</strong> — ' + esc(paired.price) +
          (bevSeatLabel ? ' <span class="muted">(' + esc(bevSeatLabel) + glassBit + ')</span>' : '') + '</p>';
      }
    }
    html += '<p class="muted small">Prices estimated at the lower listed price per item; actual portions/pricing may vary.</p></div>';
  } else {
    html += '<div class="card"><h2>The dinner</h2>';
    selected.forEach(function(id){
      var it = ITEM[id];
      html += '<p class="small">' + catPill(it.cat) + ' <strong>' + esc(it.name) + '</strong> — ' + esc(it.price) + '</p>';
    });
    html += '<p class="muted small">Prices estimated at the lower listed price per item; actual portions/pricing may vary.</p></div>';
  }

  if (sc.seats){
    html += '<div class="card" style="text-align:center;">' +
      '<div class="score-circle" style="background:radial-gradient(circle at 32% 28%, #5c3a6e 0%, #3a2447 72%);box-shadow:0 6px 0 #3a2447, 0 12px 22px rgba(0,0,0,.18);">' +
      '<span class="num" style="color:#f6ecdf;">' + sr.score + '</span><span class="lbl" style="color:#f6ecdf;">beverage order</span></div>' +
      '<p class="muted">' + sr.handledCount + ' of ' + sr.seats + ' seats asked' +
      (sr.violations.length ? ' &middot; ' + sr.violations.length + ' unsafe pour' + (sr.violations.length === 1 ? '' : 's') : '') + '</p></div>';

    html += '<div class="card"><h2>What each seat is drinking</h2>';
    if (sr.unhandledSeats.length){
      html += '<p class="small" style="margin:0 0 8px;"><strong>&#9888; Not asked yet:</strong> Seat' + (sr.unhandledSeats.length === 1 ? '' : 's') + ' ' + sr.unhandledSeats.join(', ') + '</p>';
    }
    if (sr.violations.length){
      html += '<p class="small" style="margin:0 0 8px;color:#9a3b12;"><strong>&#9888; Unsafe for the restriction on file:</strong> ' +
        sr.violations.map(function(v){ return 'Seat ' + v.seat + ' (' + esc(v.bev.name) + ')'; }).join(', ') + '</p>';
    }
    for (var sb = 1; sb <= sc.seats; sb++){
      var orders2 = seatBeverages[sb] || [];
      var declined2 = !!seatNoBeverage[sb];
      var seatRestricted2 = !!sc.restriction && (state.allergySeats || []).indexOf(sb) !== -1;
      html += '<p class="small" style="margin:4px 0;"><strong>Seat ' + sb + ':</strong> ';
      if (declined2){
        html += 'no drink';
      } else if (orders2.length){
        html += orders2.map(function(bid){
          var b = BEVERAGE[bid];
          if (!b) return '';
          var flagged2 = seatRestricted2 && violatesRestriction(b, sc.restriction);
          return flagged2 ? '<span style="color:#9a3b12;">' + esc(b.name) + ' &#9888;</span>' : esc(b.name);
        }).filter(Boolean).join(', ');
      } else {
        html += '<span class="muted">not asked</span>';
      }
      html += '</p>';
    }
    html += '</div>';
  }

  html += '<div class="card"><h2>Pitch it</h2>' +
    '<p class="small">In a sentence or two, how would you explain this dinner to the guest?</p>' +
    '<textarea id="justification" placeholder="e.g. We started light with...">' + esc(state.justification || '') + '</textarea>' +
    '<div class="btn-row"><button class="btn" data-action="finish-dinner">Done &mdash; show send options</button></div></div>';

  if (state.finished){
    var just = (document.getElementById('justification') || {}).value || state.justification || '';
    var summary = dinnerSummaryText(sc, selected, r, just, identity.name, false, cr, courseAssign, beveragePairings, sr, seatBeverages, seatNoBeverage);
    html += sendRow(summary, 'Folietta dinner build — ' + identity.name, 'folietta-dinner-' + sc.id);
    html += '<div class="btn-row"><button class="btn secondary" data-action="go" data-view="home">Back to home</button></div>';
  }

  return html;
}
