// ---------------------------------------------------------------------
// View: Quiz play
// ---------------------------------------------------------------------
function viewQuizPlay(){
  var qs = state.questions;
  var idx = state.qIndex || 0;
  var q = qs[idx];
  var pct = Math.round((idx / qs.length) * 100);

  var html = topbar('', 'home', streakBadge(state.streak));
  html += '<div class="progress"><div style="width:' + pct + '%"></div></div>';
  html += '<p class="muted small">Question ' + (idx + 1) + ' of ' + qs.length + '</p>';

  var answered = state.answeredThis;

  if (q.kind === 'mc'){
    html += '<div class="card"><p style="font-size:15px;font-weight:700;">' + esc(q.prompt) + '</p>';
    html += '<div class="q-options">';
    q.options.forEach(function(opt){
      var cls = 'q-opt';
      if (answered){
        if (opt === q.correctAnswer) cls += ' correct';
        else if (opt === state.lastPicked) cls += ' incorrect';
      }
      html += '<button class="' + cls + '" data-action="answer-mc" data-opt="' + esc(opt) + '" ' + (answered ? 'disabled' : '') + '>' + esc(opt) + '</button>';
    });
    html += '</div>';
    if (answered){
      var wasRight = state.lastPicked === q.correctAnswer;
      html += '<p class="q-feedback ' + (wasRight ? 'good' : 'bad') + '">' +
        (wasRight ? '&#127881; Nice one!' : '&#128064; Good try &mdash; keep going!') + '</p>';
      html += '<div class="btn-row"><button class="btn" data-action="next-question">Next &rarr;</button></div>';
    }
    html += '</div>';
  } else if (q.kind === 'type'){
    html += '<div class="card"><p style="font-size:15px;font-weight:700;">' + esc(q.prompt) + '</p>';
    if (!answered){
      html += '<input type="text" id="type-answer" placeholder="e.g. gluten, dairy, egg">';
      html += '<div class="btn-row"><button class="btn" data-action="answer-type">Check answer</button></div>';
    } else {
      var correctList = Object.keys(q.correctSet).map(function(a){ return ALLERGEN_LABEL[a]; });
      html += '<p class="small muted">You typed: <em>' + esc(state.lastTyped || '(blank)') + '</em></p>';
      html += '<p class="q-feedback ' + (state.lastCorrect ? 'good' : 'bad') + '">' +
        (state.lastCorrect ? '&#127881; Nice one!' : '&#128064; Not quite.') + '</p>';
      html += '<p class="small">Correct answer: ' + (correctList.length ? esc(correctList.join(', ')) : 'None of the 7 major allergens.') + '</p>';
      html += '<div class="btn-row"><button class="btn" data-action="next-question">Next &rarr;</button></div>';
    }
    html += '</div>';
  } else if (q.kind === 'flashcard'){
    var it = ITEM[q.itemId];
    html += '<div class="flip-scene"><div class="flashcard' + (state.revealed ? ' flipped' : '') + '">' +
      '<div class="fc-face fc-front"><div class="fc-name">' + esc(it.name) + '</div><div class="fc-price">' + esc(it.price) + '</div>' +
      '<p class="muted small">Try to recite the drop line out loud, then flip the card.</p>' +
      '<div class="btn-row" style="justify-content:center;"><button class="btn gold" data-action="reveal-flashcard">&#128260; Flip card</button></div></div>' +
      '<div class="fc-face fc-back"><div class="fc-name">' + esc(it.name) + '</div>' +
      '<div class="fc-line">&ldquo;' + esc(it.drop) + '&rdquo;</div>' +
      '<div class="btn-row" style="justify-content:center;margin-top:16px;">' +
      '<button class="btn" data-action="flashcard-grade" data-got="1">&#9989; Got it</button>' +
      '<button class="btn secondary" data-action="flashcard-grade" data-got="0">Missed it</button></div></div>' +
      '</div></div>';
  }

  return html;
}

// ---------------------------------------------------------------------
// View: Quiz result
// ---------------------------------------------------------------------
function viewQuizResult(){
  var answers = state.answers || [];
  var identity = getIdentity();
  var graded = answers.filter(function(a){ return a.kind !== 'flashcard'; });
  var correctCount = graded.filter(function(a){ return a.correct; }).length;
  var flashcards = answers.filter(function(a){ return a.kind === 'flashcard'; });
  var fcGot = flashcards.filter(function(a){ return a.gotIt; }).length;
  var pct = graded.length ? Math.round((correctCount / graded.length) * 100) : 0;

  if (pct >= 70) burstConfetti({ count: pct >= 90 ? 90 : 55, duration: 1700 });
  var quizTitle = pct >= 90 ? '🏆 Crushed It!' : (pct >= 70 ? '🎉 Nice Work!' : 'Quiz Complete');
  var html = topbar(quizTitle, null);
  html += '<div class="card" style="text-align:center;"><div class="score-circle"><span class="num">' + pct + '%</span><span class="lbl">score</span></div>' +
    '<p class="muted">' + correctCount + ' of ' + graded.length + ' graded questions correct' +
    (flashcards.length ? ', plus ' + fcGot + '/' + flashcards.length + ' drop lines self-marked' : '') + '</p></div>';

  html += '<div class="card"><h2>Review</h2>';
  answers.forEach(function(a){
    if (a.kind === 'flashcard'){
      var it = ITEM[a.itemId];
      html += '<p class="small">' + (a.gotIt ? '&#10003;' : '&#9711;') + ' <strong>' + esc(it.name) + '</strong> drop line — ' +
        (a.gotIt ? 'self-marked correct' : 'self-marked missed') + '</p>';
    } else {
      html += '<p class="small" style="color:' + (a.correct ? 'var(--success)' : 'var(--danger)') + '">' +
        (a.correct ? '&#10003;' : '&#10007;') + ' ' + esc(a.prompt) + '<br><span class="muted">Your answer: ' + esc(a.yourAnswer) +
        (a.correct ? '' : ' &mdash; correct: ' + esc(a.correctAnswerText)) + '</span></p>';
    }
  });
  html += '</div>';

  if (!state.recorded){
    pushHistory({ gameType: 'quiz', quizScore: correctCount, quizTotal: graded.length, completedAt: new Date().toISOString() });
    state.recorded = true;
  }

  var summary = quizSummaryText(answers, identity.name);
  html += sendRow(summary, 'Folietta quiz — ' + identity.name, 'folietta-quiz');
  html += '<div class="btn-row"><button class="btn secondary" data-action="go" data-view="home">Back to home</button></div>';
  return html;
}

// ---------------------------------------------------------------------
// View: Run the Floor — table/seat numbers + kitchen-to-table routing
// ---------------------------------------------------------------------
function tableLabel(t){ return t.isCounter ? t.label : ('Table ' + t.id); }

function floorSummaryText(rounds, playerName, avg){
  var lines = [];
  lines.push('FOLIETTA — Run the Floor');
  lines.push('Player: ' + playerName);
  lines.push('Average score: ' + avg + '% across ' + rounds.length + ' deliveries');
  lines.push('');
  rounds.forEach(function(x, i){
    lines.push((i + 1) + '. ' + tableLabel(x.table) + ' — ' + x.roundScore + '% (there ' + x.routeScore +
      '%, back ' + x.returnScore + '%, plating ' + x.placementCorrect + '/' + x.placementTotal + ')');
  });
  lines.push('');
  lines.push('Completed: ' + new Date().toLocaleString());
  return lines.join('\n');
}

// ---- Floor-plan renderer — a single static blueprint of the whole
// restaurant, drawn once at its true scale (no camera, no per-room panels).
// Thin outlines, table/counter shapes in their real position, table numbers
// hidden while a forward leg is still live so staff have to recognise the
// table rather than read it off. The server's position is just a dot the
// X/Y sliders push around; floorPointBlocked() (above) is built from this
// exact same geometry, so a wall or table drawn here is a wall or table the
// sliders really can't drag the dot through.
function svgZoneShape(z){
  var x0 = z.x - z.w / 2, y0 = z.y - z.h / 2;
  return '<rect class="bp-zone bp-zone-' + z.kind + '" x="' + x0 + '" y="' + y0 + '" width="' + z.w + '" height="' + z.h + '" rx="1"></rect>';
}
function svgZoneLabel(z){
  if (z.key === 'bar-top' || z.key === 'bar-return') return ''; // one "Bar" label on the whole counter is enough — drawn on the 'bar' zone
  // The 60s/50s/40s/30s table columns pack every row edge-to-edge with no
  // gap anywhere in the column, so a "Tables NN–NN" heading always lands on
  // top of a table no matter where it's placed (see _zone_label_y in
  // data.py, which already hunts for the single least-cramped spot and
  // still can't find a clean one here). Simplest real fix: no heading at
  // all — a server finds a specific table by its own number on arrival,
  // not by which section it's in.
  if (z.key === 'd61' || z.key === 'd51' || z.key === 'd41' || z.key === 'd30') return '';
  var lx = (typeof z.labelX === 'number') ? z.labelX : z.x;
  var ly = (typeof z.labelY === 'number') ? z.labelY : (z.y - z.h / 2 + 3);
  return '<text class="bp-zone-label" x="' + lx + '" y="' + ly + '" text-anchor="middle">' + esc(z.name) + '</text>';
}
function svgTableShape(t, hideNum, isTarget){
  var fourTop = t.seats.length >= 4;
  var label = hideNum ? '•' : esc(t.id);
  var cls = 'bp-table' + (isTarget ? ' bp-table-target' : '');
  // Tables 61-64 are booth seating in the real room, not a round 4-top —
  // square, same footprint (5.4x5.4) as a plain fourTop's own collision box
  // in FLOOR_OBSTACLES above, so this is purely a rendering change.
  var shape = t.booth
    ? '<rect class="' + cls + ' bp-table-booth" x="' + (t.x - 2.7) + '" y="' + (t.y - 2.7) + '" width="5.4" height="5.4" rx="0.8"></rect>'
    : (fourTop
      ? '<circle class="' + cls + '" cx="' + t.x + '" cy="' + t.y + '" r="2.7"></circle>'
      : '<rect class="' + cls + '" x="' + (t.x - 2.7) + '" y="' + (t.y - 1.8) + '" width="5.4" height="3.6" rx="0.6"></rect>');
  return shape + '<text class="bp-table-label" x="' + t.x + '" y="' + (t.y + 0.9) + '" text-anchor="middle">' + label + '</text>';
}
// Most counters are wider than deep (bar-top, chef's-bar, server-counter)
// and draw as a horizontal slab with stools in a row below it. The 'bar'
// zone is the vertical leg of the real L-shaped bar (see data.py) — taller
// than it is wide — so it needs the whole thing turned 90°: a slab running
// the full height on one side, and stools running down the other side, one
// per seat along the counter's real length, instead of every stool packed
// into a sliver at the bottom. z.flip puts the slab on the far side of the
// stools instead of the near side — see data.py's 'bar' entry for why.
// Keep this in sync by hand with the matching obstacle shape in
// FLOOR_OBSTACLES above — the solid slab drawn here is exactly what the
// sliders can't drag the character through, so the two must always agree.
function svgCounterShape(z, seatCount){
  var x0 = z.x - z.w / 2, y0 = z.y - z.h / 2;
  var vertical = z.h > z.w;
  var parts;
  if (vertical){
    var barX0 = z.flip ? x0 + z.w * 0.5 : x0 + z.w * 0.08, barW = z.w * 0.42;
    parts = '<rect class="bp-counter" x="' + barX0 + '" y="' + y0 + '" width="' + barW + '" height="' + z.h + '"></rect>';
    parts += '<rect class="bp-counter-top" x="' + (barX0 + 0.3) + '" y="' + (y0 + 0.3) + '" width="' + (barW - 0.6) + '" height="' + (z.h - 0.6) + '"></rect>';
    var padV = z.h * 0.08, usableV = z.h - padV * 2;
    var seatX = z.flip ? x0 + z.w * 0.26 : x0 + z.w * 0.74;
    for (var j = 0; j < seatCount; j++){
      var sy = y0 + padV + (seatCount <= 1 ? usableV / 2 : usableV * (j / (seatCount - 1)));
      parts += '<circle class="bp-stool" cx="' + seatX + '" cy="' + sy + '" r="0.85"></circle>';
    }
  } else {
    var barY0 = z.flip ? y0 + z.h * 0.5 : y0 + z.h * 0.08, barH = z.h * 0.42;
    parts = '<rect class="bp-counter" x="' + x0 + '" y="' + barY0 + '" width="' + z.w + '" height="' + barH + '"></rect>';
    // A thin brass inset line along the counter's own top edge — a nod to
    // the real bar's brass-trimmed marble top, not just a flat wood slab.
    parts += '<rect class="bp-counter-top" x="' + (x0 + 0.3) + '" y="' + (barY0 + 0.3) + '" width="' + (z.w - 0.6) + '" height="' + (barH - 0.6) + '"></rect>';
    var pad = z.w * 0.08, usable = z.w - pad * 2;
    var seatY = z.flip ? y0 + z.h * 0.26 : y0 + z.h * 0.74;
    for (var i = 0; i < seatCount; i++){
      var sx = x0 + pad + (seatCount <= 1 ? usable / 2 : usable * (i / (seatCount - 1)));
      parts += '<circle class="bp-stool" cx="' + sx + '" cy="' + seatY + '" r="0.85"></circle>';
    }
  }
  return parts;
}
// Seat counts per counter zone — the real bar's 14 seats split across its
// two segments (5 along the front wall, 9 down the side); the server
// counter is a staff station, not guest seating, so it gets none.
var COUNTER_SEAT_COUNTS = { 'bar-top': 5, 'bar': 9, 'chefs-bar': CHEFS_BAR_SEATS.length, 'server-counter': 0 };
function svgZoneFixture(z){
  if (z.kind === 'dining' || z.kind === 'patio') return '';
  if (z.kind === 'counter') return svgCounterShape(z, COUNTER_SEAT_COUNTS[z.key] || 0);
  if (z.kind === 'kitchen'){
    var x0 = z.x - z.w / 2, y0 = z.y - z.h / 2;
    return '<rect class="bp-pass-edge" x="' + x0 + '" y="' + y0 + '" width="' + z.w + '" height="1.8"></rect>';
  }
  if (z.kind === 'podium') return '<rect class="bp-podium" x="' + (z.x - 3.8) + '" y="' + (z.y - 2.9) + '" width="7.6" height="5.8" rx="0.6"></rect>';
  if (z.kind === 'door') return '<rect class="bp-door" x="' + (z.x - z.w / 2) + '" y="' + (z.y - z.h / 2) + '" width="' + z.w + '" height="' + z.h + '" rx="0.6"></rect>';
  return '';
}
// A "dynamic glass window" onto the real-proportioned floor plan: the
// visible viewBox is a fixed-size CAMERA_W x CAMERA_H crop that follows
// the character, Among-Us style, instead of showing the whole (taller
// than wide) building shrunk to fit. By default the crop is also capped
// so the patio and the lounge — off to the east and north respectively —
// stay off-screen; the cap relaxes smoothly as the character actually
// walks toward either one, revealing it rather than showing it from the
// start. North/south and the washrooms side use plain centred clamping.
//
// The reveal caps used to be hard limits, which could pin the character
// right up against the edge of the frame for a while (e.g. anywhere in
// the bar/lounge before LOUNGE_UNLOCK_Y, the window was pushed as far
// down as topCap allowed, however far that was from true centre). Now
// each cap only gets to push the window away from dead-centre by up to
// REVEAL_PUSH_X/Y, so the character stays within a steady band around the
// middle of the screen at all times — the floor plan still slides to
// reveal more of wherever they're headed, there's just a ceiling on how
// far off-centre that reveal is allowed to shove them.
var CAMERA_W = 60, CAMERA_H = 72;
var PATIO_UNLOCK_X = 70, PATIO_HIDE_EDGE = 73;
var LOUNGE_UNLOCK_Y = 58, LOUNGE_HIDE_EDGE = 50;
var REVEAL_PUSH_X = CAMERA_W * 0.27, REVEAL_PUSH_Y = CAMERA_H * 0.25;
function lerp(a, b, t){ return a + (b - a) * Math.max(0, Math.min(1, t)); }
function floorCamera(charX, charY){
  var camX0 = charX - CAMERA_W / 2;
  var camY0 = charY - CAMERA_H / 2;
  var rightCap = charX <= PATIO_UNLOCK_X ? PATIO_HIDE_EDGE
    : lerp(PATIO_HIDE_EDGE, WORLD_W, (charX - PATIO_UNLOCK_X) / (WORLD_W - PATIO_UNLOCK_X));
  var camXCapped = Math.min(camX0, Math.max(0, rightCap - CAMERA_W));
  var camX = Math.max(camXCapped, camX0 - REVEAL_PUSH_X);
  camX = Math.max(0, Math.min(WORLD_W - CAMERA_W, camX));
  var topCap = charY >= LOUNGE_UNLOCK_Y ? LOUNGE_HIDE_EDGE
    : lerp(LOUNGE_HIDE_EDGE, 0, (LOUNGE_UNLOCK_Y - charY) / LOUNGE_UNLOCK_Y);
  var camYCapped = Math.max(camY0, topCap);
  var camY = Math.min(camYCapped, camY0 + REVEAL_PUSH_Y);
  camY = Math.max(0, Math.min(WORLD_H - CAMERA_H, camY));
  return [Math.round(camX * 10) / 10, Math.round(camY * 10) / 10];
}
// The real building isn't a plain rectangle — the lounge/bar sits in a
// narrower upper section (see FLOOR_WALLS's "notch" in data.py), so the
// outline is a traced path, not a <rect>, with that corner cut away.
var FLOOR_NOTCH = (function(){
  for (var i = 0; i < FLOOR_WALLS.length; i++){ if (FLOOR_WALLS[i].key === 'notch') return FLOOR_WALLS[i]; }
  return null;
})();
function svgBuildingOutline(){
  if (!FLOOR_NOTCH) return '<rect class="bp-building" x="1" y="1" width="' + (WORLD_W - 2) + '" height="' + (WORLD_H - 2) + '" rx="2"></rect>';
  var nx = FLOOR_NOTCH.x1, ny = FLOOR_NOTCH.y1;
  var d = 'M ' + nx + ' 1 L ' + (WORLD_W - 1) + ' 1 L ' + (WORLD_W - 1) + ' ' + (WORLD_H - 1) +
    ' L 1 ' + (WORLD_H - 1) + ' L 1 ' + ny + ' L ' + nx + ' ' + ny + ' Z';
  return '<path class="bp-building" d="' + d + '"></path>';
}
// Load-bearing walls (east divider with its three real door gaps) drawn
// as solid dark-wood bars — distinct from the thin cream zone outlines,
// so it actually reads as something the character can't just stroll
// through, door gaps included.
function svgWallShape(w){
  return '<rect class="bp-wall" x="' + w.x0 + '" y="' + w.y0 + '" width="' + (w.x1 - w.x0) + '" height="' + (w.y1 - w.y0) + '"></rect>';
}
// A small illustrated Folietta server — mustache, dark hair, burgundy vest
// with gold buttons — standing in for the plain dot the character used to
// be. Everything is drawn in local coordinates around (0,0) and the whole
// group is positioned with a transform, so moving the character is just
// updating that one transform (see the slider-drag handler below), not
// juggling cx/cy on a shape. Kept deliberately simple (a handful of circles
// and one rounded body shape) since at the map's zoom level — a few dozen
// screen pixels across — anything finer than that just turns to mush.
function svgCharacterIcon(x, y){
  return '<g class="floor-char" id="floor-char-dot" transform="translate(' + x + ',' + y + ')">' +
    '<ellipse class="floor-char-shadow" cx="0" cy="1.95" rx="1.7" ry="0.5"></ellipse>' +
    '<circle class="floor-char-hair" cx="0" cy="-2.5" r="1.05"></circle>' +
    '<rect class="floor-char-body" x="-1.3" y="-0.9" width="2.6" height="2.75" rx="1.1"></rect>' +
    '<circle class="floor-char-button" cx="0" cy="-0.1" r="0.17"></circle>' +
    '<circle class="floor-char-button" cx="0" cy="0.65" r="0.17"></circle>' +
    '<circle class="floor-char-head" cx="0" cy="-1.95" r="1.25"></circle>' +
    '<ellipse class="floor-char-stache" cx="-0.48" cy="-1.55" rx="0.5" ry="0.2" transform="rotate(-18 -0.48 -1.55)"></ellipse>' +
    '<ellipse class="floor-char-stache" cx="0.48" cy="-1.55" rx="0.5" ry="0.2" transform="rotate(18 0.48 -1.55)"></ellipse>' +
  '</g>';
}
function svgFloorBlueprint(hideTableNumbers, targetTable, charX, charY, trailPath){
  var cam = floorCamera(charX, charY);
  var svg = '<svg viewBox="' + cam[0] + ' ' + cam[1] + ' ' + CAMERA_W + ' ' + CAMERA_H + '" class="floor-map-svg" id="floor-map-svg" preserveAspectRatio="xMidYMid meet">';
  svg += svgBuildingOutline();
  FLOOR_ZONES.forEach(function(z){ svg += svgZoneShape(z); });
  FLOOR_ZONES.forEach(function(z){ svg += svgZoneFixture(z); });
  FLOOR_TABLES.forEach(function(t){ svg += svgTableShape(t, hideTableNumbers, !hideTableNumbers && !!(targetTable && targetTable.id === t.id)); });
  FLOOR_WALLS.forEach(function(w){ if (w.key === 'east-wall') svg += svgWallShape(w); });
  var pts = trailPath.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  svg += '<polyline class="floor-trail" id="floor-trail" points="' + pts + '"></polyline>';
  svg += svgCharacterIcon(charX, charY);
  // Zone labels are drawn LAST (on top of tables, the trail and the
  // character) so the name of whatever a server is standing next to or
  // walking through stays legible instead of getting covered by the
  // character icon — easy to happen since labels sit right where a
  // player would naturally park themselves to interact with a counter.
  FLOOR_ZONES.forEach(function(z){ svg += svgZoneLabel(z); });
  svg += '</svg>';
  return svg;
}
// The map (left) plus the two drag sliders — X along the bottom, Y along
// the right — that are the ONLY way the character moves now. Sliders carry
// the live x/y so a fresh render always starts them exactly where the
// character actually is.
function renderFloorStage(x, y, hideNum, targetTable, trailPath){
  var svg = svgFloorBlueprint(hideNum, targetTable, x, y, trailPath);
  return '<div class="floor-stage">' +
    '<div class="floor-map-wrap" id="floor-map-wrap">' + svg + '</div>' +
    '<div class="floor-slider-y-wrap"><input type="range" class="floor-slider" id="floor-slider-y" data-axis="y" ' +
      'min="2" max="' + (WORLD_H - 2) + '" step="0.5" value="' + y + '" aria-label="Move up or down"></div>' +
    '<div class="floor-slider-x-wrap"><input type="range" class="floor-slider" id="floor-slider-x" data-axis="x" ' +
      'min="2" max="' + (WORLD_W - 2) + '" step="0.5" value="' + x + '" aria-label="Move left or right"></div>' +
  '</div>';
}

// ---------------------------------------------------------------------
// Layout Editor — drag-to-reposition view of the whole floor plan (see
// EDITOR_ENABLED above). Shows the full WORLD_W x WORLD_H map at once
// (no camera crop, no character) with every counter and table wrapped in
// a draggable <g>; dragging updates EDIT_STATE's per-item (dx,dy) offset,
// which the export JSON below bakes into new x/y values. Reuses the exact
// same zone/table-shape renderers as the live game, so what's dragged here
// looks exactly like what's actually on the floor.
// ---------------------------------------------------------------------
function svgLayoutEditorBlueprint(){
  var svg = '<svg viewBox="0 0 ' + WORLD_W + ' ' + WORLD_H + '" class="layout-editor-svg" id="layout-editor-svg" preserveAspectRatio="xMidYMid meet">';
  svg += svgBuildingOutline();
  FLOOR_ZONES.forEach(function(z){
    var off = EDIT_STATE.zones[z.key] || { dx: 0, dy: 0 };
    svg += '<g class="edit-draggable" data-editkind="zone" data-editkey="' + esc(z.key) + '" transform="translate(' + off.dx + ',' + off.dy + ')">' +
      svgZoneShape(z) + svgZoneFixture(z) + svgZoneLabel(z) + '</g>';
  });
  FLOOR_TABLES.forEach(function(t){
    var off = EDIT_STATE.tables[t.id] || { dx: 0, dy: 0 };
    svg += '<g class="edit-draggable" data-editkind="table" data-editkey="' + esc(String(t.id)) + '" transform="translate(' + off.dx + ',' + off.dy + ')">' +
      svgTableShape(t, false, false) + '</g>';
  });
  FLOOR_WALLS.forEach(function(w){ if (w.key === 'east-wall') svg += svgWallShape(w); });
  svg += '</svg>';
  return svg;
}
// Only the items actually moved from their data.py position — keeps the
// "Changes" panel and the exported JSON short and easy to read back.
function editLayoutChanges(){
  var zones = [], tables = [];
  FLOOR_ZONES.forEach(function(z){
    var off = EDIT_STATE.zones[z.key];
    if (off && (off.dx || off.dy)){
      zones.push({ key: z.key, name: z.name, x: Math.round((z.x + off.dx) * 10) / 10, y: Math.round((z.y + off.dy) * 10) / 10 });
    }
  });
  FLOOR_TABLES.forEach(function(t){
    var off = EDIT_STATE.tables[t.id];
    if (off && (off.dx || off.dy)){
      tables.push({ id: t.id, x: Math.round((t.x + off.dx) * 10) / 10, y: Math.round((t.y + off.dy) * 10) / 10 });
    }
  });
  return { zones: zones, tables: tables };
}
function editLayoutJSON(){
  var changes = editLayoutChanges();
  var out = { zones: {}, tables: {} };
  changes.zones.forEach(function(z){ out.zones[z.key] = { x: z.x, y: z.y }; });
  changes.tables.forEach(function(t){ out.tables[t.id] = { x: t.x, y: t.y }; });
  return JSON.stringify(out, null, 2);
}
function viewLayoutEditor(){
  var html = topbar('Layout Editor', 'home');
  html += '<div class="card"><h2>Drag things into place</h2>' +
    '<p class="small muted">Admin tool, not part of the staff game. Drag any counter or table on the map below to where it should actually be. ' +
    'When it looks right, copy the layout JSON and send it back so the change can be made exactly — no more guessing from a screenshot.</p></div>';
  html += '<div class="layout-editor-wrap" id="layout-editor-wrap">' + svgLayoutEditorBlueprint() + '</div>';
  var changes = editLayoutChanges();

  html += '<div class="card"><h2>Changes' + (count ? ' (' + count + ')' : '') + '</h2>';
  if (!count){
    html += '<p class="small muted">Nothing moved yet &mdash; drag a counter or table above.</p>';
  } else {
    changes.zones.forEach(function(z){
      html += '<p class="small">' + esc(z.name) + ' <span class="muted">(' + esc(z.key) + ')</span> &rarr; x ' + z.x + ', y ' + z.y + '</p>';
    });
    changes.tables.forEach(function(t){
      html += '<p class="small">Table ' + esc(String(t.id)) + ' &rarr; x ' + t.x + ', y ' + t.y + '</p>';
    });
  }
  var json = editLayoutJSON();
  html += '<div class="btn-row">' +
    '<button class="btn ghost" data-action="copy-layout-json">Copy layout JSON</button>' +
    (downloadsCap ? '<button class="btn ghost" data-action="download-layout-json">Download .json</button>' : '') +
    '<button class="btn ghost" data-action="reset-layout"' + (count ? '' : ' disabled') + '>Reset all</button>' +
    '</div>';
  html += '<textarea class="layout-json-box" id="layout-json-box" readonly rows="6">' + esc(json) + '</textarea>';
  html += '</div>';
  return html;
}

function renderDishTray(r){

function viewFloorSetup(){
  var html = topbar('Run the Floor', 'home');
  html += '<div class="disclaimer">Table/seat numbers and the floor plan are accurate as of today — reconfirm with a manager if the room layout has changed.</div>';
  html += '<div class="card"><h2>How to play</h2><p class="small">Each round drops a ticket with 2&ndash;4 dishes, starting at Hot Pickup. ' +

function floorLegSummaryLine(m, lead, wrongNoun){
  if (!m) return '';
  var bits = [];
  bits.push(Math.round(m.efficiency * 100) + '% direct path');
  bits.push(m.elapsedSec.toFixed(1) + 's');
  bits.push(m.reversals ? m.reversals + ' backtrack' + (m.reversals === 1 ? '' : 's') : 'no backtracking');
  if (m.wrongCount) bits.push(m.wrongCount + ' wrong ' + wrongNoun + (m.wrongCount === 1 ? '' : 's') + ' along the way');
  return '<p class="small">On the way ' + lead + ': ' + bits.join(', ') + '.</p>';
}

  if (si){

    try { si.setSelectionRange(len, len); } catch(e){}
  }
  var pi = document.getElementById('pin-input');
  if (pi){ pi.focus(); }
  // The Y slider is a horizontal <input type=range> rotated on its side —
  // its native track length becomes the map's rendered height, which we
  // only know after layout, so size it here rather than in CSS.
  var ySlider = document.getElementById('floor-slider-y');
  var mapWrap = document.getElementById('floor-map-wrap');
  if (ySlider && mapWrap){ ySlider.style.width = mapWrap.clientHeight + 'px'; }
}
// Drags the character along one axis toward the slider's new value,
// stopping at the nearest wall/table in the way, records a path sample,
// and checks for arrival — all without a full render() so native slider
// dragging stays smooth. Only arriving (which changes the whole card)
// triggers a real render().
function handleFloorSliderInput(e){
  var axis = e.target.getAttribute('data-axis');
  var isReturn = state.view === 'floorReturn';
  if (!isReturn && state.view !== 'floorRoute') return;
  var r = state.round;
  if (isReturn ? r.rArrived : r.fArrived) return;

  var desired = parseFloat(e.target.value);
  var oldX = isReturn ? r.rx : r.fx, oldY = isReturn ? r.ry : r.fy;
  var newVal = floorStepAxis(oldX, oldY, desired, axis);
  e.target.value = newVal; // snap the thumb back if a wall/table blocked it
  var newX = axis === 'x' ? newVal : oldX;
  var newY = axis === 'y' ? newVal : oldY;
  if (isReturn){ r.rx = newX; r.ry = newY; } else { r.fx = newX; r.fy = newY; }

  var path = isReturn ? r.rPath : r.fPath;
  var last = path[path.length - 1];
  var moved = Math.sqrt(Math.pow(newX - last[0], 2) + Math.pow(newY - last[1], 2));
  if (moved >= 1.2) path.push([newX, newY]);

  var dot = document.getElementById('floor-char-dot');
  if (dot){ dot.setAttribute('transform', 'translate(' + newX + ',' + newY + ')'); }
  var trail = document.getElementById('floor-trail');
  if (trail){ trail.setAttribute('points', path.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ')); }
  // Keep the glass-window camera glued to the character while dragging —
  // same direct-DOM approach as the dot/trail above, no full render().
  var svgEl = document.getElementById('floor-map-svg');
  if (svgEl){
    var cam = floorCamera(newX, newY);
    svgEl.setAttribute('viewBox', cam[0] + ' ' + cam[1] + ' ' + CAMERA_W + ' ' + CAMERA_H);
  }

  if (!isReturn){
    FLOOR_TARGETS.forEach(function(t){
      if (t.id === r.table.id || r.fWrongSeen[t.id]) return;
      if (floorIsAtTarget(newX, newY, t)){ r.fWrongSeen[t.id] = true; r.fWrongCount++; }
    });
  } else if (!r.rWrongSeenCold){
    var cold = ZONE['pickup-cold'], cx0 = cold.x - cold.w / 2, cy0 = cold.y - cold.h / 2;
    if (newX >= cx0 && newX <= cx0 + cold.w && newY >= cy0 && newY <= cy0 + cold.h){
      r.rWrongSeenCold = true; r.rWrongCount++;
    }
  }

  var target = isReturn ? { id: 'pickup-hot' } : r.table;
  if (floorIsAtTarget(newX, newY, target)){
    if (isReturn){
      r.rArrived = true;
      r.rMetrics = floorLegMetrics(r.rPath, r.rStart, floorTargetPoint(target), Date.now() - r.rStartTime, r.rWrongCount);
    } else {
      r.fArrived = true;
      r.fMetrics = floorLegMetrics(r.fPath, r.fStart, floorTargetPoint(r.table), Date.now() - r.fStartTime, r.fWrongCount);
    }
    burstConfetti({ count: 20, duration: 700 });
    render();
  }
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');

  if (action === 'go'){
    go(el.getAttribute('data-view'));
  } else if (action === 'pick-name'){
    state.pendingName = el.getAttribute('data-name');
    state.pinError = null;
    render();
  } else if (action === 'back-to-search'){
    state.pendingName = null;
    state.pinError = null;
    render();
  } else if (action === 'confirm-pin'){
    submitPin((document.getElementById('pin-input') || {}).value || '');
  } else if (action === 'switch-player'){
    clearLocal(ID_KEY); clearLocal(NAME_KEY);
    go('identify', { search: '' });
  } else if (action === 'pick-scenario'){
    go('dinnerBuild', { scenarioId: el.getAttribute('data-id'), selected: [], activeCat: 'all' });
  } else if (action === 'filter-cat'){
    state.activeCat = el.getAttribute('data-cat');
    render();
  } else if (action === 'toggle-item'){
    var id = el.getAttribute('data-id');
    var sel = state.selected || [];
    var i = sel.indexOf(id);
    if (i === -1) sel.push(id); else sel.splice(i, 1);
    state.selected = sel;
    render();
  } else if (action === 'submit-dinner'){
    var scForCourses = SCENARIOS.filter(function(s){ return s.id === state.scenarioId; })[0];
    var defaultCount = Math.max(3, Math.min(6, (scForCourses && scForCourses.minCourses) || 3));
    var selForCourses = state.selected || [];
    var defaultAssign = {};
    selForCourses.forEach(function(id, i){ defaultAssign[id] = (i % defaultCount) + 1; });
    go('dinnerCourses', {
      scenarioId: state.scenarioId, selected: selForCourses,
      courseCount: defaultCount, courseAssign: defaultAssign, beveragePairings: {}
    });
  } else if (action === 'back-to-dinner-build'){
    go('dinnerBuild', { scenarioId: state.scenarioId, selected: state.selected, activeCat: 'all' });
  } else if (action === 'set-course-count'){
    var newN = parseInt(el.getAttribute('data-n'), 10);
    state.courseCount = newN;
    // Pull any dish/pairing assigned to a course number that no longer
    // exists back into range, rather than silently losing the work —
    // cheaper for staff to nudge it than to reassign from scratch.
    var assign2 = state.courseAssign || {};
    Object.keys(assign2).forEach(function(id){ if (assign2[id] > newN) assign2[id] = newN; });
    state.courseAssign = assign2;
    var pairings2 = state.beveragePairings || {};
    Object.keys(pairings2).forEach(function(cNum){
      if (parseInt(cNum, 10) > newN){
        if (!pairings2[newN]) pairings2[newN] = pairings2[cNum];
        delete pairings2[cNum];
      }
    });
    state.beveragePairings = pairings2;
    if (state.activeBevCourse > newN) state.activeBevCourse = null;
    render();
  } else if (action === 'assign-course'){
    var dishId = el.getAttribute('data-id');
    var courseN = parseInt(el.getAttribute('data-n'), 10);
    state.courseAssign = state.courseAssign || {};
    state.courseAssign[dishId] = courseN;
    render();
  } else if (action === 'toggle-bev-picker'){
    var pickerCourse = parseInt(el.getAttribute('data-n'), 10);
    state.activeBevCourse = (state.activeBevCourse === pickerCourse) ? null : pickerCourse;
    state.bevActiveCat = '';
    render();
  } else if (action === 'bev-filter-cat'){
    state.bevActiveCat = el.getAttribute('data-cat');
    render();
  } else if (action === 'pick-beverage'){
    var bevId = el.getAttribute('data-id');
    state.beveragePairings = state.beveragePairings || {};
    if (state.activeBevCourse){ state.beveragePairings[state.activeBevCourse] = bevId; }
    state.activeBevCourse = null;
    render();
  } else if (action === 'clear-beverage'){
    var clearCourse = parseInt(el.getAttribute('data-n'), 10);
    state.beveragePairings = state.beveragePairings || {};
    delete state.beveragePairings[clearCourse];
    render();
  } else if (action === 'continue-to-review'){
    go('dinnerResult', {
      scenarioId: state.scenarioId, selected: state.selected, courseCount: state.courseCount,
      courseAssign: state.courseAssign, beveragePairings: state.beveragePairings
    });
  } else if (action === 'finish-dinner'){
    var sc = SCENARIOS.filter(function(s){ return s.id === state.scenarioId; })[0];
    var r = scoreDinner(sc, state.selected);
    var cr = scoreCourses(state.courseCount, state.selected || [], state.courseAssign, state.beveragePairings);
    var justEl = document.getElementById('justification');
    state.justification = justEl ? justEl.value.trim() : '';
    if (!state.recorded){
      pushHistory({
        gameType: 'dinner-build', scenarioTitle: sc.title, score: r.score, courseScore: cr.score,
        completedAt: new Date().toISOString()
      });
      state.recorded = true;
    }
    state.finished = true;
    render();
  } else if (action === 'toggle-quiz-cat'){
    var cat = el.getAttribute('data-cat');
    if (!state.quizCats){ state.quizCats = QUIZ_CATEGORIES.map(function(c){ return c.key; }); }
    var at = state.quizCats.indexOf(cat);
    if (at !== -1){
      if (state.quizCats.length > 1) state.quizCats.splice(at, 1); // keep at least one category selected
    } else {
      state.quizCats.push(cat);
    }
    render();
  } else if (action === 'start-quiz'){
    var n = parseInt(el.getAttribute('data-n'), 10);
    var cats = (state.quizCats && state.quizCats.length) ? state.quizCats : QUIZ_CATEGORIES.map(function(c){ return c.key; });
    go('quizPlay', { questions: buildQuiz(n, cats), qIndex: 0, answers: [], answeredThis: false, revealed: false, streak: 0 });
  } else if (action === 'answer-mc'){
    var q = state.questions[state.qIndex];
    var opt = el.getAttribute('data-opt');
    var correct = (opt === q.correctAnswer);
    state.lastPicked = opt;
    state.answeredThis = true;
    state.streak = correct ? (state.streak || 0) + 1 : 0;
    if (correct) burstConfetti({ count: 16, duration: 650, originEl: el });
    state.answers.push({ kind: 'mc', prompt: q.prompt, yourAnswer: opt, correctAnswerText: q.correctAnswer, correct: correct });
    render();
  } else if (action === 'answer-type'){
    var q2 = state.questions[state.qIndex];
    var typed = (document.getElementById('type-answer') || {}).value || '';
    var guessed = parseAllergenInput(typed);
    var isCorrect = setsEqual(guessed, q2.correctSet);
    state.lastTyped = typed;
    state.lastCorrect = isCorrect;
    state.answeredThis = true;
    state.streak = isCorrect ? (state.streak || 0) + 1 : 0;
    if (isCorrect) burstConfetti({ count: 16, duration: 650 });
    var correctText = Object.keys(q2.correctSet).map(function(a){ return ALLERGEN_LABEL[a]; }).join(', ') || 'None';
    state.answers.push({ kind: 'type', prompt: q2.prompt, yourAnswer: typed || '(blank)', correctAnswerText: correctText, correct: isCorrect });
    render();
  } else if (action === 'reveal-flashcard'){
    state.revealed = true;
    render();
  } else if (action === 'flashcard-grade'){
    var q3 = state.questions[state.qIndex];
    var got = el.getAttribute('data-got') === '1';
    state.answers.push({ kind: 'flashcard', itemId: q3.itemId, gotIt: got });
    goNextQuestion();
  } else if (action === 'next-question'){
    goNextQuestion();
  } else if (action === 'copy-summary'){
    copyText(el.getAttribute('data-text'), el);
  } else if (action === 'download-summary'){
    if (downloadsCap){
      downloadsCap.save({ filename: el.getAttribute('data-filename'), data: el.getAttribute('data-text') }).catch(function(){});
    }
  } else if (action === 'start-floor'){
    var nf = parseInt(el.getAttribute('data-n'), 10);
    go('floorTicket', { floorTotal: nf, floorIndex: 0, floorRoundResults: [], floorStreak: 0, floorRecorded: false, round: buildFloorRound() });
  } else if (action === 'go-floor-route'){
    state.round.fStartTime = Date.now();
    floorGo('floorRoute');
  } else if (action === 'go-floor-place'){
    floorGo('floorPlace');
  } else if (action === 'tap-dish'){
    var did = el.getAttribute('data-dish');
    state.round.armedDish = (state.round.armedDish === did) ? null : did;
    render();
  } else if (action === 'place-at'){
    var tgt = el.getAttribute('data-target');
    var rPlace = state.round;
    if (rPlace.armedDish){
      rPlace.placed[rPlace.armedDish] = tgt;
      rPlace.armedDish = null;
      render();
    }
  } else if (action === 'go-floor-return'){
    var rRet = state.round;
    // Start the walk back from wherever they're actually standing (where
    // the forward leg left them, just outside the table) — not teleported
    // to the table's exact centre, which sits inside the table's own
    // collision box and would leave them unable to move at all.
    var rStart = [rRet.fx, rRet.fy];
    rRet.rStart = rStart; rRet.rx = rStart[0]; rRet.ry = rStart[1]; rRet.rPath = [rStart.slice()];
    rRet.rArrived = false; rRet.rStartTime = Date.now(); rRet.rWrongCount = 0; rRet.rWrongSeenCold = false; rRet.rMetrics = null;
    floorGo('floorReturn');
  } else if (action === 'finish-floor-return'){
    var rFin = state.round;
    var place = floorPlacementScore(rFin);
    var routeScore = floorRouteScore(rFin);
    var returnScore = floorReturnScore(rFin);
    var roundScore = Math.round((routeScore + returnScore + place.pct) / 3);
    state.lastFloorRound = rFin;
    state.floorStreak = roundScore >= 70 ? (state.floorStreak || 0) + 1 : 0;
    state.floorRoundResults = (state.floorRoundResults || []).concat([{
      table: rFin.table, routeScore: routeScore, returnScore: returnScore,
      placementCorrect: place.correct, placementTotal: place.total, roundScore: roundScore
    }]);
    floorGo('floorRoundResult');
  } else if (action === 'next-floor-round'){
    var nextIdx = (state.floorIndex || 0) + 1;
    if (nextIdx >= state.floorTotal){
      floorGo('floorResult');
    } else {
      state.floorIndex = nextIdx;
      state.round = buildFloorRound();
      floorGo('floorTicket');
    }
  } else if (action === 'copy-layout-json'){
    copyText(editLayoutJSON(), el);
  } else if (action === 'download-layout-json'){
    if (downloadsCap){
      downloadsCap.save({ filename: 'folietta-layout.json', data: editLayoutJSON() }).catch(function(){});
    }
  } else if (action === 'reset-layout'){
    EDIT_STATE = freshEditState();
    render();
  }
});

// ---------------------------------------------------------------------
// Layout Editor dragging — plain Pointer Events (covers mouse, touch and
// pen in one handler) rather than reusing the floor sliders, since here
// any item can move in any direction by any amount, not just the
// character along one axis at a time. editSvgPoint converts a raw
// clientX/clientY into the SVG's own user-space coordinates via its
// screen CTM, so the drag tracks 1:1 under the pointer regardless of how
// large the map is actually rendered on screen. Only the dragged item's
// own <g transform> is touched while dragging (cheap, smooth); the
// Changes panel and JSON export are refreshed once, on release.
// ---------------------------------------------------------------------
var editDrag = null;
function editSvgPoint(svgEl, clientX, clientY){
  var pt = svgEl.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  var ctm = svgEl.getScreenCTM();
  if (!ctm) return { x: 0, y: 0 };
  var loc = pt.matrixTransform(ctm.inverse());
  return { x: loc.x, y: loc.y };
}
document.addEventListener('pointerdown', function(e){
  var g = e.target.closest('.edit-draggable');
  if (!g) return;
  var svgEl = document.getElementById('layout-editor-svg');
  if (!svgEl) return;
  var kind = g.getAttribute('data-editkind');
  var key = g.getAttribute('data-editkey');
  var bucket = kind === 'zone' ? EDIT_STATE.zones : EDIT_STATE.tables;
  var off = bucket[key] || (bucket[key] = { dx: 0, dy: 0 });
  var p = editSvgPoint(svgEl, e.clientX, e.clientY);
  editDrag = { g: g, svgEl: svgEl, off: off, startPX: p.x, startPY: p.y, startDX: off.dx, startDY: off.dy };
  try { g.setPointerCapture(e.pointerId); } catch(err){}
  e.preventDefault();
});
document.addEventListener('pointermove', function(e){
  if (!editDrag) return;
  var p = editSvgPoint(editDrag.svgEl, e.clientX, e.clientY);
  var dx = Math.round((editDrag.startDX + (p.x - editDrag.startPX)) * 10) / 10;
  var dy = Math.round((editDrag.startDY + (p.y - editDrag.startPY)) * 10) / 10;
  editDrag.off.dx = dx; editDrag.off.dy = dy;
  editDrag.g.setAttribute('transform', 'translate(' + dx + ',' + dy + ')');
});
document.addEventListener('pointerup', function(e){
  if (!editDrag) return;
  try { editDrag.g.releasePointerCapture(e.pointerId); } catch(err){}
  editDrag = null;
  if (state.view === 'layoutEditor') render();
});

function submitPin(pin){
  var entry = ROSTER.filter(function(r){ return r.name === state.pendingName; })[0];
  if (entry && entry.pin === pin.trim()){
    setIdentity(state.pendingName);
    go('home');
  } else {
    state.pinError = 'That doesn\'t match our records — try again or ask your manager.';
    render();
  }
}

document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'roster-search'){
    state.search = e.target.value;
    render();
  } else if (e.target && e.target.id === 'pin-input'){
    var digits = e.target.value.replace(/\D/g, '').slice(0, 4);
    if (digits !== e.target.value) e.target.value = digits;
    if (digits.length === 4) submitPin(digits);
  } else if (e.target && e.target.classList && e.target.classList.contains('floor-slider')){
    handleFloorSliderInput(e);
  }
});

function goNextQuestion(){
  state.qIndex = (state.qIndex || 0) + 1;
  state.answeredThis = false;
  state.revealed = false;
  state.lastPicked = null;
  state.lastTyped = '';
  if (state.qIndex >= state.questions.length){
    go('quizResult', { answers: state.answers });
  } else {
    render();
  }
}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
render();
initCaps();

})();

</script>
