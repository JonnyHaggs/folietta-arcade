// ---------------------------------------------------------------------
// View: Quiz play
// ---------------------------------------------------------------------
function viewQuizPlay(){
  var qs = state.questions;
  var idx = state.qIndex || 0;
  var q = qs[idx];
  var pct = Math.round((idx / qs.length) * 100);

  var html = topbar('', 'home', streakBadge(state.streak));
  html += '<div class="progress"><div style="width:' + pct + '%"></div></div>';
  html += '<p class="muted small">Question ' + (idx + 1) + ' of ' + qs.length + '</p>';

  var answered = state.answeredThis;

  if (q.kind === 'mc'){
    html += '<div class="card"><p style="font-size:15px;font-weight:700;">' + esc(q.prompt) + '</p>';
    html += '<div class="q-options">';
    q.options.forEach(function(opt){
      var cls = 'q-opt';
      if (answered){
        if (opt === q.correctAnswer) cls += ' correct';
        else if (opt === state.lastPicked) cls += ' incorrect';
      }
      html += '<button class="' + cls + '" data-action="answer-mc" data-opt="' + esc(opt) + '" ' + (answered ? 'disabled' : '') + '>' + esc(opt) + '</button>';
    });
    html += '</div>';
    if (answered){
      var wasRight = state.lastPicked === q.correctAnswer;
      html += '<p class="q-feedback ' + (wasRight ? 'good' : 'bad') + '">' +
        (wasRight ? '&#127881; Nice one!' : '&#128064; Good try &mdash; keep going!') + '</p>';
      html += '<div class="btn-row"><button class="btn" data-action="next-question">Next &rarr;</button></div>';
    }
    html += '</div>';
  } else if (q.kind === 'type'){
    html += '<div class="card"><p style="font-size:15px;font-weight:700;">' + esc(q.prompt) + '</p>';
    if (!answered){
      html += '<input type="text" id="type-answer" placeholder="e.g. gluten, dairy, egg">';
      html += '<div class="btn-row"><button class="btn" data-action="answer-type">Check answer</button></div>';
    } else {
      var correctList = Object.keys(q.correctSet).map(function(a){ return ALLERGEN_LABEL[a]; });
      html += '<p class="small muted">You typed: <em>' + esc(state.lastTyped || '(blank)') + '</em></p>';
      html += '<p class="q-feedback ' + (state.lastCorrect ? 'good' : 'bad') + '">' +
        (state.lastCorrect ? '&#127881; Nice one!' : '&#128064; Not quite.') + '</p>';
      html += '<p class="small">Correct answer: ' + (correctList.length ? esc(correctList.join(', ')) : 'None of the 7 major allergens.') + '</p>';
      html += '<div class="btn-row"><button class="btn" data-action="next-question">Next &rarr;</button></div>';
    }
    html += '</div>';
  } else if (q.kind === 'flashcard'){
    var it = ITEM[q.itemId];
    html += '<div class="flip-scene"><div class="flashcard' + (state.revealed ? ' flipped' : '') + '">' +
      '<div class="fc-face fc-front"><div class="fc-name">' + esc(it.name) + '</div><div class="fc-price">' + esc(it.price) + '</div>' +
      '<p class="muted small">Try to recite the drop line out loud, then flip the card.</p>' +
      '<div class="btn-row" style="justify-content:center;"><button class="btn gold" data-action="reveal-flashcard">&#128260; Flip card</button></div></div>' +
      '<div class="fc-face fc-back"><div class="fc-name">' + esc(it.name) + '</div>' +
      '<div class="fc-line">&ldquo;' + esc(it.drop) + '&rdquo;</div>' +
      '<div class="btn-row" style="justify-content:center;margin-top:16px;">' +
      '<button class="btn" data-action="flashcard-grade" data-got="1">&#9989; Got it</button>' +
      '<button class="btn secondary" data-action="flashcard-grade" data-got="0">Missed it</button></div></div>' +
      '</div></div>';
  }

  return html;
}

// ---------------------------------------------------------------------
// View: Quiz result
// ---------------------------------------------------------------------
function viewQuizResult(){
  var answers = state.answers || [];
  var identity = getIdentity();
  var graded = answers.filter(function(a){ return a.kind !== 'flashcard'; });
  var correctCount = graded.filter(function(a){ return a.correct; }).length;
  var flashcards = answers.filter(function(a){ return a.kind === 'flashcard'; });
  var fcGot = flashcards.filter(function(a){ return a.gotIt; }).length;
  var pct = graded.length ? Math.round((correctCount / graded.length) * 100) : 0;

  if (pct >= 70) burstConfetti({ count: pct >= 90 ? 90 : 55, duration: 1700 });
  var quizTitle = pct >= 90 ? '🏆 Crushed It!' : (pct >= 70 ? '🎉 Nice Work!' : 'Quiz Complete');
  var html = topbar(quizTitle, null);
  html += '<div class="card" style="text-align:center;"><div class="score-circle"><span class="num">' + pct + '%</span><span class="lbl">score</span></div>' +
    '<p class="muted">' + correctCount + ' of ' + graded.length + ' graded questions correct' +
    (flashcards.length ? ', plus ' + fcGot + '/' + flashcards.length + ' drop lines self-marked' : '') + '</p></div>';

  html += '<div class="card"><h2>Review</h2>';
  answers.forEach(function(a){
    if (a.kind === 'flashcard'){
      var it = ITEM[a.itemId];
      html += '<p class="small">' + (a.gotIt ? '&#10003;' : '&#9711;') + ' <strong>' + esc(it.name) + '</strong> drop line — ' +
        (a.gotIt ? 'self-marked correct' : 'self-marked missed') + '</p>';
    } else {
      html += '<p class="small" style="color:' + (a.correct ? 'var(--success)' : 'var(--danger)') + '">' +
        (a.correct ? '&#10003;' : '&#10007;') + ' ' + esc(a.prompt) + '<br><span class="muted">Your answer: ' + esc(a.yourAnswer) +
        (a.correct ? '' : ' &mdash; correct: ' + esc(a.correctAnswerText)) + '</span></p>';
    }
  });
  html += '</div>';

  if (!state.recorded){
    pushHistory({ gameType: 'quiz', quizScore: correctCount, quizTotal: graded.length, completedAt: new Date().toISOString() });
    state.recorded = true;
  }

  var summary = quizSummaryText(answers, identity.name);
  html += sendRow(summary, 'Folietta quiz — ' + identity.name, 'folietta-quiz');
  html += '<div class="btn-row"><button class="btn secondary" data-action="go" data-view="home">Back to home</button></div>';
  return html;
}

// ---------------------------------------------------------------------
// View: Wine Tour of Italy — the 4th game. A 10-stop narrated tour
// through WINE_TOUR_STOPS (built from Folietta's own Wine Study Guide):
// each stop is a short "story" page of real wine-list content followed
// by one of four mini-game checks — ladder (order N things correctly),
// trivia (multiple-choice/true-false), flashcard (self-graded recall),
// or match (tap-to-pair). Flow: wineTourIntro -> wineStop(0) ->
// wineCheck(0) -> wineStop(1) -> ... -> wineStop(9) -> wineCheck(9) ->
// wineTourResult. See finishWineCheck()/advanceWineStop() below for how
// one stop's check hands off to the next stop (or the final result).
// ---------------------------------------------------------------------
function viewWineTourIntro(){
  var html = topbar('Wine Tour of Italy', 'home');
  html += '<div class="disclaimer">Wine facts, producers and vintages in this tour are for staff training only &mdash; the actual list can change. Always confirm specifics with a manager before relying on them with a guest.</div>';
  html += '<div class="card"><h2>What to expect</h2>' +
    '<p>Ten stops, one per region of the list &mdash; from the sparkling wines of Emilia-Romagna, up through the Alps, down the Italian coast, across into Sangiovese country, and finally home to the BC wines on our own list. ' +
    'Every stop is a short read, then a quick challenge to lock it in: order a ladder, answer a few questions, flip some flashcards, or match grape to grape.</p>' +
    '<div class="btn-row"><button class="btn gold" data-action="start-wine-tour">Begin the tour &rarr;</button></div></div>';
  html += '<div class="card"><h2>The 10 stops</h2><ol class="small" style="padding-left:20px;margin:0;">';
  WINE_TOUR_STOPS.forEach(function(s){
    html += '<li style="margin-bottom:4px;"><strong>' + esc(s.title) + '</strong> &mdash; <span class="muted">' + esc(s.kicker) + '</span></li>';
  });
  html += '</ol></div>';
  return html;
}

function wineStopProgressPct(idx){
  return Math.round((idx / WINE_TOUR_STOPS.length) * 100);
}

// ---------------------------------------------------------------------
// The "story" half of each stop is a swipeable card deck, not a page of
// text to scroll through: one visual card per wine (or per tier/term/
// chart, for the stops that have those instead of — or alongside —
// wines), with a wine-glass icon tinted to that wine's colour, tapped or
// swiped through left-to-right. buildWineDeck() flattens a stop's
// content into that card sequence once; wineCardHtml() renders whichever
// card is current.
// ---------------------------------------------------------------------
var WINE_COLOR_HEX = { sparkling: '#f0c75e', white: '#e8d98a', rose: '#e8a0ab', orange: '#d98a3d', red: '#7a1f2b' };
var WINE_COLOR_LABEL = { sparkling: 'Sparkling', white: 'White', rose: 'Rosé', orange: 'Orange', red: 'Red' };
var WINE_TIER_COLOR = { 'DOCG': 'var(--accent-deep)', 'DOC': '#c9607a', 'IGT / IGP': 'var(--line)' };
var WINE_TIER_INK = { 'DOCG': '#fff', 'DOC': '#fff', 'IGT / IGP': 'var(--ink)' };
var COLOR_NAME_TO_KEY = { 'White': 'white', 'Rosé': 'rose', 'Orange': 'orange', 'Red': 'red' };

// A single generic stemmed-glass silhouette, reused for every wine card —
// only the fill colour (and, for sparkling, a few bubbles) changes.
function wineGlassSvg(hex, bubbles){
  var bub = bubbles ? '<circle cx="26" cy="13" r="1.3" fill="#fff" opacity=".85"/><circle cx="33" cy="9" r="1" fill="#fff" opacity=".75"/><circle cx="29" cy="19" r="0.9" fill="#fff" opacity=".65"/>' : '';
  return '<svg viewBox="0 0 60 90" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M18 7 Q18 28 30 32 Q42 28 42 7 L38 7 Q38 23 30 26 Q22 23 22 7 Z" fill="' + hex + '"/>' + bub +
    '<path d="M14 4 Q14 30 30 34 Q46 30 46 4" stroke="#8a6a4a" stroke-width="2.2" stroke-linecap="round"/>' +
    '<line x1="30" y1="34" x2="30" y2="68" stroke="#8a6a4a" stroke-width="2.2" stroke-linecap="round"/>' +
    '<line x1="17" y1="74" x2="43" y2="74" stroke="#8a6a4a" stroke-width="2.2" stroke-linecap="round"/>' +
    '<line x1="30" y1="68" x2="30" y2="74" stroke="#8a6a4a" stroke-width="2.2" stroke-linecap="round"/></svg>';
}
function conceptIconSvg(){
  return '<svg viewBox="0 0 60 90" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="30" cy="34" r="24" fill="var(--bg-sunk)" stroke="var(--gold-deep)" stroke-width="2.4"/>' +
    '<circle cx="30" cy="24" r="2.6" fill="var(--gold-deep)"/>' +
    '<line x1="30" y1="31" x2="30" y2="46" stroke="var(--gold-deep)" stroke-width="3.2" stroke-linecap="round"/></svg>';
}

function buildWineDeck(stop){
  var cards = [];
  if (stop.extra && stop.extra.tiers){
    stop.extra.tiers.forEach(function(t){ cards.push({ kind: 'tier', name: t.name, desc: t.desc }); });
    stop.extra.terms.forEach(function(t){ cards.push({ kind: 'term', name: t.term, desc: t.desc }); });
  }
  stop.wines.forEach(function(w){ cards.push({ kind: 'wine', wine: w }); });
  if (stop.extra && stop.extra.bodyChart) cards.push({ kind: 'bodyChart', chart: stop.extra.bodyChart });
  if (stop.extra && stop.extra.colorChart) cards.push({ kind: 'colorChart', chart: stop.extra.colorChart });
  if (stop.extra && stop.extra.studyPairs) cards.push({ kind: 'studyPairs', pairs: stop.extra.studyPairs });
  return cards;
}

function wineCardClass(card){
  if (card.kind === 'wine') return 'wc-' + (card.wine.color || 'white');
  return 'wc-neutral';
}

function wineCardHtml(card){
  if (card.kind === 'wine'){
    var w = card.wine;
    var hex = WINE_COLOR_HEX[w.color] || WINE_COLOR_HEX.white;
    var html = '<div class="wine-card-glass">' + wineGlassSvg(hex, w.color === 'sparkling') + '</div>';
    html += '<div class="wine-card-tag" style="background:' + hex + ';color:' + (w.color === 'white' || w.color === 'sparkling' ? '#4a3a12' : '#fff') + ';">' + esc(WINE_COLOR_LABEL[w.color] || '') + '</div>';
    html += '<h2 class="wine-card-name">' + esc(w.name) + '</h2>';
    if (w.origin) html += '<p class="wine-card-origin">' + esc(w.origin) + '</p>';
    if (w.example) html += '<p class="wine-card-example">' + esc(w.example) + '</p>';
    html += '<p class="wine-card-text">' + esc(w.text) + '</p>';
    if (w.compare) html += '<p class="wine-card-compare"><strong>' + esc(w.compareLabel || 'Compare') + ':</strong> ' + esc(w.compare) + '</p>';
    if (w.fact) html += '<div class="wine-card-fact"><span class="wine-card-fact-label">&#127775; Fun fact</span><p>' + esc(w.fact) + '</p></div>';
    return html;
  }
  if (card.kind === 'tier'){
    return '<div class="wine-card-tierbar" style="background:' + (WINE_TIER_COLOR[card.name] || 'var(--line)') + ';color:' + (WINE_TIER_INK[card.name] || 'var(--ink)') + ';">' + esc(card.name) + '</div>' +
      '<h2 class="wine-card-name">' + esc(card.name) + '</h2><p class="wine-card-text">' + esc(card.desc) + '</p>';
  }
  if (card.kind === 'term'){
    return '<div class="wine-card-glass">' + conceptIconSvg() + '</div>' +
      '<h2 class="wine-card-name">' + esc(card.name) + '</h2><p class="wine-card-text">' + esc(card.desc) + '</p>';
  }
  if (card.kind === 'bodyChart'){
    var hb = '<h2 class="wine-card-name">Every white, light to full</h2><div class="wine-chart-grid">';
    card.chart.buckets.forEach(function(b){
      hb += '<div class="wine-chart-bucket"><div class="wine-chart-bucket-name">' + esc(b.name) + '</div>' +
        '<div class="wine-chart-bucket-wines">' + esc(b.wines.join(', ')) + '</div></div>';
    });
    hb += '</div><p class="wine-card-compare">' + esc(card.chart.note) + '</p>';
    return hb;
  }
  if (card.kind === 'colorChart'){
    var hc = '<h2 class="wine-card-name">Colour comes from the skins</h2><div class="wine-chart-grid wine-color-grid">';
    card.chart.forEach(function(c){
      var hex2 = WINE_COLOR_HEX[COLOR_NAME_TO_KEY[c.name]] || '#ccc';
      hc += '<div class="wine-chart-bucket"><div class="wine-color-swatch" style="background:' + hex2 + ';"></div>' +
        '<div class="wine-chart-bucket-name">' + esc(c.name) + '</div><div class="wine-chart-bucket-wines">' + esc(c.desc) + '</div></div>';
    });
    hc += '</div>';
    return hc;
  }
  if (card.kind === 'studyPairs'){
    var hp = '<h2 class="wine-card-name">Study pairs</h2><p class="wine-card-compare">One idea, two places. Read (or taste) across.</p>';
    card.pairs.forEach(function(p){ hp += '<p class="wine-card-text">' + esc(p.a) + ' &times; ' + esc(p.b) + '</p>'; });
    return hp;
  }
  return '';
}

// ---------------------------------------------------------------------
// Each stop opens on a small "postcard" scene banner so the tour feels
// like it's actually moving through Italy (and, for the last stop,
// home to BC) rather than just swapping headings. wineSceneSvg() looks
// up a per-stop palette + a short list of scenery elements and composes
// them from a small set of reusable shape helpers — the same approach
// used for the wine-glass card icons above, just at banner scale.
// ---------------------------------------------------------------------
function svgSceneFrame(top, bottom, ground, body, uid){
  var gid = 'wsg-' + uid;
  return '<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + top + '"/><stop offset="1" stop-color="' + bottom + '"/></linearGradient></defs>' +
    '<rect width="400" height="150" fill="url(#' + gid + ')"/>' +
    body +
    '<rect y="142" width="400" height="8" fill="' + ground + '"/>' +
    '</svg>';
}
function svgSun(cx, cy, r, color){
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + color + '" opacity="0.92"/>';
}
function svgHillsBack(baseY, color, opacity){
  return '<path d="M0 150 L0 ' + baseY + ' Q70 ' + (baseY - 22) + ' 140 ' + (baseY - 4) + ' Q220 ' + (baseY - 26) + ' 300 ' + (baseY - 2) + ' Q360 ' + (baseY - 18) + ' 400 ' + baseY + ' L400 150 Z" fill="' + color + '" opacity="' + (opacity || 1) + '"/>';
}
function svgHillsFront(baseY, color, opacity){
  return '<path d="M0 150 L0 ' + baseY + ' Q90 ' + (baseY - 16) + ' 180 ' + baseY + ' Q260 ' + (baseY - 20) + ' 340 ' + (baseY - 2) + ' Q380 ' + (baseY - 10) + ' 400 ' + baseY + ' L400 150 Z" fill="' + color + '" opacity="' + (opacity || 1) + '"/>';
}
function svgMountainsSnow(baseY, color, snow){
  return '<path d="M0 ' + baseY + ' L60 ' + (baseY - 50) + ' L95 ' + (baseY - 20) + ' L150 ' + (baseY - 70) + ' L200 ' + (baseY - 15) + ' L260 ' + (baseY - 60) + ' L330 ' + (baseY - 10) + ' L400 ' + baseY + ' Z" fill="' + color + '"/>' +
    '<path d="M60 ' + (baseY - 50) + ' L68 ' + (baseY - 36) + ' L52 ' + (baseY - 36) + ' Z" fill="' + snow + '"/>' +
    '<path d="M150 ' + (baseY - 70) + ' L160 ' + (baseY - 54) + ' L140 ' + (baseY - 54) + ' Z" fill="' + snow + '"/>' +
    '<path d="M260 ' + (baseY - 60) + ' L269 ' + (baseY - 45) + ' L251 ' + (baseY - 45) + ' Z" fill="' + snow + '"/>';
}
function svgVolcano(baseY, color, snowCap, smoke){
  var s = '<path d="M130 ' + baseY + ' L220 ' + (baseY - 80) + ' L245 ' + (baseY - 68) + ' L330 ' + baseY + ' Z" fill="' + color + '"/>';
  if (snowCap) s += '<path d="M220 ' + (baseY - 80) + ' L229 ' + (baseY - 66) + ' L211 ' + (baseY - 66) + ' Z" fill="' + snowCap + '"/>';
  s += '<path d="M222 ' + (baseY - 82) + ' Q232 ' + (baseY - 98) + ' 220 ' + (baseY - 110) + ' Q234 ' + (baseY - 105) + ' 240 ' + (baseY - 92) + '" fill="none" stroke="' + (smoke || '#cfd3d6') + '" stroke-width="3" stroke-linecap="round" opacity="0.65"/>';
  return s;
}
function svgCypress(x, y, h, color){
  var w = h * 0.22;
  return '<path d="M' + x + ' ' + y + ' Q' + (x - w) + ' ' + (y - h * 0.5) + ' ' + x + ' ' + (y - h) + ' Q' + (x + w) + ' ' + (y - h * 0.5) + ' ' + x + ' ' + y + ' Z" fill="' + color + '"/>' +
    '<rect x="' + (x - 1.4) + '" y="' + y + '" width="2.8" height="6" fill="#5b4530"/>';
}
function svgCypressRow(baseY, color, count, spacing, startX){
  var s = '';
  for (var i = 0; i < count; i++){
    var h = 18 + (i % 3) * 4;
    s += svgCypress(startX + i * spacing, baseY, h, color);
  }
  return s;
}
function svgVineyardRows(x, y, w, h, color){
  var s = '<g opacity="0.55">';
  var n = 8;
  for (var i = 0; i <= n; i++){
    var yy = y + (h / n) * i;
    s += '<line x1="' + x + '" y1="' + yy + '" x2="' + (x + w) + '" y2="' + (yy - h * 0.1) + '" stroke="' + color + '" stroke-width="1.6"/>';
  }
  s += '</g>';
  return s;
}
function svgTownTowers(baseY, color, roof, offsetX){
  var x = offsetX || 140;
  return '<rect x="' + x + '" y="' + (baseY - 30) + '" width="10" height="30" fill="' + color + '"/>' +
    '<rect x="' + (x + 15) + '" y="' + (baseY - 40) + '" width="9" height="40" fill="' + color + '"/>' +
    '<rect x="' + (x + 28) + '" y="' + (baseY - 24) + '" width="12" height="24" fill="' + color + '"/>' +
    '<rect x="' + (x + 45) + '" y="' + (baseY - 34) + '" width="8" height="34" fill="' + color + '"/>' +
    '<path d="M' + (x + 15) + ' ' + (baseY - 40) + ' L' + (x + 19.5) + ' ' + (baseY - 48) + ' L' + (x + 24) + ' ' + (baseY - 40) + ' Z" fill="' + (roof || color) + '"/>';
}
function svgLake(y, w, color){
  return '<ellipse cx="200" cy="' + y + '" rx="' + (w / 2) + '" ry="11" fill="' + color + '" opacity="0.8"/>';
}
function svgFogBand(y, opacity){
  return '<rect x="0" y="' + (y - 6) + '" width="400" height="14" fill="#ffffff" opacity="' + opacity + '"/>';
}
function svgBirds(x, y){
  return '<path d="M' + x + ' ' + y + ' q4 -5 8 0 q4 -5 8 0" stroke="#5a5a5a" stroke-width="1.4" fill="none" stroke-linecap="round"/>' +
    '<path d="M' + (x + 22) + ' ' + (y + 7) + ' q4 -5 8 0 q4 -5 8 0" stroke="#5a5a5a" stroke-width="1.4" fill="none" stroke-linecap="round"/>';
}

function wineSceneSvg(stop){
  var id = stop.id, sky, ground, body;
  switch (id){
    case 'frizzante':
      sky = ['#dff1f5', '#f3f8ea']; ground = '#cfe3c6';
      body = svgHillsBack(100, '#aed1c9') + svgHillsFront(118, '#8fc3a6') +
        svgVineyardRows(16, 108, 368, 26, '#6f8f52') +
        svgCypressRow(128, '#4c6b3c', 5, 34, 20) +
        svgSun(344, 30, 16, '#fff3cf');
      break;
    case 'bianchi-1':
      sky = ['#cdeaf7', '#eef8fb']; ground = '#dce7e0';
      body = svgMountainsSnow(112, '#9fb6c6', '#ffffff') +
        svgVineyardRows(16, 120, 368, 20, '#5f7a5a') +
        svgSun(40, 26, 14, '#fff8e0');
      break;
    case 'bianchi-2':
      sky = ['#ffe9bf', '#fff6e0']; ground = '#e8d8a8';
      body = svgHillsBack(104, '#e3c58a') + svgHillsFront(122, '#d4b26c') +
        svgTownTowers(130, '#c98f55', '#8a4a2a', 150) +
        svgCypressRow(132, '#5b6b3c', 4, 40, 240) +
        svgSun(44, 28, 15, '#fff3cf');
      break;
    case 'bianchi-3':
      sky = ['#ffd9b0', '#fff0d8']; ground = '#e7c79a';
      body = svgVolcano(126, '#8a7266', '#ffffff', '#d7d2cc') +
        svgVineyardRows(16, 122, 150, 16, '#6f6a4a') +
        svgSun(354, 26, 15, '#ffdca0');
      break;
    case 'rosato-arancia':
      sky = ['#cfe6ef', '#eef8f5']; ground = '#cfe0d6';
      body = svgLake(122, 260, '#9cc7cf') + svgHillsBack(96, '#a9c9ae') +
        svgCypressRow(130, '#4e6b45', 3, 50, 26) +
        svgBirds(260, 34) + svgSun(60, 28, 14, '#fff6d8');
      break;
    case 'rosso-1':
      sky = ['#dbe2e3', '#eef1ef']; ground = '#c7cfc2';
      body = svgHillsBack(104, '#b7c0b8', 0.85) + svgHillsFront(122, '#a0ab9c', 0.9) +
        svgVineyardRows(16, 118, 368, 22, '#6a7360') +
        svgFogBand(96, 0.5) + svgFogBand(120, 0.35);
      break;
    case 'rosso-2':
      sky = ['#ffcf8f', '#ffe7bd']; ground = '#caa05c';
      body = svgHillsBack(108, '#c08a4e') +
        svgCypressRow(132, '#3c3220', 6, 30, 14) +
        svgSun(330, 54, 22, '#ffb35c');
      break;
    case 'rosso-3':
      sky = ['#ffcf9c', '#ffb199']; ground = '#d79a63';
      body = svgHillsBack(112, '#c98b57') +
        svgVineyardRows(16, 122, 368, 18, '#8a5a2e') +
        svgSun(70, 40, 20, '#ffdf9c');
      break;
    case 'home-ground':
      sky = ['#c9e6ee', '#e7f6ee']; ground = '#cfe0c9';
      body = svgLake(120, 280, '#8fc0cc') + svgHillsBack(98, '#9fbf9a') +
        svgVineyardRows(16, 116, 368, 18, '#5d7a52') +
        svgSun(340, 30, 15, '#fff3d0');
      break;
    default:
      sky = ['#e8ddc9', '#f6efe0']; ground = '#d8c7a0';
      body = svgHillsBack(108, '#c7b589') + svgTownTowers(126, '#a9794a', '#6c3d22', 160) + svgSun(40, 28, 14, '#fff3cf');
  }
  return svgSceneFrame(sky[0], sky[1], ground, body, id);

function viewWineStop(){
  var idx = state.wineStopIndex || 0;
  var stop = WINE_TOUR_STOPS[idx];
  var deck = buildWineDeck(stop);
  var ci = Math.max(0, Math.min(state.wineCardIndex || 0, deck.length - 1));
  var card = deck[ci];

  var html = topbar('', 'home', '<span class="muted small">Stop ' + (idx + 1) + ' of ' + WINE_TOUR_STOPS.length + '</span>');
  html += '<div class="progress"><div style="width:' + wineStopProgressPct(idx) + '%"></div></div>';
  html += '<div class="wine-scene">' + wineSceneSvg(stop) +
    '<div class="wine-scene-scrim"></div>' +
    '<div class="wine-scene-stamp">Stop ' + (idx + 1) + ' &middot; ' + WINE_TOUR_STOPS.length + '</div>' +
    '<div class="wine-scene-text"><h1>' + esc(stop.title) + '</h1><p>' + esc(stop.kicker) + '</p></div>' +
    '</div>';
  html += '<div class="fact" style="margin-bottom:14px;">' + esc(stop.intro) + '</div>';

  html += '<div class="wine-deck">';
  html += '<div class="wine-deck-card ' + wineCardClass(card) + '">' + wineCardHtml(card) + '</div>';
  if (ci > 0) html += '<button class="wine-deck-arrow left" data-action="wine-deck-prev" aria-label="Previous card">&#10094;</button>';
  if (ci < deck.length - 1) html += '<button class="wine-deck-arrow right" data-action="wine-deck-next" aria-label="Next card">&#10095;</button>';
  html += '</div>';
  html += '<div class="wine-deck-dots">';
  deck.forEach(function(c, i){
    html += '<button class="wine-deck-dot' + (i === ci ? ' active' : '') + '" data-action="wine-deck-goto" data-idx="' + i + '" aria-label="Card ' + (i + 1) + '"></button>';
  });
  html += '</div>';
  html += '<p class="muted small" style="text-align:center;">Swipe, or tap the arrows &mdash; ' + (ci + 1) + ' of ' + deck.length + '</p>';

  html += '<div class="btn-row" style="justify-content:center;margin-top:16px;"><button class="btn gold" data-action="start-wine-check">Test what you learned &rarr;</button></div>';
  return html;
}

function wineCheckTriviaHtml(check){
  var idx = state.wcIndex || 0;
  var q = check.questions[idx];
  var html = '<p class="muted small">Question ' + (idx + 1) + ' of ' + check.questions.length + '</p>';
  html += '<div class="card"><p style="font-size:15px;font-weight:700;">' + esc(q.prompt) + '</p><div class="q-options">';
  var answered = state.wcAnsweredThis;
  q.options.forEach(function(opt){
    var cls = 'q-opt';
    if (answered){
      if (opt === q.correctAnswer) cls += ' correct';
      else if (opt === state.wcLastPicked) cls += ' incorrect';
    }
    html += '<button class="' + cls + '" data-action="wine-trivia-answer" data-opt="' + esc(opt) + '" ' + (answered ? 'disabled' : '') + '>' + esc(opt) + '</button>';
  });
  html += '</div>';
  if (answered){
    var wasRight = state.wcLastPicked === q.correctAnswer;
    html += '<p class="q-feedback ' + (wasRight ? 'good' : 'bad') + '">' + (wasRight ? '&#127881; Nice one!' : '&#128064; Good try &mdash; keep going!') + '</p>';
    html += '<div class="btn-row"><button class="btn" data-action="wine-trivia-next">Next &rarr;</button></div>';
  }
  html += '</div>';
  return html;
}

function wineCheckFlashcardHtml(check){
  var idx = state.wcIndex || 0;
  var w = WINE[check.cards[idx]];
  var html = '<p class="muted small">Card ' + (idx + 1) + ' of ' + check.cards.length + '</p>';
  html += '<div class="flip-scene"><div class="flashcard' + (state.wcRevealed ? ' flipped' : '') + '">' +
    '<div class="fc-face fc-front"><div class="fc-name">' + esc(w.name) + '</div>' +

    '<div class="btn-row" style="justify-content:center;"><button class="btn gold" data-action="wine-flash-reveal">&#128260; Flip card</button></div></div>' +
    '<div class="fc-face fc-back"><div class="fc-name">' + esc(w.name) + '</div>' +
    '<div class="fc-line">' + esc(w.text) + (w.compare ? ' <strong>' + esc(w.compareLabel || 'Compare') + ':</strong> ' + esc(w.compare) : '') + '</div>' +
    '<div class="btn-row" style="justify-content:center;margin-top:16px;">' +
    '<button class="btn" data-action="wine-flash-grade" data-got="1">&#9989; Got it</button>' +
    '<button class="btn secondary" data-action="wine-flash-grade" data-got="0">Missed it</button></div></div>' +
    '</div></div>';
  return html;
}

function wineCheckLadderHtml(check){
  var pool = state.wcPool || [];
  var chosen = state.wcChosen || [];
  var html = '<div class="card"><p style="font-size:15px;font-weight:700;">' + esc(check.prompt) + '</p>';
  html += '<p class="muted small">Tap them, in order, below.</p>';
  html += '<div class="order-slots">';
  for (var i = 0; i < check.items.length; i++){
    var val = chosen[i];
    var slotCls = 'order-slot';
    if (val && !state.wcChecked) slotCls += ' filled';
    if (state.wcChecked && val) slotCls += (val === check.items[i] ? ' correct' : ' incorrect');
    var canUnpick = !!val && !state.wcChecked;
    html += '<button class="' + slotCls + '" ' + (canUnpick ? 'data-action="wine-ladder-unpick" data-idx="' + i + '"' : 'disabled') + '>' +
      '<span class="order-num">' + (i + 1) + '</span><span class="order-val">' + (val ? esc(val) : '&hellip;') + '</span></button>';
  }
  html += '</div>';
  if (!state.wcChecked){
    html += '<div class="q-options">';
    pool.forEach(function(item){
      html += '<button class="q-opt" data-action="wine-ladder-pick" data-item="' + esc(item) + '">' + esc(item) + '</button>';
    });
    html += '</div>';
    if (chosen.length === check.items.length){
      html += '<div class="btn-row"><button class="btn gold" data-action="wine-ladder-check">Check order</button></div>';
    }
  } else {
    var allCorrect = check.items.every(function(it, i){ return chosen[i] === it; });
    html += '<p class="q-feedback ' + (allCorrect ? 'good' : 'bad') + '">' + (allCorrect ? '&#127881; Perfect order!' : '&#128064; Close &mdash; here\'s the real order:') + '</p>';
    if (!allCorrect){
      html += '<p class="small"><strong>Correct order:</strong> ' + check.items.map(function(it){ return esc(it); }).join(' &rarr; ') + '</p>';
    }
    if (check.note) html += '<p class="small muted">' + esc(check.note) + '</p>';
    html += '<div class="btn-row"><button class="btn" data-action="wine-ladder-continue">Continue &rarr;</button></div>';
  }
  html += '</div>';
  return html;
}

function wineCheckMatchHtml(check){
  var results = state.wcResults || {};
  var usedRight = {};
  Object.keys(results).forEach(function(l){ usedRight[results[l].right] = true; });
  var html = '<div class="card"><p style="font-size:15px;font-weight:700;">' + esc(check.prompt) + '</p>';
  html += '<div style="display:flex;gap:10px;">';
  html += '<div style="flex:1;display:flex;flex-direction:column;gap:8px;">';
  check.pairs.forEach(function(p){
    var done = results[p.left];
    var cls = 'q-opt';
    if (done) cls += (done.correct ? ' correct' : ' incorrect');
    else if (state.wcArmed === p.left) cls += ' armed';
    html += '<button class="' + cls + '" data-action="wine-match-arm" data-left="' + esc(p.left) + '" ' + (done ? 'disabled' : '') + '>' + esc(p.left) + '</button>';
  });
  html += '</div><div style="flex:1;display:flex;flex-direction:column;gap:8px;">';
  (state.wcRightOrder || []).forEach(function(r){
    var used = usedRight[r];
    html += '<button class="q-opt" data-action="wine-match-pick" data-right="' + esc(r) + '" ' + ((used || !state.wcArmed) ? 'disabled' : '') + '>' + esc(r) + '</button>';
  });
  html += '</div></div>';
  var allDone = check.pairs.every(function(p){ return results[p.left]; });
  if (allDone){
    var correctCount = check.pairs.filter(function(p){ return results[p.left] && results[p.left].correct; }).length;
    html += '<p class="q-feedback ' + (correctCount === check.pairs.length ? 'good' : 'bad') + '">' + correctCount + ' of ' + check.pairs.length + ' matched correctly.</p>';
    html += '<div class="btn-row"><button class="btn" data-action="wine-match-continue">Continue &rarr;</button></div>';
  }
  html += '</div>';
  return html;
}

function viewWineCheck(){
  var idx = state.wineStopIndex || 0;
  var stop = WINE_TOUR_STOPS[idx];
  var check = stop.check;
  var html = topbar('', null, streakBadge(state.wineStreak));
  html += '<div class="progress"><div style="width:' + wineStopProgressPct(idx) + '%"></div></div>';
  html += '<p class="muted small">' + esc(stop.title) + ' &mdash; challenge</p>';

  if (check.kind === 'trivia') html += wineCheckTriviaHtml(check);
  else if (check.kind === 'flashcard') html += wineCheckFlashcardHtml(check);
  else if (check.kind === 'ladder') html += wineCheckLadderHtml(check);
  else if (check.kind === 'match') html += wineCheckMatchHtml(check);

  return html;
}

// Pushes this stop's result and hands off to the next stop's story page,
// or the final result once stop 10's check is done.
function finishWineCheck(entry){
  var stop = WINE_TOUR_STOPS[state.wineStopIndex || 0];
  var results = (state.wineStopResults || []).concat([Object.assign({ stopId: stop.id, title: stop.title, kind: stop.check.kind }, entry)]);
  var next = (state.wineStopIndex || 0) + 1;
  if (next < WINE_TOUR_STOPS.length){
    go('wineStop', { wineStopIndex: next, wineStopResults: results });
  } else {
    go('wineTourResult', { wineStopResults: results });
  }
}

function wineTourTotals(results){
  var earned = 0, possible = 0, fcGot = 0, fcTotal = 0;
  results.forEach(function(r){
    if (r.kind === 'flashcard'){ fcGot += r.fcGot; fcTotal += r.fcTotal; }
    else { earned += r.earned; possible += r.possible; }
  });
  return { earned: earned, possible: possible, fcGot: fcGot, fcTotal: fcTotal };
}

function wineTourSummaryText(results, playerName){
  var t = wineTourTotals(results);
  var pct = t.possible ? Math.round((t.earned / t.possible) * 100) : 0;
  var lines = [];
  lines.push('FOLIETTA — Wine Tour of Italy');
  lines.push('Player: ' + playerName);
  lines.push('Score: ' + pct + '% (' + t.earned + '/' + t.possible + ' graded)' + (t.fcTotal ? ', ' + t.fcGot + '/' + t.fcTotal + ' flashcards self-marked' : ''));
  lines.push('');
  results.forEach(function(r, i){
    if (r.kind === 'flashcard'){
      lines.push((i + 1) + '. ' + r.title + ' [flashcards] ' + r.fcGot + '/' + r.fcTotal + ' self-marked got it');
    } else {
      lines.push((i + 1) + '. ' + r.title + ' [' + r.kind + '] ' + r.earned + '/' + r.possible);
    }
  });
  lines.push('');
  lines.push('Completed: ' + new Date().toLocaleString());
  return lines.join('\n');
}

function viewWineTourResult(){
  var results = state.wineStopResults || [];
  var identity = getIdentity();
  var t = wineTourTotals(results);
  var pct = t.possible ? Math.round((t.earned / t.possible) * 100) : 0;
  if (pct >= 70) burstConfetti({ count: pct >= 90 ? 90 : 55, duration: 1700 });
  var tourTitle = pct >= 90 ? '&#127942; Sommelier-Level!' : (pct >= 70 ? '&#127881; Nice Tour!' : 'Tour Complete');
  var html = topbar(tourTitle, null);
  html += '<div class="card" style="text-align:center;"><div class="score-circle"><span class="num">' + pct + '%</span><span class="lbl">score</span></div>' +
    '<p class="muted">' + t.earned + ' of ' + t.possible + ' graded points' + (t.fcTotal ? ', plus ' + t.fcGot + '/' + t.fcTotal + ' flashcards self-marked' : '') + '</p></div>';
  html += '<div class="card"><h2>Stop by stop</h2>';
  results.forEach(function(r){
    if (r.kind === 'flashcard'){
      html += '<p class="small">' + esc(r.title) + ' &mdash; <span class="muted">flashcards: ' + r.fcGot + '/' + r.fcTotal + ' self-marked</span></p>';
    } else {
      var ok = r.possible ? (r.earned === r.possible) : true;
      html += '<p class="small" style="color:' + (ok ? 'var(--success-deep)' : 'var(--ink)') + ';">' + esc(r.title) + ' &mdash; ' + r.earned + '/' + r.possible + '</p>';
    }
  });
  html += '</div>';

  if (!state.recorded){
    pushHistory({ gameType: 'winetour', wineScore: pct, completedAt: new Date().toISOString() });
    state.recorded = true;
  }

  var summary = wineTourSummaryText(results, identity.name);
  html += sendRow(summary, 'Folietta wine tour — ' + identity.name, 'folietta-wine-tour');
  html += '<div class="btn-row"><button class="btn secondary" data-action="go" data-view="home">Back to home</button></div>';
  return html;
}

// ---------------------------------------------------------------------
// View: Run the Floor — table/seat numbers + kitchen-to-table routing
// ---------------------------------------------------------------------
function tableLabel(t){ return t.isCounter ? t.label : ('Table ' + t.id); }

function floorSummaryText(rounds, playerName, avg){
  var lines = [];
  lines.push('FOLIETTA — Run the Floor');
  lines.push('Player: ' + playerName);
  lines.push('Average score: ' + avg + '% across ' + rounds.length + ' deliveries');
  lines.push('');
  rounds.forEach(function(x, i){
    lines.push((i + 1) + '. ' + tableLabel(x.table) + ' — ' + x.roundScore + '% (there ' + x.routeScore +
      '%, back ' + x.returnScore + '%, plating ' + x.placementCorrect + '/' + x.placementTotal + ')');
  });
  lines.push('');
  lines.push('Completed: ' + new Date().toLocaleString());
  return lines.join('\n');
}

// ---- Floor-plan renderer — a single static blueprint of the whole
// restaurant, drawn once at its true scale (no camera, no per-room panels).
// Thin outlines, table/counter shapes in their real position, table numbers
// hidden while a forward leg is still live so staff have to recognise the
// table rather than read it off. The server's position is just a dot the
// X/Y sliders push around; floorPointBlocked() (above) is built from this
// exact same geometry, so a wall or table drawn here is a wall or table the
// sliders really can't drag the dot through.
function svgZoneShape(z){
  var x0 = z.x - z.w / 2, y0 = z.y - z.h / 2;
  return '<rect class="bp-zone bp-zone-' + z.kind + '" x="' + x0 + '" y="' + y0 + '" width="' + z.w + '" height="' + z.h + '" rx="1"></rect>';
}
function svgZoneLabel(z){
  if (z.key === 'bar-top' || z.key === 'bar-return') return ''; // one "Bar" label on the whole counter is enough — drawn on the 'bar' zone
  // The 60s/50s/40s/30s table columns pack every row edge-to-edge with no
  // gap anywhere in the column, so a "Tables NN–NN" heading always lands on
  // top of a table no matter where it's placed (see _zone_label_y in
  // data.py, which already hunts for the single least-cramped spot and
  // still can't find a clean one here). Simplest real fix: no heading at
  // all — a server finds a specific table by its own number on arrival,
  // not by which section it's in.
  if (z.key === 'd61' || z.key === 'd51' || z.key === 'd41' || z.key === 'd30') return '';
  var lx = (typeof z.labelX === 'number') ? z.labelX : z.x;
  var ly = (typeof z.labelY === 'number') ? z.labelY : (z.y - z.h / 2 + 3);
  return '<text class="bp-zone-label" x="' + lx + '" y="' + ly + '" text-anchor="middle">' + esc(z.name) + '</text>';
}
function svgTableShape(t, hideNum, isTarget){
  var fourTop = t.seats.length >= 4;
  var label = hideNum ? '•' : esc(t.id);
  var cls = 'bp-table' + (isTarget ? ' bp-table-target' : '');
  // Tables 61-64 are booth seating in the real room, not a round 4-top —
  // square, same footprint (5.4x5.4) as a plain fourTop's own collision box
  // in FLOOR_OBSTACLES above, so this is purely a rendering change.
  var shape = t.booth
    ? '<rect class="' + cls + ' bp-table-booth" x="' + (t.x - 2.7) + '" y="' + (t.y - 2.7) + '" width="5.4" height="5.4" rx="0.8"></rect>'
    : (fourTop
      ? '<circle class="' + cls + '" cx="' + t.x + '" cy="' + t.y + '" r="2.7"></circle>'
      : '<rect class="' + cls + '" x="' + (t.x - 2.7) + '" y="' + (t.y - 1.8) + '" width="5.4" height="3.6" rx="0.6"></rect>');
  return shape + '<text class="bp-table-label" x="' + t.x + '" y="' + (t.y + 0.9) + '" text-anchor="middle">' + label + '</text>';
}
// Most counters are wider than deep (bar-top, chef's-bar, server-counter)
// and draw as a horizontal slab with stools in a row below it. The 'bar'
// zone is the vertical leg of the real L-shaped bar (see data.py) — taller
// than it is wide — so it needs the whole thing turned 90°: a slab running
// the full height on one side, and stools running down the other side, one
// per seat along the counter's real length, instead of every stool packed
// into a sliver at the bottom. z.flip puts the slab on the far side of the
// stools instead of the near side — see data.py's 'bar' entry for why.
// Keep this in sync by hand with the matching obstacle shape in
// FLOOR_OBSTACLES above — the solid slab drawn here is exactly what the
// sliders can't drag the character through, so the two must always agree.
function svgCounterShape(z, seatCount){
  var x0 = z.x - z.w / 2, y0 = z.y - z.h / 2;
  var vertical = z.h > z.w;
  var parts;
  if (vertical){
    var barX0 = z.flip ? x0 + z.w * 0.5 : x0 + z.w * 0.08, barW = z.w * 0.42;
    parts = '<rect class="bp-counter" x="' + barX0 + '" y="' + y0 + '" width="' + barW + '" height="' + z.h + '"></rect>';
    parts += '<rect class="bp-counter-top" x="' + (barX0 + 0.3) + '" y="' + (y0 + 0.3) + '" width="' + (barW - 0.6) + '" height="' + (z.h - 0.6) + '"></rect>';
    var padV = z.h * 0.08, usableV = z.h - padV * 2;
    var seatX = z.flip ? x0 + z.w * 0.26 : x0 + z.w * 0.74;
    for (var j = 0; j < seatCount; j++){
      var sy = y0 + padV + (seatCount <= 1 ? usableV / 2 : usableV * (j / (seatCount - 1)));
      parts += '<circle class="bp-stool" cx="' + seatX + '" cy="' + sy + '" r="0.85"></circle>';
    }
  } else {
    var barY0 = z.flip ? y0 + z.h * 0.5 : y0 + z.h * 0.08, barH = z.h * 0.42;
    parts = '<rect class="bp-counter" x="' + x0 + '" y="' + barY0 + '" width="' + z.w + '" height="' + barH + '"></rect>';
    // A thin brass inset line along the counter's own top edge — a nod to
    // the real bar's brass-trimmed marble top, not just a flat wood slab.
    parts += '<rect class="bp-counter-top" x="' + (x0 + 0.3) + '" y="' + (barY0 + 0.3) + '" width="' + (z.w - 0.6) + '" height="' + (barH - 0.6) + '"></rect>';
    var pad = z.w * 0.08, usable = z.w - pad * 2;
    var seatY = z.flip ? y0 + z.h * 0.26 : y0 + z.h * 0.74;
    for (var i = 0; i < seatCount; i++){
      var sx = x0 + pad + (seatCount <= 1 ? usable / 2 : usable * (i / (seatCount - 1)));
      parts += '<circle class="bp-stool" cx="' + sx + '" cy="' + seatY + '" r="0.85"></circle>';
    }
  }
  return parts;
}
// Seat counts per counter zone — the real bar's 14 seats split across its
// two segments (5 along the front wall, 9 down the side); the server
// counter is a staff station, not guest seating, so it gets none.
var COUNTER_SEAT_COUNTS = { 'bar-top': 5, 'bar': 9, 'chefs-bar': CHEFS_BAR_SEATS.length, 'server-counter': 0 };
function svgZoneFixture(z){
  if (z.kind === 'dining' || z.kind === 'patio') return '';
  if (z.kind === 'counter') return svgCounterShape(z, COUNTER_SEAT_COUNTS[z.key] || 0);
  if (z.kind === 'kitchen'){
    var x0 = z.x - z.w / 2, y0 = z.y - z.h / 2;
    return '<rect class="bp-pass-edge" x="' + x0 + '" y="' + y0 + '" width="' + z.w + '" height="1.8"></rect>';
  }
  if (z.kind === 'podium') return '<rect class="bp-podium" x="' + (z.x - 3.8) + '" y="' + (z.y - 2.9) + '" width="7.6" height="5.8" rx="0.6"></rect>';
  if (z.kind === 'door') return '<rect class="bp-door" x="' + (z.x - z.w / 2) + '" y="' + (z.y - z.h / 2) + '" width="' + z.w + '" height="' + z.h + '" rx="0.6"></rect>';
  return '';
}
// A "dynamic glass window" onto the real-proportioned floor plan: the
// visible viewBox is a fixed-size CAMERA_W x CAMERA_H crop that follows
// the character, Among-Us style, instead of showing the whole (taller
// than wide) building shrunk to fit. By default the crop is also capped
// so the patio and the lounge — off to the east and north respectively —
// stay off-screen; the cap relaxes smoothly as the character actually
// walks toward either one, revealing it rather than showing it from the
// start. North/south and the washrooms side use plain centred clamping.
//
// The reveal caps used to be hard limits, which could pin the character
// right up against the edge of the frame for a while (e.g. anywhere in
// the bar/lounge before LOUNGE_UNLOCK_Y, the window was pushed as far
// down as topCap allowed, however far that was from true centre). Now
// each cap only gets to push the window away from dead-centre by up to
// REVEAL_PUSH_X/Y, so the character stays within a steady band around the
// middle of the screen at all times — the floor plan still slides to
// reveal more of wherever they're headed, there's just a ceiling on how
// far off-centre that reveal is allowed to shove them.
var CAMERA_W = 60, CAMERA_H = 72;
var PATIO_UNLOCK_X = 70, PATIO_HIDE_EDGE = 73;
var LOUNGE_UNLOCK_Y = 58, LOUNGE_HIDE_EDGE = 50;
var REVEAL_PUSH_X = CAMERA_W * 0.27, REVEAL_PUSH_Y = CAMERA_H * 0.25;
function lerp(a, b, t){ return a + (b - a) * Math.max(0, Math.min(1, t)); }
function floorCamera(charX, charY){
  var camX0 = charX - CAMERA_W / 2;
  var camY0 = charY - CAMERA_H / 2;
  var rightCap = charX <= PATIO_UNLOCK_X ? PATIO_HIDE_EDGE
    : lerp(PATIO_HIDE_EDGE, WORLD_W, (charX - PATIO_UNLOCK_X) / (WORLD_W - PATIO_UNLOCK_X));
  var camXCapped = Math.min(camX0, Math.max(0, rightCap - CAMERA_W));
  var camX = Math.max(camXCapped, camX0 - REVEAL_PUSH_X);
  camX = Math.max(0, Math.min(WORLD_W - CAMERA_W, camX));
  var topCap = charY >= LOUNGE_UNLOCK_Y ? LOUNGE_HIDE_EDGE
    : lerp(LOUNGE_HIDE_EDGE, 0, (LOUNGE_UNLOCK_Y - charY) / LOUNGE_UNLOCK_Y);
  var camYCapped = Math.max(camY0, topCap);
  var camY = Math.min(camYCapped, camY0 + REVEAL_PUSH_Y);
  camY = Math.max(0, Math.min(WORLD_H - CAMERA_H, camY));
  return [Math.round(camX * 10) / 10, Math.round(camY * 10) / 10];
}
// The real building isn't a plain rectangle — the lounge/bar sits in a
// narrower upper section (see FLOOR_WALLS's "notch" in data.py), so the
// outline is a traced path, not a <rect>, with that corner cut away.
var FLOOR_NOTCH = (function(){
  for (var i = 0; i < FLOOR_WALLS.length; i++){ if (FLOOR_WALLS[i].key === 'notch') return FLOOR_WALLS[i]; }
  return null;
})();
function svgBuildingOutline(){
  if (!FLOOR_NOTCH) return '<rect class="bp-building" x="1" y="1" width="' + (WORLD_W - 2) + '" height="' + (WORLD_H - 2) + '" rx="2"></rect>';
  var nx = FLOOR_NOTCH.x1, ny = FLOOR_NOTCH.y1;
  var d = 'M ' + nx + ' 1 L ' + (WORLD_W - 1) + ' 1 L ' + (WORLD_W - 1) + ' ' + (WORLD_H - 1) +
    ' L 1 ' + (WORLD_H - 1) + ' L 1 ' + ny + ' L ' + nx + ' ' + ny + ' Z';
  return '<path class="bp-building" d="' + d + '"></path>';
}
// Load-bearing walls (east divider with its three real door gaps) drawn
// as solid dark-wood bars — distinct from the thin cream zone outlines,
// so it actually reads as something the character can't just stroll
// through, door gaps included.
function svgWallShape(w){
  return '<rect class="bp-wall" x="' + w.x0 + '" y="' + w.y0 + '" width="' + (w.x1 - w.x0) + '" height="' + (w.y1 - w.y0) + '"></rect>';
}
// A small illustrated Folietta server — mustache, dark hair, burgundy vest
// with gold buttons — standing in for the plain dot the character used to
// be. Everything is drawn in local coordinates around (0,0) and the whole
// group is positioned with a transform, so moving the character is just
// updating that one transform (see the slider-drag handler below), not
// juggling cx/cy on a shape. Kept deliberately simple (a handful of circles
// and one rounded body shape) since at the map's zoom level — a few dozen
// screen pixels across — anything finer than that just turns to mush.
function svgCharacterIcon(x, y){
  return '<g class="floor-char" id="floor-char-dot" transform="translate(' + x + ',' + y + ')">' +
    '<ellipse class="floor-char-shadow" cx="0" cy="1.95" rx="1.7" ry="0.5"></ellipse>' +
    '<circle class="floor-char-hair" cx="0" cy="-2.5" r="1.05"></circle>' +
    '<rect class="floor-char-body" x="-1.3" y="-0.9" width="2.6" height="2.75" rx="1.1"></rect>' +
    '<circle class="floor-char-button" cx="0" cy="-0.1" r="0.17"></circle>' +
    '<circle class="floor-char-button" cx="0" cy="0.65" r="0.17"></circle>' +
    '<circle class="floor-char-head" cx="0" cy="-1.95" r="1.25"></circle>' +
    '<ellipse class="floor-char-stache" cx="-0.48" cy="-1.55" rx="0.5" ry="0.2" transform="rotate(-18 -0.48 -1.55)"></ellipse>' +
    '<ellipse class="floor-char-stache" cx="0.48" cy="-1.55" rx="0.5" ry="0.2" transform="rotate(18 0.48 -1.55)"></ellipse>' +
  '</g>';
}
function svgFloorBlueprint(hideTableNumbers, targetTable, charX, charY, trailPath){
  var cam = floorCamera(charX, charY);
  var svg = '<svg viewBox="' + cam[0] + ' ' + cam[1] + ' ' + CAMERA_W + ' ' + CAMERA_H + '" class="floor-map-svg" id="floor-map-svg" preserveAspectRatio="xMidYMid meet">';
  svg += svgBuildingOutline();
  FLOOR_ZONES.forEach(function(z){ svg += svgZoneShape(z); });
  FLOOR_ZONES.forEach(function(z){ svg += svgZoneFixture(z); });
  FLOOR_TABLES.forEach(function(t){ svg += svgTableShape(t, hideTableNumbers, !hideTableNumbers && !!(targetTable && targetTable.id === t.id)); });
  FLOOR_WALLS.forEach(function(w){ if (w.key === 'east-wall') svg += svgWallShape(w); });
  var pts = trailPath.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  svg += '<polyline class="floor-trail" id="floor-trail" points="' + pts + '"></polyline>';
  svg += svgCharacterIcon(charX, charY);
  // Zone labels are drawn LAST (on top of tables, the trail and the
  // character) so the name of whatever a server is standing next to or
  // walking through stays legible instead of getting covered by the
  // character icon — easy to happen since labels sit right where a
  // player would naturally park themselves to interact with a counter.
  FLOOR_ZONES.forEach(function(z){ svg += svgZoneLabel(z); });
  svg += '</svg>';
  return svg;
}
// The map (left) plus the two drag sliders — X along the bottom, Y along
// the right — that are the ONLY way the character moves now. Sliders carry
// the live x/y so a fresh render always starts them exactly where the
// character actually is.
function renderFloorStage(x, y, hideNum, targetTable, trailPath){
  var svg = svgFloorBlueprint(hideNum, targetTable, x, y, trailPath);
  return '<div class="floor-stage">' +
    '<div class="floor-map-wrap" id="floor-map-wrap">' + svg + '</div>' +
    '<div class="floor-slider-y-wrap"><input type="range" class="floor-slider" id="floor-slider-y" data-axis="y" ' +
      'min="2" max="' + (WORLD_H - 2) + '" step="0.5" value="' + y + '" aria-label="Move up or down"></div>' +
    '<div class="floor-slider-x-wrap"><input type="range" class="floor-slider" id="floor-slider-x" data-axis="x" ' +
      'min="2" max="' + (WORLD_W - 2) + '" step="0.5" value="' + x + '" aria-label="Move left or right"></div>' +
  '</div>';
}

// ---------------------------------------------------------------------
// Layout Editor — drag-to-reposition view of the whole floor plan (see
// EDITOR_ENABLED above). Shows the full WORLD_W x WORLD_H map at once
// (no camera crop, no character) with every counter and table wrapped in
// a draggable <g>; dragging updates EDIT_STATE's per-item (dx,dy) offset,
// which the export JSON below bakes into new x/y values. Reuses the exact
// same zone/table-shape renderers as the live game, so what's dragged here
// looks exactly like what's actually on the floor.
// ---------------------------------------------------------------------
function svgLayoutEditorBlueprint(){
  var svg = '<svg viewBox="0 0 ' + WORLD_W + ' ' + WORLD_H + '" class="layout-editor-svg" id="layout-editor-svg" preserveAspectRatio="xMidYMid meet">';
  svg += svgBuildingOutline();
  FLOOR_ZONES.forEach(function(z){
    var off = EDIT_STATE.zones[z.key] || { dx: 0, dy: 0 };
    svg += '<g class="edit-draggable" data-editkind="zone" data-editkey="' + esc(z.key) + '" transform="translate(' + off.dx + ',' + off.dy + ')">' +
      svgZoneShape(z) + svgZoneFixture(z) + svgZoneLabel(z) + '</g>';
  });
  FLOOR_TABLES.forEach(function(t){
    var off = EDIT_STATE.tables[t.id] || { dx: 0, dy: 0 };
    svg += '<g class="edit-draggable" data-editkind="table" data-editkey="' + esc(String(t.id)) + '" transform="translate(' + off.dx + ',' + off.dy + ')">' +
      svgTableShape(t, false, false) + '</g>';
  });
  FLOOR_WALLS.forEach(function(w){ if (w.key === 'east-wall') svg += svgWallShape(w); });
  svg += '</svg>';
  return svg;
}
// Only the items actually moved from their data.py position — keeps the
// "Changes" panel and the exported JSON short and easy to read back.
function editLayoutChanges(){
  var zones = [], tables = [];
  FLOOR_ZONES.forEach(function(z){
    var off = EDIT_STATE.zones[z.key];
    if (off && (off.dx || off.dy)){
      zones.push({ key: z.key, name: z.name, x: Math.round((z.x + off.dx) * 10) / 10, y: Math.round((z.y + off.dy) * 10) / 10 });
    }
  });
  FLOOR_TABLES.forEach(function(t){
    var off = EDIT_STATE.tables[t.id];
    if (off && (off.dx || off.dy)){
      tables.push({ id: t.id, x: Math.round((t.x + off.dx) * 10) / 10, y: Math.round((t.y + off.dy) * 10) / 10 });
    }
  });
  return { zones: zones, tables: tables };
}
function editLayoutJSON(){
  var changes = editLayoutChanges();
  var out = { zones: {}, tables: {} };
  changes.zones.forEach(function(z){ out.zones[z.key] = { x: z.x, y: z.y }; });
  changes.tables.forEach(function(t){ out.tables[t.id] = { x: t.x, y: t.y }; });
  return JSON.stringify(out, null, 2);
}
function viewLayoutEditor(){
  var html = topbar('Layout Editor', 'home');
  html += '<div class="card"><h2>Drag things into place</h2>' +
    '<p class="small muted">Admin tool, not part of the staff game. Drag any counter or table on the map below to where it should actually be. ' +
    'When it looks right, copy the layout JSON and send it back so the change can be made exactly — no more guessing from a screenshot.</p></div>';
  html += '<div class="layout-editor-wrap" id="layout-editor-wrap">' + svgLayoutEditorBlueprint() + '</div>';
  var changes = editLayoutChanges();
  var count = changes.zones.length + changes.tables.length;
  html += '<div class="card"><h2>Changes' + (count ? ' (' + count + ')' : '') + '</h2>';
  if (!count){
    html += '<p class="small muted">Nothing moved yet &mdash; drag a counter or table above.</p>';
  } else {
    changes.zones.forEach(function(z){
      html += '<p class="small">' + esc(z.name) + ' <span class="muted">(' + esc(z.key) + ')</span> &rarr; x ' + z.x + ', y ' + z.y + '</p>';
    });
    changes.tables.forEach(function(t){
      html += '<p class="small">Table ' + esc(String(t.id)) + ' &rarr; x ' + t.x + ', y ' + t.y + '</p>';
    });
  }
  var json = editLayoutJSON();
  html += '<div class="btn-row">' +
    '<button class="btn ghost" data-action="copy-layout-json">Copy layout JSON</button>' +
    (downloadsCap ? '<button class="btn ghost" data-action="download-layout-json">Download .json</button>' : '') +
    '<button class="btn ghost" data-action="reset-layout"' + (count ? '' : ' disabled') + '>Reset all</button>' +
    '</div>';
  html += '<textarea class="layout-json-box" id="layout-json-box" readonly rows="6">' + esc(json) + '</textarea>';
  html += '</div>';
  return html;
}

function renderDishTray(r){
  var html = '<div class="plate-tray">';
  r.dishes.forEach(function(d){
    var at = r.placed[d.id];
    var armed = r.armedDish === d.id;
    html += '<button class="plate-chip' + (armed ? ' armed' : '') + (at ? ' placed' : '') + '" data-action="tap-dish" data-dish="' + d.id + '">' +
      '<span class="plate-icon">&#127860;</span><span class="plate-name">' + esc(d.name) + '</span>' +
      '<span class="plate-where' + (at ? '' : ' muted') + '">' + (at ? (at === 'shared' ? 'Centre' : 'Seat ' + at.replace('seat-', '')) : 'Tap, then tap a spot') + '</span></button>';
  });
  html += '</div>';
  return html;
}
function renderTableDiagram(table, placed){
  if (table.isCounter){
    var h1 = '<div class="table-diagram"><div class="counter-row">';
    table.seats.forEach(function(s){
      var key = 'seat-' + s;
      var filled = Object.keys(placed).some(function(id){ return placed[id] === key; });
      h1 += '<button class="seat-slot' + (filled ? ' filled' : '') + '" data-action="place-at" data-target="' + key + '">' +
        '<span class="seat-num">' + s + '</span>' + (filled ? '<span class="seat-plate">&#127860;</span>' : '') + '</button>';
    });
    h1 += '</div></div>';
    return h1;
  }
  var fourTop = table.seats.length === 4;
  var h2 = '<div class="table-diagram"><div class="table-shape ' + (fourTop ? 'four-top' : 'two-top') + '">';
  var centreCount = Object.keys(placed).filter(function(id){ return placed[id] === 'shared'; }).length;

function floorLegSummaryLine(m, lead, wrongNoun){
  if (!m) return '';
  var bits = [];
  bits.push(Math.round(m.efficiency * 100) + '% direct path');
  bits.push(m.elapsedSec.toFixed(1) + 's');
  bits.push(m.reversals ? m.reversals + ' backtrack' + (m.reversals === 1 ? '' : 's') : 'no backtracking');
  if (m.wrongCount) bits.push(m.wrongCount + ' wrong ' + wrongNoun + (m.wrongCount === 1 ? '' : 's') + ' along the way');
  return '<p class="small">On the way ' + lead + ': ' + bits.join(', ') + '.</p>';
}

function render(){
  var app = document.getElementById('app');
  app.innerHTML = '<div class="view-enter">' + (VIEWS[state.view] || viewIdentify)() + '</div>';
  var si = document.getElementById('roster-search');
  if (si){
    si.focus();
    var len = si.value.length;
    try { si.setSelectionRange(len, len); } catch(e){}
  }
  var pi = document.getElementById('pin-input');
  if (pi){ pi.focus(); }
  // The Y slider is a horizontal <input type=range> rotated on its side —
  // its native track length becomes the map's rendered height, which we
  // only know after layout, so size it here rather than in CSS.
  var ySlider = document.getElementById('floor-slider-y');
  var mapWrap = document.getElementById('floor-map-wrap');
  if (ySlider && mapWrap){ ySlider.style.width = mapWrap.clientHeight + 'px'; }
}
// Drags the character along one axis toward the slider's new value,
// stopping at the nearest wall/table in the way, records a path sample,
// and checks for arrival — all without a full render() so native slider
// dragging stays smooth. Only arriving (which changes the whole card)
// triggers a real render().
function handleFloorSliderInput(e){
  var axis = e.target.getAttribute('data-axis');
  var isReturn = state.view === 'floorReturn';
  if (!isReturn && state.view !== 'floorRoute') return;
  var r = state.round;
  if (isReturn ? r.rArrived : r.fArrived) return;

  var desired = parseFloat(e.target.value);
  var oldX = isReturn ? r.rx : r.fx, oldY = isReturn ? r.ry : r.fy;
  var newVal = floorStepAxis(oldX, oldY, desired, axis);
  e.target.value = newVal; // snap the thumb back if a wall/table blocked it
  var newX = axis === 'x' ? newVal : oldX;
  var newY = axis === 'y' ? newVal : oldY;
  if (isReturn){ r.rx = newX; r.ry = newY; } else { r.fx = newX; r.fy = newY; }

  var path = isReturn ? r.rPath : r.fPath;
  var last = path[path.length - 1];
  var moved = Math.sqrt(Math.pow(newX - last[0], 2) + Math.pow(newY - last[1], 2));
  if (moved >= 1.2) path.push([newX, newY]);

  var dot = document.getElementById('floor-char-dot');
  if (dot){ dot.setAttribute('transform', 'translate(' + newX + ',' + newY + ')'); }
  var trail = document.getElementById('floor-trail');
  if (trail){ trail.setAttribute('points', path.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ')); }
  // Keep the glass-window camera glued to the character while dragging —
  // same direct-DOM approach as the dot/trail above, no full render().
  var svgEl = document.getElementById('floor-map-svg');
  if (svgEl){
    var cam = floorCamera(newX, newY);
    svgEl.setAttribute('viewBox', cam[0] + ' ' + cam[1] + ' ' + CAMERA_W + ' ' + CAMERA_H);
  }

  if (!isReturn){
    FLOOR_TARGETS.forEach(function(t){
      if (t.id === r.table.id || r.fWrongSeen[t.id]) return;
      if (floorIsAtTarget(newX, newY, t)){ r.fWrongSeen[t.id] = true; r.fWrongCount++; }
    });
  } else if (!r.rWrongSeenCold){
    var cold = ZONE['pickup-cold'], cx0 = cold.x - cold.w / 2, cy0 = cold.y - cold.h / 2;
    if (newX >= cx0 && newX <= cx0 + cold.w && newY >= cy0 && newY <= cy0 + cold.h){
      r.rWrongSeenCold = true; r.rWrongCount++;
    }
  }

  var target = isReturn ? { id: 'pickup-hot' } : r.table;
  if (floorIsAtTarget(newX, newY, target)){
    if (isReturn){
      r.rArrived = true;
      r.rMetrics = floorLegMetrics(r.rPath, r.rStart, floorTargetPoint(target), Date.now() - r.rStartTime, r.rWrongCount);
    } else {
      r.fArrived = true;
      r.fMetrics = floorLegMetrics(r.fPath, r.fStart, floorTargetPoint(r.table), Date.now() - r.fStartTime, r.fWrongCount);
    }
    burstConfetti({ count: 20, duration: 700 });
    render();
  }
}

// ---------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------
// Several buttons on the Courses page (changing course count, opening a
// different course's beverage picker, assigning a dish) and on the Group
// Menu page (toggling another dish) trigger a full re-render — which would
// silently wipe out a "glasses needed" or order-quantity number someone
// just typed but hasn't navigated away from yet, since the next render
// rebuilds those inputs from state, not from what's currently in the DOM.
// Syncing into state right before whatever action is about to run (every
// click on these views, not just navigation) means a typed value survives
// even when the click that wipes the DOM is for an unrelated course/dish.
function syncGlassesInputs(){
  var pairings = state.beveragePairings;
  if (!pairings) return;
  Object.keys(pairings).forEach(function(c){
    var inp = document.getElementById('glasses-course-' + c);
    if (inp){
      var v = parseInt(inp.value, 10);
      pairings[c].glasses = isNaN(v) ? null : v;
    }
  });
}
function syncGroupQtyInputs(){
  var sel = state.selected;
  if (!sel) return;
  state.groupQty = state.groupQty || {};
  sel.forEach(function(id){
    var inp = document.getElementById('group-qty-' + id);
    if (inp){
      var v = parseInt(inp.value, 10);
      state.groupQty[id] = isNaN(v) ? null : v;
    }
  });
}
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');

  if (state.view === 'dinnerCoursePairings') syncGlassesInputs();
  if (state.view === 'groupMenuBuild') syncGroupQtyInputs();

  if (action === 'go'){
    go(el.getAttribute('data-view'));
  } else if (action === 'pick-name'){
    state.pendingName = el.getAttribute('data-name');
    state.pinError = null;
    render();
  } else if (action === 'back-to-search'){
    state.pendingName = null;
    state.pinError = null;
    render();
  } else if (action === 'confirm-pin'){
    submitPin((document.getElementById('pin-input') || {}).value || '');
  } else if (action === 'switch-player'){
    clearLocal(ID_KEY); clearLocal(NAME_KEY);
    go('identify', { search: '' });
  } else if (action === 'pick-scenario'){
    // Beverage orders for the seats come first now — before any food is
    // picked — since all this step needs is the scenario's seat count.
    var scPicked = SCENARIOS.filter(function(s){ return s.id === el.getAttribute('data-id'); })[0];
    go('dinnerSeatBeverages', {
      scenarioId: el.getAttribute('data-id'),
      allergySeats: scPicked ? rollAllergySeats(scPicked) : [],
      seatBeverages: {}, seatNoBeverage: {}
    });
  } else if (action === 'continue-to-food-select'){
    // Carries forward whatever's already picked rather than resetting —
    // on first entry from pick-scenario these are all blank anyway, but a
    // staff member who goes back to edit drink orders and then forward
    // again should find their dish picks (and seating/mods) untouched.
    var scForFood = SCENARIOS.filter(function(s){ return s.id === state.scenarioId; })[0];
    if (scForFood && scForFood.groupMenuPrice){
      go('groupMenuBuild', {
        scenarioId: state.scenarioId, selected: state.selected || [],
        dishMods: state.dishMods || {}, modOptionOrder: state.modOptionOrder || {},
        seating: state.seating || {}, allergySeats: state.allergySeats || [], modStepIndex: 0,
        groupCandidates: state.groupCandidates || buildGroupCandidates(scForFood.groupMenuPrice), groupQty: state.groupQty || {},
        seatBeverages: state.seatBeverages || {}, seatNoBeverage: state.seatNoBeverage || {}
      });
    } else {
      go('dinnerBuild', {
        scenarioId: state.scenarioId, selected: state.selected || [], activeCat: 'all',
        dishMods: state.dishMods || {}, modOptionOrder: state.modOptionOrder || {},
        seating: state.seating || {}, allergySeats: state.allergySeats || [], modStepIndex: 0,
        seatBeverages: state.seatBeverages || {}, seatNoBeverage: state.seatNoBeverage || {}
      });
    }
  } else if (action === 'back-to-seat-beverages'){
    // Carries the in-progress dish picks forward too (even though this view
    // doesn't show them) so continue-to-food-select can restore them rather
    // than starting the food step over.
    go('dinnerSeatBeverages', {
      scenarioId: state.scenarioId, allergySeats: state.allergySeats || [],
      seatBeverages: state.seatBeverages || {}, seatNoBeverage: state.seatNoBeverage || {},
      selected: state.selected || [], dishMods: state.dishMods || {}, modOptionOrder: state.modOptionOrder || {},
      seating: state.seating || {}, groupQty: state.groupQty || {}, groupCandidates: state.groupCandidates || null
    });
  } else if (action === 'filter-cat'){
    state.activeCat = el.getAttribute('data-cat');
    render();
  } else if (action === 'toggle-item'){
    var id = el.getAttribute('data-id');
    var sel = state.selected || [];
    var i = sel.indexOf(id);
    if (i === -1){
      sel.push(id);
      // Pre-shuffle this dish's mod-option order once, on the way in, so it
      // doesn't reshuffle under the staff member's thumb on every render.
      var scForMod = SCENARIOS.filter(function(s){ return s.id === state.scenarioId; })[0];
      var itForMod = ITEM[id];
      var modForMod = scForMod && itForMod ? dishMod(itForMod, scForMod.restriction) : null;
      if (modForMod){
        state.modOptionOrder = state.modOptionOrder || {};
        state.modOptionOrder[id] = shuffle(modForMod.options);
      }
    } else {
      sel.splice(i, 1);
      if (state.dishMods) delete state.dishMods[id];
      if (state.modOptionOrder) delete state.modOptionOrder[id];
      if (state.seating) delete state.seating[id];
      if (state.groupQty) delete state.groupQty[id];
    }
    state.selected = sel;
    render();
  } else if (action === 'choose-mod'){
    var modDishId = el.getAttribute('data-id');
    var modOpt = el.getAttribute('data-opt');
    state.dishMods = state.dishMods || {};
    state.dishMods[modDishId] = modOpt;
    render();
  } else if (action === 'set-seat'){
    var seatDishId = el.getAttribute('data-id');
    var seatVal = el.getAttribute('data-seat');
    state.seating = state.seating || {};
    state.seating[seatDishId] = seatVal === 'shared' ? 'shared' : parseInt(seatVal, 10);
    render();
  } else if (action === 'submit-dinner'){
    go('dinnerSeating', {
      scenarioId: state.scenarioId, selected: state.selected || [],
      dishMods: state.dishMods || {}, modOptionOrder: state.modOptionOrder || {},
      seating: state.seating || {}, allergySeats: state.allergySeats || [], modStepIndex: 0,
      seatBeverages: state.seatBeverages || {}, seatNoBeverage: state.seatNoBeverage || {}
    });
  } else if (action === 'submit-group-dinner'){
    // syncGroupQtyInputs() already ran above, so state.groupQty reflects
    // whatever's currently typed.
    go('dinnerSeating', {
      scenarioId: state.scenarioId, selected: state.selected || [],
      dishMods: state.dishMods || {}, modOptionOrder: state.modOptionOrder || {},
      seating: state.seating || {}, allergySeats: state.allergySeats || [], modStepIndex: 0,
      groupCandidates: state.groupCandidates || {}, groupQty: state.groupQty || {},
      seatBeverages: state.seatBeverages || {}, seatNoBeverage: state.seatNoBeverage || {}
    });
  } else if (action === 'back-to-dinner-build'){
    var scForBack = SCENARIOS.filter(function(s){ return s.id === state.scenarioId; })[0];
    if (scForBack && scForBack.groupMenuPrice){

// ---------------------------------------------------------------------
// Wine Tour card-deck swiping — a plain horizontal touch-swipe over the
// deck advances/retreats a card, on top of the tap-to-navigate arrows and
// dots already wired through the click dispatcher above. Deliberately
// simple (no live drag-follow-the-finger animation): capture the start
// point, and on release, a long-enough and mostly-horizontal drag moves
// one card in that direction.
// ---------------------------------------------------------------------
var wineSwipeStartX = null, wineSwipeStartY = null;
document.addEventListener('touchstart', function(e){
  var deckEl = e.target.closest && e.target.closest('.wine-deck');
  if (!deckEl || !e.touches || !e.touches[0]) return;
  wineSwipeStartX = e.touches[0].clientX;
  wineSwipeStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', function(e){
  if (wineSwipeStartX == null) return;
  var startX = wineSwipeStartX, startY = wineSwipeStartY;
  wineSwipeStartX = null; wineSwipeStartY = null;
  var t = e.changedTouches && e.changedTouches[0];
  if (!t) return;
  var dx = t.clientX - startX, dy = t.clientY - startY;
  if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.2) return; // too short, or more vertical than horizontal
  var wsStop = WINE_TOUR_STOPS[state.wineStopIndex || 0];
  if (!wsStop || state.view !== 'wineStop') return;
  var wsMax = buildWineDeck(wsStop).length - 1;
  if (dx < 0) state.wineCardIndex = Math.min(wsMax, (state.wineCardIndex || 0) + 1); // swiped left -> next
  else state.wineCardIndex = Math.max(0, (state.wineCardIndex || 0) - 1); // swiped right -> previous
  render();
}, { passive: true });

// ---------------------------------------------------------------------
// Layout Editor dragging — plain Pointer Events (covers mouse, touch and
// pen in one handler) rather than reusing the floor sliders, since here
// any item can move in any direction by any amount, not just the
// character along one axis at a time. editSvgPoint converts a raw
// clientX/clientY into the SVG's own user-space coordinates via its
// screen CTM, so the drag tracks 1:1 under the pointer regardless of how
// large the map is actually rendered on screen. Only the dragged item's
// own <g transform> is touched while dragging (cheap, smooth); the
// Changes panel and JSON export are refreshed once, on release.
// ---------------------------------------------------------------------
var editDrag = null;
function editSvgPoint(svgEl, clientX, clientY){
  var pt = svgEl.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  var ctm = svgEl.getScreenCTM();
  if (!ctm) return { x: 0, y: 0 };
  var loc = pt.matrixTransform(ctm.inverse());
  return { x: loc.x, y: loc.y };
}
document.addEventListener('pointerdown', function(e){
  var g = e.target.closest('.edit-draggable');
  if (!g) return;
  var svgEl = document.getElementById('layout-editor-svg');
  if (!svgEl) return;
  var kind = g.getAttribute('data-editkind');
  var key = g.getAttribute('data-editkey');
  var bucket = kind === 'zone' ? EDIT_STATE.zones : EDIT_STATE.tables;
  var off = bucket[key] || (bucket[key] = { dx: 0, dy: 0 });
  var p = editSvgPoint(svgEl, e.clientX, e.clientY);
  editDrag = { g: g, svgEl: svgEl, off: off, startPX: p.x, startPY: p.y, startDX: off.dx, startDY: off.dy };
  try { g.setPointerCapture(e.pointerId); } catch(err){}
  e.preventDefault();
});
document.addEventListener('pointermove', function(e){
  if (!editDrag) return;
  var p = editSvgPoint(editDrag.svgEl, e.clientX, e.clientY);
  var dx = Math.round((editDrag.startDX + (p.x - editDrag.startPX)) * 10) / 10;
  var dy = Math.round((editDrag.startDY + (p.y - editDrag.startPY)) * 10) / 10;
  editDrag.off.dx = dx; editDrag.off.dy = dy;
  editDrag.g.setAttribute('transform', 'translate(' + dx + ',' + dy + ')');
});
document.addEventListener('pointerup', function(e){
  if (!editDrag) return;
  try { editDrag.g.releasePointerCapture(e.pointerId); } catch(err){}
  editDrag = null;
  if (state.view === 'layoutEditor') render();
});

function submitPin(pin){
  var entry = ROSTER.filter(function(r){ return r.name === state.pendingName; })[0];
  if (entry && entry.pin === pin.trim()){
    setIdentity(state.pendingName);
    go('home');
  } else {
    state.pinError = 'That doesn\'t match our records — try again or ask your manager.';
    render();
  }
}

document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'roster-search'){
    state.search = e.target.value;
    render();
  } else if (e.target && e.target.id === 'pin-input'){
    var digits = e.target.value.replace(/\D/g, '').slice(0, 4);
    if (digits !== e.target.value) e.target.value = digits;
    if (digits.length === 4) submitPin(digits);
  } else if (e.target && e.target.classList && e.target.classList.contains('floor-slider')){
    handleFloorSliderInput(e);
  }
});

function goNextQuestion(){
  state.qIndex = (state.qIndex || 0) + 1;
  state.answeredThis = false;
  state.revealed = false;
  state.lastPicked = null;
  state.lastTyped = '';
  if (state.qIndex >= state.questions.length){
    go('quizResult', { answers: state.answers });
  } else {
    render();
  }
}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
render();
initCaps();

})();

</script>
