<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Folietta Arcade</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout concept: a phone-shaped "game cabinet" stack of chunky, drop-shadowed
   cards and candy buttons (level-select tiles, press-down CTAs, coin-style
   score medallions) over Folietta's cream/burgundy restaurant palette, with a
   warm gold "coin" accent reserved for game feedback (streaks, scores, wins). */
:root{
  --bg:#fdf3e3; --bg-elev:#fffdf9; --bg-sunk:#fbe6c4;
  --ink:#2a1a14; --ink-soft:#7a5c4c; --ink-faint:#ab8f7c;
  --line:#f0d6a8; --accent:#c21f2f; --accent-deep:#8c1521; --accent-ink:#ffffff;
  --gold:#f0a93a; --gold-deep:#c07d12; --gold-ink:#3a2205;
  --success:#2f9e5b; --success-deep:#1f7a44; --success-bg:#e2f6ea;
  --danger:#e2543a; --danger-deep:#b23c26; --danger-bg:#fde6de;
  --warn:#9c6f12; --warn-bg:#fbedcb;
  --shadow:0 3px 0 rgba(0,0,0,.08), 0 8px 18px rgba(80,40,20,0.14);
  --radius:18px;
  --font-display:'Baloo 2',ui-rounded,'Segoe UI',sans-serif;
  --font-body:'Nunito','Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1410; --bg-elev:#2a2019; --bg-sunk:#241a13;
    --ink:#f6ecdf; --ink-soft:#d2b8a2; --ink-faint:#92776590;
    --line:#43301f; --accent:#e8596a; --accent-deep:#a93848; --accent-ink:#241410;
    --gold:#f3bc5c; --gold-deep:#b9842a; --gold-ink:#241404;
    --success:#6cd392; --success-deep:#3fa368; --success-bg:#17301f;
    --danger:#f0815f; --danger-deep:#b2492c; --danger-bg:#3a2016;
    --warn:#e3c35f; --warn-bg:#352a12;
    --shadow:0 3px 0 rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1410; --bg-elev:#2a2019; --bg-sunk:#241a13;
  --ink:#f6ecdf; --ink-soft:#d2b8a2; --ink-faint:#927765;
  --line:#43301f; --accent:#e8596a; --accent-deep:#a93848; --accent-ink:#241410;
  --gold:#f3bc5c; --gold-deep:#b9842a; --gold-ink:#241404;
  --success:#6cd392; --success-deep:#3fa368; --success-bg:#17301f;
  --danger:#f0815f; --danger-deep:#b2492c; --danger-bg:#3a2016;
  --warn:#e3c35f; --warn-bg:#352a12;
  --shadow:0 3px 0 rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,0.45);
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
}
*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body);
  margin:0; min-height:100vh;
}
#app{max-width:780px; margin:0 auto; padding:18px 16px 60px; position:relative;}
@keyframes viewIn{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
.view-enter{animation:viewIn .32s cubic-bezier(.22,.9,.3,1.1);}
@keyframes popIn{0%{opacity:0; transform:scale(.6) rotate(-6deg);} 70%{opacity:1; transform:scale(1.08) rotate(2deg);} 100%{opacity:1; transform:scale(1) rotate(0);}}
@keyframes bounceIn{0%{transform:translateY(0);} 30%{transform:translateY(-6px);} 55%{transform:translateY(0);} 75%{transform:translateY(-3px);} 100%{transform:translateY(0);}}
@keyframes pulseGlow{0%,100%{transform:scale(1);} 50%{transform:scale(1.12);}}
@keyframes shimmer{0%{transform:translateX(-120%);} 100%{transform:translateX(220%);}}
.brand{font-family:'Brush Script MT','Segoe Script',cursive; color:var(--accent); font-size:34px; text-align:center; margin:4px 0 0;
  text-shadow:0 2px 0 rgba(0,0,0,.08);}
.tagline{text-align:center; color:var(--ink-soft); font-weight:700; font-size:12.5px; letter-spacing:.03em; text-transform:uppercase; margin:0 0 18px;}
h1{font-family:var(--font-display); font-size:21px; font-weight:800; margin:0 0 4px; text-wrap:balance;}
h2{font-family:var(--font-display); font-size:15px; font-weight:700; margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent);}
p{line-height:1.55;}
.card{
  background:var(--bg-elev); border:2px solid var(--line); border-radius:var(--radius);
  padding:17px; margin-bottom:14px; box-shadow:var(--shadow);
}
.btn{
  font-family:var(--font-display); font-size:14.5px; font-weight:700; border-radius:14px; border:none;
  background:var(--accent); color:var(--accent-ink); padding:13px 20px; cursor:pointer;
  -webkit-tap-highlight-color:transparent; box-shadow:0 4px 0 var(--accent-deep), 0 7px 14px rgba(0,0,0,.16);
  transform:translateY(-2px); transition:transform .08s ease, box-shadow .08s ease; position:relative;
}
.btn:active{transform:translateY(1px); box-shadow:0 1px 0 var(--accent-deep), 0 2px 6px rgba(0,0,0,.14);}
.btn.secondary{background:var(--bg-elev); color:var(--accent); box-shadow:0 4px 0 var(--line), 0 7px 14px rgba(0,0,0,.08); border:2px solid var(--line);}
.btn.secondary:active{box-shadow:0 1px 0 var(--line), 0 2px 6px rgba(0,0,0,.08);}
.btn.gold{background:var(--gold); color:var(--gold-ink); box-shadow:0 4px 0 var(--gold-deep), 0 7px 14px rgba(0,0,0,.16);}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-deep), 0 2px 6px rgba(0,0,0,.14);}
.btn.ghost{background:transparent; color:var(--ink-soft); border:2px solid var(--line); box-shadow:none; transform:none;}
.btn.ghost:active{transform:scale(.97);}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:translateY(-2px) !important;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
.tile{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  background:var(--bg-elev); border:2px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:12px; cursor:pointer; box-shadow:var(--shadow); font-family:inherit;
  transform:translateY(-2px); transition:transform .1s ease, box-shadow .1s ease;
}
.tile:active{transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,.08), 0 2px 6px rgba(80,40,20,.1);}
.tile .emoji{font-size:32px; flex:none; width:46px; height:46px; display:flex; align-items:center; justify-content:center;
  background:var(--bg-sunk); border-radius:13px;}
.tile .t-name{font-family:var(--font-display); font-size:16.5px; font-weight:700; margin:0 0 2px; color:var(--ink);}
.tile .t-desc{font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.4;}
.pill{display:inline-block; font-family:var(--font-display); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
  padding:3px 9px; border-radius:999px; color:#fff;}
.muted{color:var(--ink-soft); font-size:13px;}
.small{font-size:12px;}
input[type=text], textarea{
  width:100%; font-family:var(--font-body); font-weight:600; font-size:15px; padding:12px 14px; border-radius:13px;
  border:2px solid var(--line); background:var(--bg-sunk); color:var(--ink);
}
input[type=text]:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
textarea{min-height:70px; resize:vertical;}
.pin-field{font-family:var(--font-display); font-size:30px; font-weight:800; letter-spacing:.5em; text-align:center; padding:14px 12px 14px 20px;}
@keyframes shake{10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(3px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);}}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97); border-color:var(--danger-deep) !important;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
.topbar .back{background:var(--bg-elev); border:2px solid var(--line); color:var(--accent); font-family:var(--font-display);
  font-weight:700; font-size:13px; cursor:pointer; padding:7px 12px; border-radius:11px; box-shadow:0 3px 0 var(--line);}
.topbar .back:active{transform:translateY(2px); box-shadow:none;}
.streak-badge{display:inline-flex; align-items:center; gap:4px; font-family:var(--font-display); font-weight:800; font-size:13px;
  color:var(--gold-ink); background:linear-gradient(180deg,var(--gold),var(--gold-deep)); padding:6px 11px 6px 8px; border-radius:999px;
  box-shadow:0 3px 0 var(--gold-deep); white-space:nowrap;}
.streak-badge.pulse{animation:pulseGlow .35s ease;}
.progress{height:14px; background:var(--bg-sunk); border-radius:999px; overflow:hidden; margin-bottom:14px; border:2px solid var(--line); position:relative;}
.progress > div{height:100%; background:linear-gradient(90deg,var(--gold),var(--accent)); transition:width .35s cubic-bezier(.3,.8,.4,1); position:relative; border-radius:999px;}
.progress > div::after{content:'';position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); animation:shimmer 1.8s ease-in-out infinite;}
.item-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:480px){.item-grid{grid-template-columns:1fr;}}
.item-card{
  border:2px solid var(--line); border-radius:15px; padding:11px 12px; cursor:pointer; position:relative;
  background:var(--bg-elev); box-shadow:0 3px 0 rgba(0,0,0,.05); transition:transform .1s ease, box-shadow .1s ease, border-color .1s ease, background .1s ease;
}
.item-card:active{transform:translateY(2px); box-shadow:none;}
.item-card.selected{border-color:var(--success); background:var(--success-bg); box-shadow:0 3px 0 var(--success-deep);}
.item-card.selected::after{content:'✓'; position:absolute; top:-9px; right:-9px; width:24px; height:24px; border-radius:50%;
  background:var(--success); color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 0 var(--success-deep); animation:popIn .25s ease;}
.item-card .iname{font-family:var(--font-display); font-weight:700; font-size:13.5px; margin:4px 0 2px;}
.item-card .idesc{font-size:11px; color:var(--ink-soft); line-height:1.3;}
.item-card .iprice{float:right; font-family:var(--font-display); font-size:11.5px; font-weight:800; color:var(--gold-deep);}
.cat-tabs{display:flex; gap:7px; overflow-x:auto; padding-bottom:8px; margin-bottom:10px;}
.cat-tab{flex:none; font-family:var(--font-display); font-weight:700; font-size:11.5px; padding:7px 13px; border-radius:999px; border:2px solid var(--line);
  background:var(--bg-elev); color:var(--ink-soft); cursor:pointer; white-space:nowrap; box-shadow:0 2px 0 var(--line);}
.cat-tab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent-deep); box-shadow:0 2px 0 var(--accent-deep);}
.tray{position:sticky; bottom:0; background:var(--bg-elev); border-top:3px solid var(--accent); border-radius:18px 18px 0 0;
  margin:14px -16px -60px; padding:12px 16px 16px; box-shadow:0 -6px 18px rgba(0,0,0,.12);}
.tray-row{display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:3px 0;}
.tray-total{font-family:var(--font-display); font-weight:800; font-size:17px; border-top:2px dashed var(--line); margin-top:6px; padding-top:8px; color:var(--gold-deep);
  font-variant-numeric:tabular-nums;}
.checklist{list-style:none; padding:0; margin:0;}
.checklist li{padding:5px 0; font-size:13px; display:flex; gap:8px; align-items:baseline;}
.checklist li.ok{color:var(--success-deep);}
.checklist li.bad{color:var(--danger-deep);}
.badge-row{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0;}
.badge{font-family:var(--font-display); font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:7px; background:var(--bg-sunk); color:var(--ink-soft); border:1px solid var(--line);}
.score-circle{width:120px; height:120px; border-radius:50%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; margin:0 auto 14px; position:relative;
  background:radial-gradient(circle at 32% 28%, var(--gold) 0%, var(--gold-deep) 72%);
  box-shadow:0 6px 0 var(--gold-deep), 0 12px 22px rgba(0,0,0,.18); animation:popIn .45s cubic-bezier(.22,.9,.3,1.1);}
.score-circle .num{font-family:var(--font-display); font-size:30px; font-weight:800; color:var(--gold-ink); line-height:1; font-variant-numeric:tabular-nums;}
.score-circle .lbl{font-family:var(--font-display); font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-ink); opacity:.75; margin-top:2px;}
.q-options{display:flex; flex-direction:column; gap:9px; margin:14px 0;}
.q-opt{text-align:left; padding:13px 15px; border-radius:14px; border:2px solid var(--line);
  background:var(--bg-elev); cursor:pointer; font-family:var(--font-body); font-weight:700; font-size:14.5px; color:var(--ink);
  box-shadow:0 3px 0 var(--line); transition:transform .08s ease, box-shadow .08s ease;}
.q-opt:active{transform:translateY(2px); box-shadow:none;}
.q-opt.correct{border-color:var(--success-deep); background:var(--success-bg); box-shadow:0 3px 0 var(--success-deep); animation:bounceIn .4s ease;}
.q-opt.incorrect{border-color:var(--danger-deep); background:var(--danger-bg); box-shadow:0 3px 0 var(--danger-deep);}
.q-opt:disabled{cursor:default;}
.q-opt:disabled:active{transform:none;}
.q-opt.armed{border-color:var(--gold-deep); background:var(--bg-sunk); box-shadow:0 3px 0 var(--gold-deep);}
.order-slots{display:flex; flex-direction:column; gap:8px; margin:12px 0;}
.order-slot{display:flex; align-items:center; gap:12px; text-align:left; width:100%; padding:11px 14px; border-radius:14px;
  border:2px dashed var(--line); background:transparent; font-family:var(--font-body); font-weight:700; font-size:14px;
  color:var(--ink-faint); cursor:default;}
.order-slot .order-num{font-family:var(--font-display); font-weight:800; color:var(--gold-deep); width:18px; flex:none; text-align:center;}
.order-slot .order-val{flex:1;}
.order-slot.filled{border-style:solid; border-color:var(--gold-deep); background:var(--bg-elev); color:var(--ink); cursor:pointer; box-shadow:0 3px 0 var(--line);}
.order-slot.filled:active{transform:translateY(2px); box-shadow:none;}
.order-slot.correct{border-style:solid; border-color:var(--success-deep); background:var(--success-bg); color:var(--ink);}
.order-slot.incorrect{border-style:solid; border-color:var(--danger-deep); background:var(--danger-bg); color:var(--ink);}
.order-slot:disabled{opacity:1;}
.q-feedback{font-family:var(--font-display); font-weight:800; font-size:15px; margin:4px 0 0; display:flex; align-items:center; gap:6px; animation:popIn .3s ease;}
.q-feedback.good{color:var(--success-deep);}
.q-feedback.bad{color:var(--danger-deep);}
.flip-scene{perspective:1000px; margin:12px 0;}
.flashcard{position:relative; min-height:150px;}
.flashcard .fc-face{border:2px dashed var(--line); border-radius:16px; padding:22px; text-align:center;
  background:var(--bg-elev); box-shadow:var(--shadow); backface-visibility:hidden;
  transition:transform .5s cubic-bezier(.3,.9,.3,1.1); transform-style:preserve-3d;}
.flashcard .fc-front{transform:rotateY(0deg);}
.flashcard .fc-back{position:absolute; inset:0; transform:rotateY(180deg);}
.flashcard.flipped .fc-front{transform:rotateY(180deg);}
.flashcard.flipped .fc-back{transform:rotateY(360deg);}
.flashcard .fc-name{font-family:var(--font-display); font-size:20px; font-weight:800;}
.flashcard .fc-price{color:var(--gold-deep); font-family:var(--font-display); font-weight:700; font-size:13px; margin-bottom:10px;}
.flashcard .fc-line{font-weight:700; color:var(--ink); font-size:14.5px; margin-top:4px; padding-top:12px;}

/* Wine Tour card deck — a swipeable stack (one card visible at a time,
   tap the side arrows/dots or swipe) standing in for a page of text to
   scroll through. Card border colour and the glass-icon fill both key
   off each wine's colour (sparkling/white/rosé/orange/red). */
.wine-deck{position:relative; margin:14px 0 10px; touch-action:pan-y;}
.wine-deck-card{background:var(--bg-elev); border:2px solid var(--line); border-radius:20px; padding:22px 34px 20px;
  min-height:280px; box-shadow:var(--shadow); text-align:center; animation:wineCardIn .32s cubic-bezier(.22,.9,.3,1.1);}
@keyframes wineCardIn{from{opacity:0; transform:translateX(14px) scale(.97);} to{opacity:1; transform:translateX(0) scale(1);}}
.wine-deck-card.wc-sparkling{border-color:var(--gold-deep); background:linear-gradient(180deg,var(--bg-elev),var(--bg-sunk));}
.wine-deck-card.wc-white{border-color:#d8c06a;}
.wine-deck-card.wc-rose{border-color:#d88a9a;}
.wine-deck-card.wc-orange{border-color:#c6792f;}
.wine-deck-card.wc-red{border-color:var(--accent-deep);}
.wine-card-glass{margin:0 auto 10px; width:56px; height:78px;}
.wine-card-glass svg{width:100%; height:100%; display:block;}
.wine-card-tag{display:inline-block; font-family:var(--font-display); font-size:10px; font-weight:800; text-transform:uppercase;
  letter-spacing:.06em; padding:3px 10px; border-radius:999px; margin-bottom:8px;}
.wine-card-tierbar{font-family:var(--font-display); font-weight:800; padding:10px 14px; border-radius:12px; margin-bottom:10px; font-size:13px;}
.wine-card-name{font-family:var(--font-display); font-size:19px; font-weight:800; margin:0 0 2px; text-transform:none; letter-spacing:0; color:var(--ink);}
.wine-card-origin{color:var(--ink-soft); font-size:12.5px; font-weight:700; margin:0 0 4px;}
.wine-card-example{font-style:italic; color:var(--gold-deep); font-size:12.5px; margin:0 0 10px;}
.wine-card-text{font-size:13.5px; line-height:1.55; color:var(--ink); text-align:left; margin:0 0 8px;}
.wine-card-compare{font-size:12.5px; color:var(--ink-soft); text-align:left;}
.wine-deck-arrow{position:absolute; top:50%; transform:translateY(-50%); width:36px; height:36px; border-radius:50%;
  border:2px solid var(--line); background:var(--bg-elev); color:var(--accent); font-size:14px; cursor:pointer;
  box-shadow:0 3px 0 var(--line); display:flex; align-items:center; justify-content:center; padding:0;}
.wine-deck-arrow:active{transform:translateY(-50%) translateY(2px); box-shadow:none;}
.wine-deck-arrow.left{left:2px;}
.wine-deck-arrow.right{right:2px;}
.wine-deck-dots{display:flex; justify-content:center; gap:6px; margin:10px 0 2px; flex-wrap:wrap;}
.wine-deck-dot{width:8px; height:8px; border-radius:50%; background:var(--line); border:none; padding:0; cursor:pointer;}
.wine-deck-dot.active{background:var(--accent); width:20px; border-radius:5px;}
.wine-chart-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; text-align:left;}
@media(max-width:420px){.wine-chart-grid{grid-template-columns:1fr;}}
.wine-chart-bucket{background:var(--bg-sunk); border-radius:12px; padding:10px 11px;}
.wine-chart-bucket-name{font-family:var(--font-display); font-weight:800; font-size:12px; color:var(--accent); margin-bottom:3px;}
.wine-chart-bucket-wines{font-size:12px; color:var(--ink-soft); line-height:1.4;}
.wine-color-swatch{width:20px; height:20px; border-radius:50%; margin-bottom:5px; border:2px solid rgba(0,0,0,.12);}
.wine-card-fact{margin-top:10px; text-align:left; background:var(--bg-sunk); border:1px dashed var(--gold-deep); border-radius:12px; padding:9px 12px;}
.wine-card-fact-label{display:block; font-family:var(--font-display); font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--gold-deep); margin-bottom:3px;}
.wine-card-fact p{margin:0; font-size:12.5px; line-height:1.5; color:var(--ink);}

/* Wine Tour "postcard" scene banner — a short illustrated backdrop at
   the top of each stop (misty vineyard hills, snow-capped Alps, Mount
   Etna, Lake Garda, foggy Piedmont, golden-hour Tuscany, the Puglia/
   Sicily coast, the Okanagan) so the tour feels like travelling through
   Italy rather than reading a heading. A dark scrim + white overlay text
   keep the title readable over whatever scenery sits behind it. */
.wine-scene{position:relative; border-radius:18px; overflow:hidden; margin-bottom:12px; box-shadow:var(--shadow); line-height:0;}
.wine-scene svg{display:block; width:100%; height:120px;}
.wine-scene-scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(20,12,8,0) 38%, rgba(20,12,8,.78) 100%);}
.wine-scene-stamp{position:absolute; top:10px; right:10px; background:rgba(255,250,240,.92); color:#6a3d1f;
  font-family:var(--font-display); font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
  padding:4px 10px; border-radius:999px; box-shadow:0 2px 0 rgba(0,0,0,.08);}
.wine-scene-text{position:absolute; left:0; right:0; bottom:0; padding:10px 16px 12px; text-align:left;}
.wine-scene-text h1{margin:0 0 2px; font-size:19px; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.45); letter-spacing:0;}
.wine-scene-text p{margin:0; font-size:12px; font-weight:700; color:rgba(255,255,255,.92); text-shadow:0 1px 4px rgba(0,0,0,.45);}
table.results-table{width:100%; border-collapse:collapse; font-size:12.5px;}
table.results-table th, table.results-table td{text-align:left; padding:8px 8px; border-bottom:2px solid var(--line); vertical-align:top;}
table.results-table th{font-family:var(--font-display); color:var(--ink-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;}
.disclaimer{background:var(--warn-bg); border:2px solid var(--warn); color:var(--warn); border-radius:13px;
  padding:10px 13px; font-size:12px; font-weight:600; line-height:1.4; margin-bottom:14px;}
.empty{text-align:center; color:var(--ink-faint); padding:30px 10px; font-size:13.5px;}
.fact{background:var(--bg-sunk); border-radius:13px; padding:10px 13px; font-size:12.5px; font-weight:600; margin-top:8px; color:var(--ink-soft);}
#confetti-canvas{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:999;}

/* Run the Floor — a top-down map styled after Folietta's actual dining
   room, not a generic blueprint: dark walnut walls (the real wood
   panelling), warm cream tile floor, the burgundy accent that shows up on
   the tile cap stripe and the "Folietta" script sign, and brass-toned
   counters/bar. Fixed warm paper tones regardless of light/dark theme —
   meant to read like the actual room, not reskin with the app chrome.
   The server is just a dot an X slider (bottom) and a Y slider (right)
   drag around the map; the same zone/table/wall shapes drawn here are
   what the sliders physically can't drag the dot through. */
:root{
  --floor-wall:#3a2a1f; --floor-wall-line:#241a12; --floor-wood:#5b4030;
  --floor-cream:#f6eeda; --floor-tile:#fffaf0; --floor-tile-line:#e3cfa6;
  --floor-burgundy:#8c2331; --floor-burgundy-deep:#5e1620; --floor-gold:#c9a86a; --floor-brass:#b9842a;
}
/* Full-bleed: breaks out of #app's side padding so the map reads as a room
   to walk around in, not a diagram pinned inside a card. */
.floor-stage{display:grid; grid-template-columns:1fr 30px; grid-template-rows:auto auto; gap:6px 6px;
  margin:0 -16px 14px; width:calc(100% + 32px); padding:0 6px;}
/* Matches the camera window's own CAMERA_W/CAMERA_H in app.js (60/72) —
   a "dynamic glass window" onto the real floor plan, not the whole thing
   shrunk to fit; keep the two in sync if either one changes. The double
   border (walnut outer, burgundy inset) echoes the real room's dark wood
   trim over a burgundy accent line, same family as the tile cap stripe. */
.floor-map-wrap{grid-column:1; grid-row:1; position:relative; aspect-ratio:60/72; border-radius:12px; overflow:hidden;
  background:var(--floor-cream); border:4px solid var(--floor-wall);
  box-shadow:inset 0 0 0 2px var(--floor-burgundy), inset 0 0 0 3px var(--floor-cream), inset 0 2px 10px rgba(40,20,10,.18), 0 4px 14px rgba(40,20,10,.22);}
.floor-map-svg{display:block; width:100%; height:100%;}
.bp-building{fill:none; stroke:var(--floor-wood); stroke-width:1.3; stroke-linejoin:round;}
/* The real east wall dividing the dining room from the patio — solid
   walnut, not just an outline, so it visibly reads as a wall rather than
   a zone edge; the three gaps left open in FLOOR_WALLS are its real
   doors (see data.py) and are simply not drawn, i.e. open floor. */
.bp-wall{fill:var(--floor-wall); stroke:var(--floor-wall-line); stroke-width:.3;}
.bp-zone{fill:var(--floor-tile); stroke:var(--floor-tile-line); stroke-width:.35;}
.bp-zone-counter, .bp-zone-podium{fill:#efe0bf;}
.bp-zone-door{fill:#2e3a2a;}
.bp-zone-kitchen{fill:#eef1f2;}
.bp-zone-threshold{fill:var(--floor-tile);}
.bp-zone-label{font-family:var(--font-body); font-size:1.5px; font-weight:800; fill:#8a6a4a; text-transform:uppercase; letter-spacing:.02em; pointer-events:none;}
.bp-table{fill:#fffdfa; stroke:var(--floor-wood); stroke-width:.45;}
.bp-table-target{stroke:var(--success-deep); stroke-width:.8;}
.bp-table-label{font-family:var(--font-display); font-size:2.7px; font-weight:700; fill:var(--floor-wood); text-anchor:middle; pointer-events:none;}
.bp-counter{fill:var(--floor-wall);}
.bp-counter-top{fill:none; stroke:var(--floor-brass); stroke-width:.4;}
.bp-stool{fill:#fffdfa; stroke:var(--floor-wood); stroke-width:.3;}
.bp-pass-edge{fill:var(--floor-brass);}
.bp-podium{fill:var(--floor-wood); stroke:var(--floor-wall-line); stroke-width:.3;}
.bp-door{fill:#2e3a2a; stroke:var(--floor-burgundy); stroke-width:.4; stroke-dasharray:1.3 1;}
.floor-trail{fill:none; stroke:var(--accent); stroke-width:.9; stroke-linecap:round; stroke-linejoin:round; opacity:.5;}
/* The little Folietta server standing in for the old plain dot — see
   svgCharacterIcon in app.js. White strokes on the head/body keep it
   legible against whichever floor tone it's standing on. */
.floor-char-shadow{fill:rgba(20,10,5,.22);}
.floor-char-hair{fill:var(--floor-wall);}
.floor-char-body{fill:var(--floor-burgundy); stroke:#fff; stroke-width:.3;}
.floor-char-button{fill:var(--floor-gold);}
.floor-char-head{fill:#e8c49a; stroke:#fff; stroke-width:.3;}
.floor-char-stache{fill:var(--floor-wall);}
.floor-slider-y-wrap{grid-column:2; grid-row:1; position:relative; display:flex; align-items:center; justify-content:center;}
.floor-slider-x-wrap{grid-column:1; grid-row:2; display:flex; align-items:center; padding:0 2px;}
.floor-slider{-webkit-appearance:none; appearance:none; background:transparent; cursor:pointer; margin:0; touch-action:none;}
.floor-slider-x-wrap .floor-slider{width:100%;}
/* rotate(90deg), not -90deg: dragging the thumb toward the top of the
   screen must move the character up the room (smaller y), matching the
   map's own orientation — the other rotation direction put max-value at
   the top, which moved the character the opposite way from the drag. */
.floor-slider-y-wrap .floor-slider{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(90deg);}
.floor-slider::-webkit-slider-runnable-track{height:8px; border-radius:999px; background:var(--bg-sunk); border:1px solid var(--line);}
.floor-slider::-moz-range-track{height:8px; border-radius:999px; background:var(--bg-sunk); border:1px solid var(--line);}
.floor-slider::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:26px; height:26px; margin-top:-9px; border-radius:50%;
  background:var(--accent); border:3px solid #fff; box-shadow:0 2px 0 var(--accent-deep);}
.floor-slider::-moz-range-thumb{width:26px; height:26px; border:3px solid #fff; border-radius:50%; background:var(--accent); box-shadow:0 2px 0 var(--accent-deep);}
/* Admin-only Layout Editor (see EDITOR_ENABLED in app.js) — the full
   floor plan at once, no camera crop, with every counter/table draggable.
   Reuses the same bp-* shape classes as the live map above. */
.layout-editor-wrap{margin:0 -16px 14px; width:calc(100% + 32px); padding:0 6px;
  background:var(--floor-cream); border-top:4px solid var(--floor-wall); border-bottom:4px solid var(--floor-wall);}
.layout-editor-svg{display:block; width:100%; height:auto;}
.edit-draggable{cursor:grab; touch-action:none;}
.edit-draggable:active{cursor:grabbing;}
.edit-draggable:hover{filter:brightness(1.08);}
.layout-json-box{width:100%; margin-top:10px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11.5px; line-height:1.4; padding:10px; border-radius:10px; border:2px solid var(--line);
  background:var(--bg-sunk); color:var(--ink); resize:vertical;}
.plate-tray{display:flex; flex-direction:column; gap:8px; margin:10px 0;}
.plate-chip{display:flex; align-items:center; gap:10px; text-align:left; width:100%; padding:10px 13px; border-radius:13px;
  border:2px solid var(--line); background:var(--bg-elev); cursor:pointer; font-family:var(--font-body); color:var(--ink);
  box-shadow:0 3px 0 var(--line); transition:transform .08s ease, box-shadow .08s ease;}
.plate-chip:active{transform:translateY(2px); box-shadow:none;}
.plate-chip.armed{border-color:var(--gold-deep); background:var(--bg-sunk); box-shadow:0 3px 0 var(--gold-deep);}
.plate-chip.placed{border-color:var(--success-deep); box-shadow:0 3px 0 var(--success-deep);}
.plate-chip.static{cursor:default; pointer-events:none; box-shadow:none;}
.plate-icon{font-size:20px; flex:none;}
.plate-name{font-weight:700; font-size:13.5px; flex:1;}
.plate-where{font-size:11px; font-weight:700; color:var(--gold-deep); white-space:nowrap;}
.plate-where.muted{color:var(--ink-faint); font-weight:600;}
.table-diagram{margin:16px 0; display:flex; justify-content:center;}
.counter-row{display:flex; gap:6px; overflow-x:auto; padding:4px; max-width:100%;}
.seat-slot{flex:none; width:42px; height:42px; border-radius:11px; border:2px solid var(--line); background:var(--bg-elev);
  display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-family:var(--font-display);
  font-weight:700; font-size:13px; color:var(--ink); box-shadow:0 3px 0 var(--line); position:relative;}
.seat-slot:active{transform:translateY(2px); box-shadow:none;}
.seat-slot.filled{border-color:var(--success-deep); background:var(--success-bg); box-shadow:0 3px 0 var(--success-deep);}
.seat-plate{font-size:13px; margin-top:-2px;}
.table-shape{position:relative; width:220px; height:180px; margin:10px auto; max-width:100%;}
.centre-slot{position:absolute; inset:46px; border:2px dashed var(--line); background:var(--bg-sunk); border-radius:12px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700;
  font-size:11px; color:var(--ink-soft); z-index:1;}
.centre-slot.filled{background:var(--success-bg); color:var(--success-deep); border-color:var(--success-deep); border-style:solid;}
.centre-plates{font-size:12px; margin-top:2px;}
.table-shape .seat-slot{position:absolute; width:46px; height:46px;}
.two-top .seat-pos-0{left:0; top:67px;}
.two-top .seat-pos-1{right:0; top:67px;}
.four-top .seat-pos-0{left:36px; top:0;}
.four-top .seat-pos-1{right:36px; top:0;}
.four-top .seat-pos-2{left:0; top:67px;}
.four-top .seat-pos-3{right:0; top:67px;}
</style>

bitterness and richness", "Sweeter and lighter", "Identical in flavor", "Served without any coffee element"], "correctAnswer": "More complex, with more bitterness and richness"}, {"category": "bar", "prompt": "True or False — a White Negroni is typically lighter and more delicate than a classic Negroni, with the bitterness dialed back.", "options": ["True", "False"], "correctAnswer": "True"}, {"category": "bar", "prompt": "If a guest wants to change an ingredient or reduce the pour in one of Folietta's signature cocktails, what's the right approach?", "options": ["Politely explain the cocktail is curated as-is and recommend something else that fits what they're after", "Always accommodate any change", "Refuse to serve them anything", "Make the drink exactly as asked with no comment"], "correctAnswer": "Politely explain the cocktail is curated as-is and recommend something else that fits what they're after"}], "wineTourStops": [{"id": "reading-the-list", "num": 1, "title": "Reading the Vino List", "kicker": "Before we even leave the dock", "intro": "Every stop on this tour starts with how to read the label — once the tier system clicks, everything else on this trip is just geography and grapes.", "subtitle": "A study companion to the list: what each grape is, where it grows, who makes it, and which wines from outside Italy it most resembles.", "wines": [], "extra": {"tiers": [{"name": "DOCG", "desc": "Strictest tier. Fixes the region, grapes, aging and yields."}, {"name": "DOC", "desc": "Still regulated — one notch looser than DOCG."}, {"name": "IGT / IGP", "desc": "Loosest tier, but not lesser: several of the list's priciest reds are IGT because they broke the rules on purpose."}], "terms": [{"term": "Classico", "desc": "The historic heartland of the zone."}, {"term": "Superiore", "desc": "Riper grapes, or longer aging."}, {"term": "Riserva", "desc": "Longer aging."}, {"term": "Gran Selezione", "desc": "The top tier of Chianti Classico."}]}, "check": {"kind": "ladder", "prompt": "Order these tiers from loosest to strictest.", "items": ["IGT / IGP", "DOC", "DOCG"], "note": "DOCG and DOC fix the region, grapes, aging and yields; IGT is looser, but not lesser — several of the list's priciest reds are IGT because they broke the rules on purpose."}}, {"id": "frizzante", "num": 2, "title": "Frizzante", "kicker": "Emilia-Romagna, Veneto & Piemonte", "intro": "First stop: the bubbles. It's the fastest way to teach where a sparkling wine's whole character comes from — the tank, or the bottle.", "subtitle": "Sparkling wines. The real difference between them is where the bubbles are made: in a tank or in the bottle.", "wines": [{"id": "lambrusco", "color": "sparkling", "name": "Lambrusco", "origin": "Emilia-Romagna", "example": "Casali 'Lambruscone' · 2023 Paltrinieri 'Radice'", "text": "A family of related red grapes from Emilia-Romagna, made fizzy and usually dry to cut through cured meats and Parmigiano. Sorbara is the palest, sharpest member; 'Radice' finishes fermenting in the bottle and stays cloudy, like a pét-nat.", "compareLabel": "Compare", "compare": "Sparkling Shiraz; rosé Champagne for Sorbara.", "fact": "Sweet, fizzy Lambrusco (think Riunite) was America's best-selling import wine through the 1970s-80s, topping 13 million cases in 1985 — a world away from what's in this glass. The grape itself isn't especially sweet; it was sugared for export. Left dry, as Folietta pours it, Sorbara is considered the finest expression."}, {"id": "prosecco-glera", "color": "sparkling", "name": "Prosecco · Glera", "origin": "Conegliano Valdobbiadene, Veneto", "example": "Serena 1881 Brut Nature, Treviso · 2021 Bisol 'Cartizze'", "text": "Made in a pressurized tank, which keeps it light and fruity: pear, apple, white flowers. 'Brut Nature' means no added sugar. The steep Conegliano Valdobbiadene hills are UNESCO-listed; Cartizze, about 100 hectares, is the top hill.", "compareLabel": "Compare", "compare": "Cava and Crémant (bottle-made, yeastier).", "fact": "Cartizze is sometimes called Prosecco's \"grand cru\": about 107 steep hectares, hand-harvested, owned by roughly 140 growers, among the most expensive farmland in the wine world. All of that works out to only around 1.2 million bottles a year, next to 110 million bottles of Prosecco DOCG overall."}, {"id": "alta-langa", "color": "sparkling", "name": "Alta Langa", "origin": "Piedmont", "example": "2015 Contratto 'For England' Blanc de Noirs Extra Brut", "text": "Piedmont's answer to Champagne: Pinot Noir and Chardonnay, fermented in the bottle and aged at least 30 months on the yeast. Contratto (Canelli, 1867) is credited with Italy's first bottle-fermented sparkling wine. Blanc de Noirs = white wine from red grapes, here Pinot Noir.", "compareLabel": "Compare", "compare": "Blanc de Noirs Champagne, almost directly."}, {"id": "unsworth-charme", "color": "sparkling", "name": "Unsworth 'Charme de l'Île'", "origin": "Cowichan Valley, Vancouver Island, BC", "example": "Cowichan Valley, Vancouver Island, BC", "text": "A BC sparkler to taste beside the Prosecco."}], "extra": {"methods": [{"name": "Tank · Charmat", "desc": "Second fermentation in a sealed steel tank. Fresh fruit and flowers.", "examples": "Serena 1881 · Bisol Cartizze"}, {"name": "Bottle · Metodo Classico", "desc": "Second fermentation in each bottle, then long aging on the yeast. Toast, brioche, fine bubbles.", "examples": "Contratto · Champagne's method"}, {"name": "Bottle · left unfiltered", "desc": "Fermentation finishes in the bottle and the yeast stays in. Cloudy, rustic, lively.", "examples": "Paltrinieri 'Radice' · pét-nat style"}]}, "check": {"kind": "trivia", "questions": [{"prompt": "Which method keeps Prosecco light and fruity — pear, apple, white flowers?", "options": ["Second fermentation in a sealed tank (tank/Charmat method)", "Second fermentation in the bottle, aged on the yeast", "Fermentation finishes in the bottle with the yeast left in, unfiltered", "Distillation"], "correctAnswer": "Second fermentation in a sealed tank (tank/Charmat method)"}, {"prompt": "True or False — Alta Langa is made using the same tank method as Prosecco.", "options": ["True", "False"], "correctAnswer": "False"}, {"prompt": "What does \"Brut Nature\" mean on a Prosecco label?", "options": ["No added sugar", "Extra sweet", "Rosé style", "Aged 30 months on the yeast"], "correctAnswer": "No added sugar"}, {"prompt": "Which Piedmont producer is credited with Italy's first bottle-fermented sparkling wine, dating to 1867?", "options": ["Contratto", "Bisol", "Paltrinieri", "Serena 1881"], "correctAnswer": "Contratto"}]}}, {"id": "bianchi-1", "num": 3, "title": "Bianchi I — The Alpine North & Piemonte", "kicker": "Alto Adige, Veneto, Roero & Colli Tortonesi", "intro": "North into the Alps, then over to Piemonte, for three white grapes that nearly vanished within living memory — and were saved by growers who refused to let them go.", "subtitle": "The Alpine north and Piemonte. Three of these grapes were nearly extinct within living memory and were saved by a handful of growers.", "wines": [{"id": "pinot-grigio-alto-adige", "color": "white", "name": "Pinot Grigio · Alto Adige", "origin": "Alto Adige (Südtirol)", "example": "2024 Colterenzio 'Classico'", "text": "Alto Adige (Südtirol) is Italy's German-speaking Alpine corner, and its Pinot Grigio is crisper and more mineral than the mass-market kind. Colterenzio is a respected growers' cooperative, the region's typical way of working.", "compareLabel": "Same grape", "compare": "Pinot Gris from Alsace and Oregon: richer and rounder."}, {"id": "garganega-soave", "color": "white", "name": "Garganega · Soave", "origin": "Veneto", "example": "2023 Brigaldara, Veneto", "text": "Soave is Garganega grown east of Verona, often on volcanic soil: almond, white flowers, a soft but textured palate. Good Soave is nothing like its cheap 1980s reputation. Brigaldara is better known for Valpolicella reds.", "compareLabel": "Compare", "compare": "Chenin Blanc, or unoaked Chablis, in texture.", "fact": "Soave's cheap reputation was largely self-inflicted: for decades the appellation's rules allowed high-volume, bland wine to be sold under its name, and the good stuff got lumped in with it. The Consorzio is now mapping individual vineyards to show what the zone can really do, and growers like the Filippi family make the case for serious Soave one bottle at a time."}, {"id": "arneis-roero", "color": "white", "name": "Arneis · Roero", "origin": "Piedmont", "example": "2023 Passato · 2021 Cornerea", "text": "Piedmontese for \"little rascal,\" because the vine is fussy. By the 1970s it had almost vanished until growers such as Vietti and Bruno Giacosa revived it. Pear, almond, soft florals, gentle acidity.", "compareLabel": "Compare", "compare": "A lighter Viognier, or Pinot Blanc.", "fact": "This is the grape the guest's question is about. Over a century ago Arneis was grown alongside Nebbiolo in Barolo vineyards; once winemakers stopped blending it in, some growers kept a few vines standing at the edge of the plot purely so birds would peck at the Arneis instead of the valuable Nebbiolo. By the late 1960s it had nearly disappeared. Growers Vietti and Bruno Giacosa get the credit for keeping it in production long enough for it to come back as its own variety."}, {"id": "nascetta", "color": "white", "name": "Nascetta", "origin": "Langhe, Piedmont", "example": "2021 Castello di Perno, Langhe", "text": "A rare white native to the Langhe, rescued from near-extinction around the village of Novello. Aromatic, with herbs and citrus. A true curiosity on the list.", "compareLabel": "Compare", "compare": "Sauvignon Blanc meets dry Riesling.", "fact": "Nascetta was common in the 1800s, then faded through the 1900s as it proved tricky to farm and growers switched to Nebbiolo and Chardonnay — a few vines survived mostly out of sentiment. In 1993, Elvio Cogno and his son-in-law Valter Fissore tasted some old bottles and decided the grape deserved a second chance; their first vintage, in 1994, ran to about 800 bottles. It now has its own appellation, created in 2010, covering only Nascetta grown around the village of Novello."}, {"id": "timorasso", "color": "white", "name": "Timorasso · 'Derthona'", "origin": "Colli Tortonesi, Piedmont", "example": "2023 Voerzio Martini, Colli Tortonesi", "text": "Piedmont's great comeback white, championed by Walter Massa from the late 1980s. Derthona is the Latin name for Tortona. Full-bodied and long-lived, it picks up a petrol note with age.", "compareLabel": "Compare", "compare": "Dry Riesling, or white Burgundy.", "fact": "Timorasso almost vanished in the 1900s: it's late-ripening, low-yielding and oxidizes easily, so growers pulled it out for the booming Gavi DOCG or for red grapes instead. By the 1980s only scattered old vines were left, tangled in with other varieties. Walter Massa found some of those vines near Tortona and started bottling them separately under the old Roman name for the town, Derthona — and built the whole Timorasso revival from there."}], "check": {"kind": "flashcard", "cards": ["pinot-grigio-alto-adige", "garganega-soave", "arneis-roero", "nascetta", "timorasso"]}}, {"id": "bianchi-2", "num": 4, "title": "Bianchi II — Coast, Centre & South", "kicker": "Liguria, Sardinia, Tuscany, Marche, Abruzzo & Umbria", "intro": "South along the coasts and into the central hills: Italy's native whites, most of which barely grow anywhere outside the country.", "subtitle": "The coasts, the central hills and the south: Italy's native whites, most of them grown almost nowhere else.", "wines": [{"id": "vermentino", "color": "white", "name": "Vermentino", "origin": "Colli di Luni & Gallura", "example": "2023 Lunae, Colli di Luni · 2023 Tenute Vignola 'Jagamu', Gallura", "text": "A Mediterranean coastal white: citrus, herbs, a salty finish. Lunae is the benchmark in Colli di Luni. Vermentino di Gallura, from granite soils, is Sardinia's only DOCG and fuller-bodied.", "compareLabel": "Same grape", "compare": "Rolle, in Provence rosé blends."}, {"id": "vernaccia-sangimignano", "color": "white", "name": "Vernaccia di San Gimignano", "origin": "Tuscany", "example": "2024 Fattoria Amo 'ANN', Toscana", "text": "From the medieval tower town. In 1966 it became Italy's first DOC. Dry, with a bitter-almond finish.", "compareLabel": "Compare", "compare": "Dry, mineral Chablis-style whites.", "fact": "San Gimignano's town records mention Vernaccia as far back as 1276 — about 750 years of continuous history. Dante even name-drops it in the Purgatorio, in the story of a Pope so fond of the wine (and of eels stewed in it) that it's listed among his sins. It fell out of fashion in the early 1900s, came back in the 1960s, and became Italy's very first DOC wine in 1966."}, {"id": "verdicchio-matelica", "color": "white", "name": "Verdicchio di Matelica", "origin": "Marche", "example": "2024 Borgo Paglianetto 'Terravignata', Marche", "text": "Matelica is an inland valley, higher and cooler than the better-known Castelli di Jesi. Tense, lemony wines that age well.", "compareLabel": "Compare", "compare": "Chablis or dry Riesling."}, {"id": "falanghina", "color": "white", "name": "Falanghina", "origin": "Basilicata", "example": "2023 Paternoster, Basilicata", "text": "An ancient southern grape: floral, citrusy. Paternoster (1925) is better known for Aglianico del Vulture reds.", "compareLabel": "Compare", "compare": "A fresher, lighter Viognier.", "fact": "Falanghina's name most likely comes from the Latin falangae, the wooden stakes used to train vines up off the ground — a nod to how old the practice is here. Some historians think it may even be an ancestor of Falernian, the most prized wine of ancient Rome, though that link is more legend than proven fact."}, {"id": "trebbiano-abruzzo", "color": "white", "name": "Trebbiano d'Abruzzo", "origin": "Abruzzo", "example": "2022 Jasci & Marchesani", "text": "\"Trebbiano\" names several unrelated grapes. Trebbiano Toscano is France's Ugni Blanc, distilled into Cognac. Trebbiano Abruzzese is a different, better grape that can make serious, textured whites."}, {"id": "grechetto", "color": "white", "name": "Grechetto", "origin": "Narni, Umbria", "example": "2021 Leonardo Bussoletti '05035 Bianchi di Narni', Umbria", "text": "Umbria's native white: nutty, with good body. \"05035\" is the postal code of Narni, the producer's town; Bussoletti is known for reviving its local grapes."}], "check": {"kind": "trivia", "questions": [{"prompt": "Vermentino di Gallura is Sardinia's only wine with which designation?", "options": ["DOCG", "DOC", "IGT", "Riserva"], "correctAnswer": "DOCG"}, {"prompt": "Vernaccia di San Gimignano made history in 1966 as:", "options": ["Italy's first DOC", "Italy's first DOCG", "Italy's first bottle-fermented sparkling wine", "Umbria's native white"], "correctAnswer": "Italy's first DOC"}, {"prompt": "True or False — Trebbiano Toscano and Trebbiano Abruzzese are the same grape.", "options": ["True", "False"], "correctAnswer": "False"}, {"prompt": "Falanghina's producer on our list, Paternoster, is better known for which other wine?", "options": ["Aglianico del Vulture reds", "Brunello di Montalcino", "Barolo", "Chianti Classico"], "correctAnswer": "Aglianico del Vulture reds"}]}}, {"id": "bianchi-3", "num": 5, "title": "Bianchi III — A Volcano & Familiar Grapes", "kicker": "Etna & the Langhe hills, plus two BC whites", "intro": "One more white stop before we cross into colour: Mount Etna's volcanic slopes, then the international grapes Barolo producers grow on the side.", "subtitle": "A volcano, the world's familiar white grapes grown in Barolo country, and two BC whites to measure them against.", "wines": [{"id": "carricante", "color": "white", "name": "Carricante · Etna Bianco", "origin": "Sicilia", "example": "2022 Tornatore 'Pietrarizzo', Sicilia", "text": "Grown high on the volcanic slopes of Mount Etna: salty, smoky, citrusy, with very high acidity. Etna is one of the most exciting wine regions in the world right now.", "compareLabel": "Compare", "compare": "Santorini Assyrtiko (also volcanic), or dry Riesling.", "fact": "Etna's modern wine scene is young: it took off in the early 2000s when outsiders like Andrea Franchetti, Marc de Grazia and Frank Cornelissen started cutting yields way down and treating the mountain's old, often pre-phylloxera vines with real respect, instead of the heavy, overcropped style that came before. Big Sicilian names like Planeta and Tasca d'Almerita followed them up the volcano, and there are now more than 65 producers making wine on Etna."}, {"id": "sordo-sauvignon", "color": "white", "name": "Sauvignon", "origin": "Langhe hills, Piedmont", "example": "2024 Sordo 'Foresté'", "text": "An international grape grown in Nebbiolo country, by a Barolo producer. Expect a softer style than New Zealand's.", "compareLabel": "Compare", "compare": "Sancerre and Marlborough."}, {"id": "scavino-chardonnay", "color": "white", "name": "Chardonnay", "origin": "Langhe hills, Piedmont", "example": "2021 Paolo Scavino", "text": "Scavino is one of Barolo's most famous names, also growing Chardonnay in Nebbiolo country.", "compareLabel": "Compare", "compare": "White Burgundy."}, {"id": "averill-creek-chardonnay", "color": "white", "name": "Averill Creek Chardonnay", "origin": "Cowichan Valley, Vancouver Island", "example": "2023 · Cowichan Valley, Vancouver Island", "text": "Cool-climate island Chardonnay: leaner and brisker. Taste it beside the Scavino to feel what climate does to one grape."}, {"id": "tantalus-riesling", "color": "white", "name": "Tantalus Riesling", "origin": "Kelowna, BC", "example": "2024 · Kelowna, BC — \"Grown in Ont. | Made in BC\"", "text": "Tantalus farms some of BC's oldest Riesling vines, planted in the late 1970s. The label note matters: a January 2024 cold snap wiped out most of the Okanagan crop, so many BC wineries brought in Ontario or Washington grapes that year and said so on the label.", "compareLabel": "Compare", "compare": "Dry German and Alsace Riesling."}], "extra": {"bodyChart": {"note": "A rough guide: producer, vintage and age can move any wine along the line.", "buckets": [{"name": "Light & crisp", "wines": ["Pinot Grigio", "Vernaccia", "Verdicchio", "Carricante"]}, {"name": "Bright & aromatic", "wines": ["Sauvignon", "Nascetta", "Riesling", "Vermentino"]}, {"name": "Medium & round", "wines": ["Arneis", "Garganega", "Falanghina"]}, {"name": "Full & textured", "wines": ["Timorasso", "Grechetto", "Trebbiano d'Abruzzo", "Chardonnay"]}]}}, "check": {"kind": "trivia", "questions": [{"prompt": "On the body chart, which bucket does Pinot Grigio fall into?", "options": ["Light & crisp", "Bright & aromatic", "Medium & round", "Full & textured"], "correctAnswer": "Light & crisp"}, {"prompt": "On the body chart, which bucket does Sauvignon fall into?", "options": ["Light & crisp", "Bright & aromatic", "Medium & round", "Full & textured"], "correctAnswer": "Bright & aromatic"}, {"prompt": "On the body chart, which bucket does Arneis fall into?", "options": ["Light & crisp", "Bright & aromatic", "Medium & round", "Full & textured"], "correctAnswer": "Medium & round"}, {"prompt": "On the body chart, which bucket does Timorasso fall into?", "options": ["Light & crisp", "Bright & aromatic", "Medium & round", "Full & textured"], "correctAnswer": "Full & textured"}, {"prompt": "On the body chart, which bucket does Carricante (Etna Bianco) fall into?", "options": ["Light & crisp", "Bright & aromatic", "Medium & round", "Full & textured"], "correctAnswer": "Light & crisp"}]}}, {"id": "rosato-arancia", "num": 6, "title": "Rosato & Arancia", "kicker": "Lake Garda & Friuli, plus two BC skin-contact wines", "intro": "Now we leave white wine behind for one question that explains rosé and orange wine at the same time: how long did the juice actually sit on the skins?", "subtitle": "Rosé and orange wine. Both are about one thing: how long the juice sits on the grape skins.", "wines": [{"id": "chiaretto-bardolino", "color": "rose", "name": "Chiaretto di Bardolino", "origin": "Lake Garda, Veneto", "example": "2024 Casaretti · Corvina & Rondinella, Veneto", "text": "A pale rosé from the shores of Lake Garda, made from the same grapes as Valpolicella reds. Light, red-berried, lightly salty.", "compareLabel": "Compare", "compare": "Provence rosé, its closest cousin."}, {"id": "orange-pinot-grigio", "color": "orange", "name": "Orange Pinot Grigio", "origin": "Friuli", "example": "2021 Podere di Carlo 'Orange Label', Friuli", "text": "Friuli led the modern orange-wine revival through growers such as Gravner and Radikon, reviving methods thousands of years old in Georgia. Pinot Grigio's skins are pinkish, and Friuli's traditional copper-tinted version is called ramato. Expect amber colour, light tannin, dried fruit and tea.", "fact": "The method Gravner and Radikon revived is older than Italy itself. In the Republic of Georgia, winemakers have fermented grapes on their skins in buried clay vessels called qvevri for thousands of years, and still do. \"Orange wine\" is really that ancient tradition, brought west and applied to grapes like Pinot Grigio."}, {"id": "le-vieux-pin-ponderose", "color": "rose", "name": "Le Vieux Pin 'Ponderosé'", "origin": "Oliver, BC", "example": "2025 · Cabernet Franc rosé, Oliver, BC", "text": "A South Okanagan rosé from Cabernet Franc. A same-page comparison with the Chiaretto."}, {"id": "kutatas-skin-contact", "color": "orange", "name": "Kutatás 'Skin Contact'", "origin": "North Saanich, Vancouver Island", "example": "2023 · Petite Milo, North Saanich, Vancouver Island", "text": "A modern hybrid grape, believed to come from Swiss breeder Valentin Blattner, bred to resist cold and disease, which suits the island. Kutatás is Hungarian for \"research.\""}], "extra": {"colorChart": [{"name": "White", "desc": "Juice pressed off the skins straight away."}, {"name": "Rosé", "desc": "Red grapes; skins left in for a few hours."}, {"name": "Orange", "desc": "White grapes fermented on their skins for days to months."}, {"name": "Red", "desc": "Red grapes; skins in through the whole fermentation."}]}, "check": {"kind": "ladder", "prompt": "Order these by how long the juice sits on the grape skins — least contact to most.", "items": ["White", "Rosé", "Orange", "Red"], "note": "White: pressed off the skins straight away. Rosé: red grapes, skins in for a few hours. Orange: white grapes fermented on their skins for days to months. Red: skins in through the whole fermentation."}}, {"id": "rosso-1", "num": 7, "title": "Rosso I — Piemonte & the Alps", "kicker": "Nebbiolo country, plus Dolcetto, Barbera & the mountains", "intro": "Our first reds, led by Piemonte's noble grape — and the everyday wines Piedmontese families actually pour while their Barolo ages in the cellar.", "subtitle": "Piemonte and the Alps: one noble grape, the everyday reds Piedmontese families actually drink, and light mountain wines.", "wines": [{"id": "valtellina", "color": "red", "name": "Valtellina", "origin": "Alpine terraces, Lombardia", "example": "2021 Barbacàn 'Jazpémi'", "text": "Alpine terraces where Nebbiolo is called Chiavennasca. The lightest step on the Nebbiolo ladder.", "fact": "\"Nebbiolo\" comes from nebbia, Italian for fog — but which fog is debated. Some say it's the thick autumn fog that settles into the Langhe hills around harvest time; others point to the pale, dusty bloom that forms on the grape skins themselves as they ripen, which looks a bit like fog on the berry. Either way, this is the lightest, coolest-climate version of that same grape."}, {"id": "nebbiolo-dalba", "color": "red", "name": "Nebbiolo d'Alba", "origin": "Langhe, Piedmont", "example": "2022 Sordo", "text": "The approachable, everyday version of Nebbiolo."}, {"id": "barbaresco", "color": "red", "name": "Barbaresco", "origin": "Piedmont", "example": "2022 Albino Rocca", "text": "Often called the more elegant of Piemonte's two great Nebbiolo zones."}, {"id": "barolo", "color": "red", "name": "Barolo", "origin": "Monforte d'Alba, Piedmont", "example": "2019 Attilio Ghisolfi 'Bussia', Monforte d'Alba", "text": "The longest-lived step on the Nebbiolo ladder.", "compareLabel": "Compare", "compare": "Pinot Noir for colour and perfume, Cabernet for grip. Red Burgundy is the usual analogy for Nebbiolo overall: both are about tiny vineyard plots."}, {"id": "dolcetto", "color": "red", "name": "Dolcetto", "origin": "Dolcetto d'Alba, Piedmont", "example": "2024 Azelia 'Bricco dell'Oriolo', Dolcetto d'Alba", "text": "\"Little sweet one,\" though the wine is dry. Piedmontese families drink it daily while their Barolo ages. Soft, purple-fruited, low in acid.", "compareLabel": "Compare", "compare": "Beaujolais, or a softer Merlot."}, {"id": "barbera", "color": "red", "name": "Barbera", "origin": "Barbera d'Alba, Piedmont", "example": "2022 Cesare Bussolo 'Vigna Santa Lucia', Barbera d'Alba", "text": "Piedmont's most planted red: high acidity, low tannin, dark cherry. One of the few Italian grapes with a real foothold in California.", "compareLabel": "Compare", "compare": "Pinot's brightness with Syrah's colour."}, {"id": "schiava", "color": "red", "name": "Schiava", "origin": "Trentino", "example": "2024 Cembra, Trentino", "text": "The lightest red on the list: pale, low in tannin, alpine and fresh.", "compareLabel": "Same grape", "compare": "Germany's Trollinger (Vernatsch)."}, {"id": "franconia", "color": "red", "name": "Franconia", "origin": "Friuli", "example": "2023 Visintini, Friuli", "text": "Peppery, dark-berried and juicy.", "compareLabel": "Same grape", "compare": "Blaufränkisch, Kékfrankos, Lemberger."}, {"id": "corvina", "color": "red", "name": "Corvina", "origin": "Veneto", "example": "2022 Monte Tondo, Veneto", "text": "The main grape of Valpolicella and Amarone. On its own: cherry-fresh and light.", "compareLabel": "Compare", "compare": "Gamay, or light Pinot Noir.", "fact": "This light, fresh version is Corvina before it becomes Amarone. For Amarone, the harvested grapes are spread out on racks or mats and left to dry for three to four months, shriveling like raisins and concentrating sugar and flavour before fermentation even starts. The payoff is a wine around 15-16% alcohol — rich, dried-fruited and a long way from the cherry-fresh glass in front of you now."}], "check": {"kind": "ladder", "prompt": "Order the Nebbiolo ladder from lightest to most structured and longest-lived.", "items": ["Valtellina", "Nebbiolo d'Alba", "Barbaresco", "Barolo"], "note": "Nebbiolo is pale in the glass but fierce in tannin and acidity — famous for smelling of \"tar and roses.\" The list lets you climb this ladder from lightest to most structured."}}, {"id": "rosso-2", "num": 8, "title": "Rosso II — Sangiovese Country", "kicker": "Chianti, Montalcino & Montefalco", "intro": "Nearly a third of the reds on our list are Sangiovese, which makes Tuscany and Umbria the most important stop on this whole tour.", "subtitle": "Sangiovese country: Tuscany and Umbria, from the straw-wrapped fiasco to the most expensive bottle on the list.", "wines": [{"id": "sangiovese", "color": "red", "name": "Sangiovese", "origin": "Tuscany & Umbria", "text": "Italy's most planted red grape: sour cherry, tomato leaf, earth, firm acidity. Nearly a third of the reds on this list are Sangiovese, which makes it the best grape to study in depth here.", "compareLabel": "Compare", "compare": "No perfect twin. Its acidity and savouriness sit closer to red Burgundy or Rioja (Tempranillo) than to Cabernet."}, {"id": "chianti", "color": "red", "name": "Chianti", "origin": "Tuscany", "example": "Fattoria Petriolo 'Folietta' · 1L fiasco", "text": "The everyday, straw-wrapped end of the Chianti ladder.", "fact": "The straw-wrapped fiasco dates back to the 1500s, when it was used for olive oil as much as wine: the round bottom was cheap for glassblowers to make, and local women called fiascaie wove marsh straw around each one, paid by the bottle, so it could stand up and survive years of refilling. Italian immigrants made it a symbol of Italian wine in North America, but rising demand eventually pushed some producers to cheapen the wine inside it — which is exactly why today's top Chianti Classico makers mostly ship in a plain Bordeaux-style bottle instead."}, {"id": "chianti-classico", "color": "red", "name": "Chianti Classico", "origin": "Tuscany", "example": "2020 Castell'in Villa", "text": "The historic Chianti heartland.", "compareLabel": "Fun fact", "compare": "Basic Chianti blends Sangiovese with partners such as Canaiolo."}, {"id": "chianti-riserva", "color": "red", "name": "Chianti Riserva", "origin": "Tuscany", "example": "2022 Castellare di Castellina", "text": "Longer aging than Classico."}, {"id": "chianti-gran-selezione", "color": "red", "name": "Chianti Gran Selezione", "origin": "Tuscany", "example": "2017 Rocca di Montegrossi", "text": "Chianti Classico's top tier.", "compareLabel": "Fun fact", "compare": "Rocca di Montegrossi is run by Marco Ricasoli-Firidolfi; his ancestor Baron Bettino Ricasoli wrote the original Chianti \"recipe\" in the 1800s."}, {"id": "montalcino", "color": "red", "name": "Rosso di Montalcino & Brunello", "origin": "Montalcino, Tuscany", "example": "2023 Corte Pavone (Rosso) · 2019 Castiglion del Bosco (Brunello)", "text": "100% Sangiovese from the warmer Montalcino hill. Brunello is aged for years before release; Rosso di Montalcino is its younger sibling, the \"baby Brunello.\"", "fact": "Brunello's price tag is partly written into the rulebook: by law it needs at least four years of total aging before release, two of them in barrel, and five years for a Riserva. That's years of tied-up cellar space and inventory before a producer sees a dollar back — one reason this is one of the priciest bottles on the list."}, {"id": "super-tuscans", "color": "red", "name": "The Super Tuscans", "origin": "Tuscany", "example": "2019 Isole e Olena 'Cepparello' · 2022 Montevertine 'Le Pergole Torte'", "text": "Chianti rules once required white grapes in the blend, so pure Sangiovese had to be sold as humble table wine. These became famous anyway. Montevertine's Sergio Manetti left the Chianti Classico consortium on principle."}, {"id": "sagrantino", "color": "red", "name": "Sagrantino", "origin": "Montefalco, Umbria", "example": "2018 Perticaia, Montefalco, Umbria", "text": "Arguably the most tannic grape in the world; it needs years in bottle.", "compareLabel": "Compare", "compare": "Tannat, from Madiran and Uruguay.", "fact": "Sagrantino's tannin isn't just high, it's roughly double the level found in Cabernet Sauvignon or Nebbiolo. For most of its history growers used it to make sweet passito wine, drying the grapes first the way Amarone is made; the dry, tannic style poured here has only been the norm since the 1970s."}], "check": {"kind": "ladder", "prompt": "Order the Chianti ladder from everyday to top tier.", "items": ["Chianti", "Classico", "Riserva", "Gran Selezione"], "note": "Classico is the historic heartland, Riserva means longer aging, and Gran Selezione is Chianti Classico's top tier."}}, {"id": "rosso-3", "num": 9, "title": "Rosso III — French Grapes & the South", "kicker": "Trentino & Tuscany's French grapes, then Puglia & Sicily", "intro": "Last red stop: French grapes grown on Italian soil, then south to an island that makes three completely different reds out of the same sunshine.", "subtitle": "French grapes on Italian soil, then south to Puglia and Sicily, where one island makes three very different reds.", "wines": [{"id": "san-leonardo", "color": "red", "name": "San Leonardo", "origin": "Trentino", "example": "2021 'Terre di Vignetti' Cabernet · Merlot, Trentino", "text": "A historic Bordeaux-blend estate in the Alps, often called the \"Bordeaux of Italy.\""}, {"id": "duemani-cifra", "color": "red", "name": "Duemani 'Cifra'", "origin": "Costa Toscana", "example": "2023 Cabernet Franc, Costa Toscana", "text": "A biodynamic estate near the Tuscan coast, making Cabernet Franc on its own.", "compareLabel": "Compare", "compare": "Loire Chinon."}, {"id": "tenuta-carleone", "color": "red", "name": "Tenuta di Carleone 'Il Randagio'", "origin": "Toscana", "example": "2023 Cabernet Franc · Merlot, Toscana", "text": "A Cabernet Franc and Merlot blend from Chianti Classico territory.", "compareLabel": "Compare", "compare": "Right Bank Bordeaux."}, {"id": "primitivo", "color": "red", "name": "Primitivo", "origin": "Puglia", "example": "2020 Coppi 'Siniscalco', Puglia", "text": "Ripe, jammy and spicy, from Italy's heel.", "compareLabel": "Same grape", "compare": "California Zinfandel. Both trace back to Croatia (Tribidrag).", "fact": "Proving that link took a real detective story. UC Davis geneticist Carole Meredith launched a DNA search in 1997 after a Croatian winemaker noticed Zinfandel's resemblance to a local grape; years of dead ends followed until a 1500s Croatian variety called Tribidrag, thought extinct, led researchers to a tiny stand of old vines near Split in 2001. DNA testing later confirmed those vines, Primitivo and Zinfandel were all the same grape — rescued from as few as 25 surviving plants."}, {"id": "nero-davola", "color": "red", "name": "Nero d'Avola", "origin": "Sicilia", "example": "2020 Tasca d'Almerita 'Regaleali'", "text": "Dark, plummy, warm-climate. Regaleali is the Tasca family's historic estate.", "compareLabel": "Compare", "compare": "Australian Shiraz.", "fact": "Nero d'Avola takes its name from Avola, the small southeastern Sicilian town where growers are believed to have first selected it. It's sometimes still called \"Calabrese,\" which despite appearances most likely has nothing to do with Calabria — it's thought to come from an old dialect word for \"grape of Avola\" instead."}, {"id": "nerello-mascalese", "color": "red", "name": "Nerello Mascalese", "origin": "Etna Rosso, Sicilia", "example": "2023 Graci, Etna Rosso", "text": "Pale, perfumed and volcanic: a completely different side of Sicily.", "compareLabel": "Compare", "compare": "Pinot Noir, Nebbiolo.", "fact": "Etna has historically been farmed in contrade, named estates of around 500 hectares each that form the backbone of the mountain's vineyard map, many broken up over time but still named on labels today. Combined with vines planted on their own roots at high elevation, some reportedly pre-dating the phylloxera epidemic, it's part of why Nerello Mascalese tastes like nowhere else in Sicily."}, {"id": "planeta-syrah", "color": "red", "name": "Syrah", "origin": "Menfi, Sicilia", "example": "2020 Planeta 'Maroccoli', Menfi", "text": "The French grape in the Sicilian sun.", "compareLabel": "Compare", "compare": "Northern Rhône, Shiraz."}], "check": {"kind": "flashcard", "cards": ["san-leonardo", "duemani-cifra", "primitivo", "nero-davola", "nerello-mascalese", "planeta-syrah"]}}, {"id": "home-ground", "num": 10, "title": "Home Ground", "kicker": "BC reds, grape twins & study pairs — journey's end", "intro": "Last stop: back home in BC, where four local reds sit beside their Italian counterparts, and the full list's grape twins tie the whole tour together.", "subtitle": "The BC reds at the end of the list, the Italian grapes hiding under other names, and pairs to study side by side.", "wines": [{"id": "roche-pinot-noir", "color": "red", "name": "Roche 'Vig' Pinot Noir", "origin": "Okanagan Valley, BC", "example": "2022 · Okanagan Valley", "text": "Made by a French-trained couple in the Okanagan."}, {"id": "le-vieux-pin-sgm", "color": "red", "name": "Le Vieux Pin 'SGM'", "origin": "Oliver, BC", "example": "2024 · Syrah · Grenache · Mourvèdre, Oliver", "text": "A Rhône-style blend. \"Grown in Washington\" because of the 2024 freeze."}, {"id": "mayhem-merlot", "color": "red", "name": "Mayhem Merlot", "origin": "Okanagan Falls, BC", "example": "2022 · Okanagan Falls", "text": "BC Merlot to set beside the Tuscan Merlot blends."}, {"id": "la-stella-espressivo", "color": "red", "name": "La Stella 'Espressivo'", "origin": "Osoyoos, BC", "example": "2022 · Cabernet Sauvignon · Franc, Osoyoos", "text": "An Italian-inspired winery that names its wines after musical terms."}], "extra": {"grapeTwins": [{"onList": "Pinot Grigio", "alsoKnownAs": "Pinot Gris · Alsace, Oregon"}, {"onList": "Vermentino", "alsoKnownAs": "Rolle · Provence"}, {"onList": "Trebbiano Toscano", "alsoKnownAs": "Ugni Blanc · Cognac (not the Abruzzo grape)"}, {"onList": "Schiava", "alsoKnownAs": "Trollinger, Vernatsch · Germany"}, {"onList": "Franconia", "alsoKnownAs": "Blaufränkisch, Kékfrankos, Lemberger · Austria, Hungary, Washington, BC"}, {"onList": "Primitivo", "alsoKnownAs": "Zinfandel, Tribidrag · California, Croatia"}, {"onList": "Nebbiolo", "alsoKnownAs": "Chiavennasca · its name in Valtellina"}], "studyPairs": [{"a": "Nebbiolo d'Alba", "b": "Roche Pinot Noir"}, {"a": "Carricante, Etna", "b": "Tantalus Riesling"}, {"a": "Scavino Chardonnay", "b": "Averill Creek Chardonnay"}, {"a": "Duemani Cabernet Franc", "b": "La Stella 'Espressivo'"}, {"a": "Planeta Syrah", "b": "Le Vieux Pin 'SGM'"}, {"a": "Chiaretto di Bardolino", "b": "Le Vieux Pin 'Ponderosé'"}, {"a": "Bisol Prosecco", "b": "Contratto Alta Langa"}]}, "check": {"kind": "match", "prompt": "Match each grape on our list to the name (and place) it goes by elsewhere.", "pairs": [{"left": "Pinot Grigio", "right": "Pinot Gris · Alsace, Oregon"}, {"left": "Vermentino", "right": "Rolle · Provence"}, {"left": "Trebbiano Toscano", "right": "Ugni Blanc · Cognac (not the Abruzzo grape)"}, {"left": "Schiava", "right": "Trollinger, Vernatsch · Germany"}, {"left": "Franconia", "right": "Blaufränkisch, Kékfrankos, Lemberger · Austria, Hungary, Washington, BC"}, {"left": "Primitivo", "right": "Zinfandel, Tribidrag · California, Croatia"}, {"left": "Nebbiolo", "right": "Chiavennasca · its name in Valtellina"}]}}], "p
